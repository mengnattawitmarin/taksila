name: verify-astro
on:
  push:
    branches: [verify-astro]
    paths: [tools/verify/astro_ref.py]
permissions:
  contents: write
jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install skyfield && python tools/verify/astro_ref.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add tools/verify/astro_ref.json && git commit -m "Astro reference data" && git push
