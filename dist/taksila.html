<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตักศิลา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0B08">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+Symbols&amp;family=Noto+Sans+Symbols+2&amp;display=swap">
<style>
/* Taksila — design tokens and components */
:root {
  --bg: #0D0B08;
  --surface: #15120D;
  --surface-2: #1C1811;
  --line: #2C261B;
  --line-2: #3D3424;
  --text: #F1E6CF;
  --text-2: #C9BC9F;
  --muted: #A3967D;
  --faint: #5A4E38;
  --gold: #D4AF63;
  --gold-2: #F0D89A;
  --rose: #D98C86;
  --violet: #A99BD9;
  --teal: #7FC4B4;
  --amber: #E0A458;
  --harmony: #8FB3E0;
  --tension: #E07A62;
  --serif: 'Taviraj', 'Noto Serif Thai', serif;
  --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --symbols: 'Noto Sans Symbols', 'Noto Sans Symbols 2', 'Segoe UI Symbol', serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--gold); }
a:hover { color: var(--gold-2); }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }

.app { max-width: 430px; margin: 0 auto; min-height: 100dvh; position: relative; background: var(--bg); }
.screen { padding-block: max(28px, env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.screen.no-nav { padding-bottom: 34px; }
.edge { margin-left: -20px; margin-right: -20px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type */
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; }
.label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin: 0; font-weight: 500; }
.h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.3; margin: 0; }
.h2 { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.45; margin: 0; }
.body { font-size: 14px; line-height: 1.65; color: var(--text-2); margin: 0; }
.small { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0; }
.sym { font-family: var(--symbols); }
.glow-text { text-shadow: 0 0 12px rgba(240, 216, 154, 0.5); }

/* page header */
.page-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sigil { flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid currentColor; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px color-mix(in srgb, currentColor 30%, transparent); }
.back { flex: none; width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--text); border: none; background: none; cursor: pointer; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.rule { border: none; border-top: 1px solid var(--line); margin: 0; }
.row-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row-list > * { border-bottom: 1px solid var(--line); }

/* buttons */
.btn { min-height: 52px; border-radius: 6px; border: none; background: var(--gold); color: var(--bg); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; padding: 0 18px; width: 100%; }
.btn:hover { background: var(--gold-2); color: var(--bg); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-line { background: transparent; color: var(--gold); border: 1px solid var(--line-2); }
.btn-line:hover { background: var(--surface); color: var(--gold-2); }
.link-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; background: none; border: none; color: var(--gold); cursor: pointer; padding: 0; }

.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent, var(--gold)); color: var(--text); font-weight: 600; background: var(--surface); box-shadow: 0 0 12px color-mix(in srgb, var(--accent, var(--gold)) 35%, transparent); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 44px; border: none; background: transparent; color: var(--text-2); font-size: 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--accent, var(--gold)) 12%, transparent); box-shadow: inset 0 -2px 0 var(--accent, var(--gold)); }

.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: 0 -4px; }
.tabs button { min-height: 44px; border: none; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--gold); }

.tag { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--text-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.input, .select { min-height: 48px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); padding: 0 12px; font-size: 15px; width: 100%; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 21px, calc(100% - 11px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.input:disabled, .select:disabled { color: var(--faint); background-color: var(--bg); }
.check { min-height: 44px; display: inline-flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text); font-size: 14px; cursor: pointer; padding: 0; }
.check .box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--faint); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.check[aria-pressed="true"] .box { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.step-title { display: flex; align-items: baseline; gap: 10px; font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0; }
.step-title .mono { font-size: 11px; color: var(--gold); }

.option-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; max-height: 236px; overflow-y: auto; }
.option { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border: none; background: transparent; color: var(--text); cursor: pointer; text-align: left; }
.option + .option { border-top: 1px solid var(--line); }
.option[aria-checked="true"] { background: var(--surface-2); }
.radio-dot { flex: none; width: 16px; height: 16px; border-radius: 8px; border: 1px solid var(--faint); }
.option[aria-checked="true"] .radio-dot { border: 5px solid var(--gold); box-shadow: 0 0 10px var(--gold); }

/* home */
.map-link { display: block; line-height: 0; align-self: center; border-radius: 50%; }
.big3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; }
.big3 > div { display: flex; flex-direction: column; gap: 2px; }
.big3 > div + div { border-left: 1px solid var(--line); }
.big3 .v { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.score-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.score-grid > div { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-2); }
.bars { display: flex; gap: 2px; }
.bars span { flex: 1 1 0; height: 3px; border-radius: 1px; background: var(--line); }
.bars span.on { background: var(--gold); }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
.mini { flex: none; width: 152px; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.mini .t { font-family: var(--serif); font-size: 15px; font-weight: 600; }
.tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tool { text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tool .sigil { width: 36px; height: 36px; }
.tool .n { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.ask-link { text-decoration: none; color: var(--text); border: 1px solid var(--line-2); border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }

/* home redesign */
.screen.home { gap: 14px; padding-top: max(20px, env(safe-area-inset-top, 0px)); }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hh-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hh-title { margin: 0; font-family: var(--serif); font-size: 21px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: var(--text); }
.hh-big3 { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--text-2); }
.hh-big3 span { white-space: nowrap; }
.hh-map { flex: none; width: 76px; height: 76px; border-radius: 50%; display: block; box-shadow: 0 0 0 1px rgba(212,175,99,.35), 0 0 24px rgba(212,175,99,.18); }
.hh-map svg { display: block; width: 76px; height: 76px; }
.day-hero { position: relative; overflow: hidden; gap: 12px; background: radial-gradient(ellipse 70% 60% at 20% 30%, rgba(124,96,200,.14), transparent 70%), radial-gradient(ellipse 60% 50% at 90% 0%, rgba(212,175,99,.10), transparent 70%), var(--surface); }
.dh-top { display: flex; justify-content: space-between; align-items: center; }
.dh-main { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; }
.dh-rings { width: 120px; height: 120px; display: block; }
.ring-arc { animation: ringIn 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes ringIn { from { stroke-dasharray: 0 var(--c); } }
.dh-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dh-mood { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--gold-2); line-height: 1.3; }
.dh-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.dh-legend li { display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.dh-legend i { width: 9px; height: 9px; border-radius: 5px; }
.dh-legend b { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text); }
.dh-head { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); padding-top: 10px; border-top: 1px solid var(--line); }
.day-hero { padding: 14px 16px; gap: 10px; }
.day-hero .drawer-toggle { min-height: 40px; padding: 6px 10px; }
.day-hero:not(.open) > .fold { margin-top: -10px; }
.ausp-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-decoration: none; color: var(--text); border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(90deg, rgba(224,164,88,.08), transparent 60%), var(--surface); }
.as-cell { display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; min-width: 0; }
.as-cell + .as-cell { border-left: 1px solid var(--line); }
.as-l { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.as-v { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.as-v i { width: 10px; height: 10px; border-radius: 5px; flex: none; }
.day-hero .drawer-toggle { margin-top: 0; }
@media (prefers-reduced-motion: reduce) { .ring-arc { animation: none; } }

/* prayer */
.rem-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--text); border: 1px solid rgba(212,175,99,.35); background: linear-gradient(90deg, rgba(212,175,99,.10), transparent 80%); }
.rem-chip.fix { border-color: rgba(224,122,98,.45); background: linear-gradient(90deg, rgba(224,122,98,.10), transparent 80%); }
.rem-ic { flex: none; width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--gold-2); border: 1px solid rgba(212,175,99,.45); }
.rem-chip.fix .rem-ic { color: #F2B3A3; border-color: rgba(224,122,98,.5); }
.rem-t { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rem-k { font-size: 13px; font-weight: 600; }
.rem-r { font-size: 11px; color: var(--text-2); line-height: 1.4; }
.pr-purpose, .pr-quick { display: flex; flex-direction: column; gap: 10px; }
.pu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pu { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 4px 10px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(212,175,99,.06), var(--surface)); color: var(--text); font: inherit; cursor: pointer; text-align: center; }
.pu-ic { font-size: 20px; line-height: 1.2; color: var(--gold-2); }
.pu b { font-size: 13px; font-weight: 600; }
.pu span:last-child { font-size: 10px; color: var(--muted); line-height: 1.3; }
.pu[aria-pressed="true"] { border-color: var(--gold); background: rgba(212,175,99,.12); box-shadow: 0 0 16px rgba(212,175,99,.2); }
.pu-note { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(212,175,99,.3); background: rgba(212,175,99,.06); font-size: 13px; line-height: 1.6; color: var(--text-2); }
.pu-note b { color: var(--gold-2); }
.pr-recs { display: flex; flex-direction: column; gap: 8px; }
.pr-cats { flex-wrap: nowrap; }
.pr-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pr-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--text); }
.pr-ic { flex: none; width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--gold-2); background: radial-gradient(circle, rgba(212,175,99,.18), transparent 70%); border: 1px solid rgba(212,175,99,.35); }
.pr-ic b { font-family: var(--serif); font-size: 15px; }
.pr-it { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pr-it b { font-family: var(--serif); font-size: 16px; }
.pr-it span { font-size: 12px; color: var(--text-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pr-badge { flex: none; display: flex; flex-direction: column; align-items: center; font-family: var(--mono); font-size: 16px; color: var(--gold-2); }
.pr-badge i { font-style: normal; font-family: var(--sans, inherit); font-size: 10px; color: var(--muted); }
.pr-head { display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: center; }
.pr-title { margin: 0; font-family: var(--serif); font-size: 24px; color: var(--text); }
.pr-origin { margin: 0; font-size: 12px; color: var(--text-2); padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.25); }
.pr-origin b { color: var(--gold); margin-right: 4px; }
.pr-count { font-size: 12px; padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(212,175,99,.45); color: var(--gold-2); }
.pr-text { padding: 20px 16px; border-radius: 14px; background: linear-gradient(180deg, #17130C, #110E09); border: 1px solid rgba(212,175,99,.25); text-align: center; }
.pr-text p { margin: 0; font-family: var(--serif); font-size: 17px; line-height: 1.8; color: #F1E6CF; }
.pr-text.heart p { font-size: 34px; letter-spacing: .12em; color: var(--gold-2); text-shadow: 0 0 18px rgba(240,216,154,.35); }
.pr-note { font-size: 12px !important; font-family: var(--mono) !important; color: var(--gold) !important; letter-spacing: .1em; margin: 16px 0 6px !important; }
.pr-note:first-child { margin-top: 0 !important; }
.pr-stanza { position: relative; margin: 0 0 14px; padding: 0 14px; }
.pr-n { position: absolute; left: -6px; top: 6px; font-family: var(--serif); font-size: 12px; color: var(--muted); }
.pr-prose { font-size: 16px !important; text-align: left; margin-bottom: 10px !important; }
.pr-counter { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pr-tap { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: radial-gradient(circle, rgba(212,175,99,.16), rgba(13,11,8,0) 70%); }
.pr-tap:active { transform: scale(.97); }
.pr-tap .mala { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pr-num b { font-size: 38px; color: var(--text); }
.pr-num i { font-style: normal; font-size: 12px; color: var(--muted); }
.pr-tap.full .pr-num b { color: var(--gold-2); text-shadow: 0 0 16px rgba(240,216,154,.6); }
.pr-ctrl { display: flex; gap: 12px; align-items: center; }

/* install card */
#install-slot:empty { display: none; }
.install-card { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(212,175,99,.4); background: linear-gradient(120deg, rgba(212,175,99,.14), rgba(124,96,200,.10) 70%), var(--surface); }
.ic-logo img { display: block; border-radius: 11px; box-shadow: 0 0 14px rgba(212,175,99,.35); }
.ic-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ic-text b { font-size: 15px; color: var(--text); }
.ic-text span { font-size: 12px; color: var(--text-2); }
.ic-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.ic-btn { flex: 1; min-height: 42px; font-size: 15px; }
.ic-x { min-height: 42px; padding: 0 10px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
.ic-steps { grid-column: 1 / -1; margin: 0; padding: 10px 12px 10px 30px; border-radius: 10px; background: rgba(0,0,0,.25); font-size: 13px; line-height: 1.7; color: var(--text-2); }
.ic-steps b { color: var(--gold-2); }

/* oracle grid: the divination rooms */
.oracle-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.oracle-grid .oracle .small { display: none; }
.oracle-grid .oracle .n { font-size: 13px; }
.oracle-grid .oracle .sigil { width: 34px; height: 34px; }
.oracle { --c: var(--gold); text-decoration: none; color: var(--text); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, var(--surface)), var(--surface)); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px 9px; gap: 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; transition: border-color .2s, transform .2s; }
.oracle:active { transform: scale(.97); }
.oracle:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
.oracle .sigil { color: var(--c); width: 36px; height: 36px; }
.oracle .n { font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.2; }
.oracle .small { font-size: 11px; line-height: 1.3; }

/* live daily drawer */
.live-dot { width: 7px; height: 7px; border-radius: 4px; background: var(--gold-2); box-shadow: 0 0 8px var(--gold-2); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.fold-in { overflow: hidden; min-height: 0; }
.open > .fold { grid-template-rows: 1fr; }
.chev { display: flex; color: var(--muted); transition: transform .3s ease; }
.open > button > .chev { transform: rotate(180deg); }

/* identity tab */

/* tarot */
.t-hero { position: relative; margin: -4px calc(-1 * max(16px, env(safe-area-inset-left))) 0; padding: 18px 0 6px; overflow: hidden;

  transform: translateX(calc((var(--k) - var(--m)) * 11px)) rotate(calc((var(--k) - var(--m)) * 6deg)); transform-origin: 50% 150%; }

.who-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.who-opt, .t-sp { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, #17141E, var(--surface)); color: var(--text-2); font: inherit; text-align: left; cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .15s; }

.who-opt b, .t-sp b { font-family: var(--serif); font-size: 17px; color: var(--text); }
.who-opt span, .t-sp span { font-size: 12px; line-height: 1.35; }
.who-opt[aria-pressed="true"], .t-sp[aria-pressed="true"] { border-color: var(--violet); background: linear-gradient(180deg, rgba(124,96,200,.22), rgba(124,96,200,.06)); box-shadow: 0 0 22px rgba(169,155,217,.22), inset 0 0 0 1px rgba(169,155,217,.25); }
.who-opt[aria-pressed="true"]::after, .t-sp[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 10px; right: 12px; width: 18px; height: 18px; border-radius: 9px; background: var(--violet); color: #15121D; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.who-card { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.t-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sp-mini { width: 44px; height: 36px; margin-bottom: 6px; fill: rgba(169,155,217,.12); stroke: #8E80C4; stroke-width: 1.2; }
.t-sp[aria-pressed="true"] .sp-mini { fill: rgba(240,216,154,.18); stroke: #F0D89A; }

.q-box { position: relative; display: block; }

.q-input { width: 100%; box-sizing: border-box; min-height: 64px; padding: 14px 14px 12px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 15px; line-height: 1.5; resize: none; }

.t-cta { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; font-size: 16px; background: linear-gradient(90deg, #C9A24E, #F0D89A 50%, #C9A24E); background-size: 200% 100%; animation: shimmer 4s linear infinite; box-shadow: 0 8px 24px rgba(212,175,99,.25); }

@media (prefers-reduced-motion: reduce) { .deck-stack, .t-stars i, .t-cta { animation: none; } }
.t-row { display: flex; justify-content: center; gap: 10px; }
.t-row .t-slot { width: 104px; }
.t-row.n1 .t-slot { width: 150px; }
.t-row.n2 .t-slot { width: 130px; }
.t-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.t-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); }
.t-houses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 6px; }
.tc { display: block; width: 100%; aspect-ratio: 300 / 520; padding: 0; border: 0; background: none; perspective: 800px; cursor: pointer; border-radius: 6px; }
.tc-in { position: relative; display: block; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }

.tc-back, .tc-front { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.45); }

.reading { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

#tarot-reading { display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 360px) { .reading { grid-template-columns: 64px minmax(0, 1fr); } .r-img { width: 64px; } .t-row .t-slot { width: 92px; } }

/* luck: ping-pong globe */
.globe-stage { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 6px; }
.globe { position: relative; width: min(78vw, 290px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; touch-action: none;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.22), rgba(255,255,255,0) 22%), radial-gradient(circle at 50% 60%, rgba(224,164,88,.10), rgba(13,11,8,.2) 70%), rgba(255,255,255,.025);
  box-shadow: inset 0 0 0 2px rgba(232,199,122,.55), inset 0 -18px 40px rgba(224,164,88,.18), inset 0 10px 30px rgba(255,255,255,.06), 0 0 40px rgba(224,164,88,.12); }
.globe::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(ellipse 36% 14% at 34% 18%, rgba(255,255,255,.35), transparent 70%), radial-gradient(ellipse 10% 30% at 86% 56%, rgba(255,255,255,.12), transparent 70%); }

.pball { position: absolute; left: 0; top: 0; padding: 0; border: 0; border-radius: 50%; cursor: pointer; will-change: transform; transition: opacity .4s, scale .4s;
  background: radial-gradient(circle at 34% 30%, #FFFFFF, #F1EDE4 38%, #C9C1B0 100%); box-shadow: 0 2px 4px rgba(0,0,0,.45); }
.pball.h1 { background: radial-gradient(circle at 34% 30%, #FFE2B8, #F39A3D 45%, #B4601C 100%); }
.pball.h2 { background: radial-gradient(circle at 34% 30%, #FFF6D8, #EBCB7A 45%, #A9832F 100%); }
.pball.picked { scale: 2.2; opacity: 0; }
.b-slots { display: flex; justify-content: center; gap: 16px; }
.b-slot { width: 62px; height: 62px; border-radius: 50%; border: 1px dashed var(--line-2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); color: var(--faint); }
.b-slot.on { border: 0; background: radial-gradient(circle at 34% 30%, #FFFFFF, #F1EDE4 38%, #C9C1B0 100%); box-shadow: 0 6px 16px rgba(0,0,0,.5), 0 0 22px rgba(224,164,88,.35); animation: ballIn .7s cubic-bezier(.2,.9,.3,1.3); }
.b-slot.on.h1 { background: radial-gradient(circle at 34% 30%, #FFE2B8, #F39A3D 45%, #B4601C 100%); }
.b-slot.on.h2 { background: radial-gradient(circle at 34% 30%, #FFF6D8, #EBCB7A 45%, #A9832F 100%); }
.b-slot.on b { font-family: var(--mono); font-size: 28px; font-weight: 600; color: #1C140A; animation: digitIn .9s ease-out; }
@keyframes ballIn { from { transform: translateY(-90px) scale(.4) rotate(-200deg); opacity: 0; } }
@keyframes digitIn { 0%, 45% { opacity: 0; transform: scale(.3); } 100% { opacity: 1; transform: none; } }

/* luck: numbered incense */
.inc-stage { position: relative; height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.i-stick-wrap { position: absolute; bottom: 70px; left: 50%; width: 18px; height: 290px; transform: translateX(-50%); }
.i-stick { position: relative; width: 100%; height: 100%; }
.i-body { position: absolute; left: 0; right: 0; top: 5%; bottom: 0; border-radius: 3px 3px 0 0;
  background: linear-gradient(180deg, #C0392B 0%, #A52A1E 72%, #C9A86A 72.5%, #9A7A40 100%); box-shadow: inset -3px 0 4px rgba(0,0,0,.35), inset 2px 0 3px rgba(255,255,255,.15); }

.i-ember { position: absolute; left: 50%; top: 5%; width: 16px; height: 9px; transform: translate(-50%, -50%); border-radius: 50%; opacity: 0; background: radial-gradient(#FFF1C2, #FF8A2A 45%, rgba(255,90,20,0) 72%); box-shadow: 0 0 16px 6px rgba(255,120,40,.55); z-index: 3; }
.lit .i-ember { opacity: 1; animation: ember .5s ease-in-out infinite alternate; }
@keyframes ember { to { box-shadow: 0 0 22px 9px rgba(255,140,50,.75); } }
.i-smoke { position: absolute; left: 50%; top: 5%; width: 0; height: 0; opacity: 0; }
.lit .i-smoke { opacity: 1; }
.i-smoke i { position: absolute; left: -6px; bottom: 0; width: 12px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse at 50% 80%, rgba(220,212,196,.35), transparent 70%); filter: blur(3px); animation: smoke 3.2s linear infinite; }
.i-smoke i:nth-child(2) { animation-delay: 1.1s; } .i-smoke i:nth-child(3) { animation-delay: 2.2s; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(18px, -150px) scale(2.4) rotate(18deg); opacity: 0; } }
.i-fall { position: absolute; left: -2px; right: -2px; border-radius: 4px; background: linear-gradient(90deg, #6F6A63, #B9B3A8 45%, #8C867D); animation: ashFall 1.5s cubic-bezier(.5,0,.8,.4) forwards; z-index: 4; }

@keyframes ashFall { 0% { transform: none; } 20% { transform: translateX(4px) rotate(6deg); } 100% { transform: translate(26px, 300px) rotate(70deg); opacity: 0; } }
.i-pot { width: 230px; display: block; filter: drop-shadow(0 10px 20px rgba(0,0,0,.6)); position: relative; z-index: 5; }
.b-slots.inc { gap: 12px; }
.n-slot { width: 58px; height: 70px; border-radius: 8px; border: 1px dashed var(--line-2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 32px; color: var(--faint); }
.n-slot.on { border: 1px solid #8C867D; color: #F2E7D0; background: linear-gradient(180deg, #2A2724, #151310); box-shadow: 0 0 18px rgba(255,140,50,.25); animation: pop .5s ease-out; }

/* luck: เซียมซี */
.ss-stage { position: relative; height: 320px; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
.ss-cyl { position: relative; width: 140px; margin-bottom: 40px; transform: rotate(-16deg); user-select: none; -webkit-user-select: none; transform-origin: 50% 100%; cursor: grab; touch-action: none; filter: drop-shadow(0 14px 20px rgba(0,0,0,.6)); z-index: 2; }
.ss-cyl svg { display: block; width: 100%; }
.ss-cyl.shaking { animation: rattle .16s ease-in-out infinite; cursor: grabbing; }
.ss-cyl.held { cursor: grabbing; filter: drop-shadow(0 18px 24px rgba(0,0,0,.7)) drop-shadow(0 0 16px rgba(242,213,140,.25)); }
.ss-cyl.active .ss-sticks { animation: jiggle .12s linear infinite; }
.ss-cyl.clack svg { animation: clack .14s ease-out; }
@keyframes clack { 50% { transform: translateY(-3px) rotate(2deg); } }
.ss-rise { position: absolute; left: 50%; top: 12px; width: 11px; height: 118px; margin-left: -2px; border-radius: 2px; opacity: 0; z-index: 0; transition: opacity .3s;
  background: linear-gradient(90deg, #A9843F, #F5E2B0 50%, #A9843F); box-shadow: 0 0 12px rgba(242,213,140,.55); }
.ss-rise::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 16px; background: #B3271C; border-radius: 2px 2px 0 0; }
.ss-rise b { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); writing-mode: vertical-rl; font-family: var(--serif); font-size: 11px; font-weight: 700; color: #5E140F; }
.ss-rise.fly { animation: riseFly .4s ease-in forwards; }
@keyframes riseFly { to { transform: translateY(-170px) rotate(-30deg); opacity: 0; } }
.ss-cyl svg { position: relative; z-index: 1; }
.ss-cyl.shaking .ss-sticks { animation: jiggle .12s linear infinite; }
@keyframes rattle { 0% { transform: rotate(-24deg) translateY(-4px); } 50% { transform: rotate(-9deg) translateY(2px); } 100% { transform: rotate(-24deg) translateY(-4px); } }
@keyframes jiggle { 50% { transform: translateY(-4px); } }
.ss-out { position: absolute; left: 50%; bottom: 140px; width: 12px; height: 128px; margin-left: -22px; border-radius: 2px; opacity: 0; z-index: 3;
  background: linear-gradient(90deg, #A9843F, #EED7A0 50%, #A9843F); box-shadow: 0 4px 10px rgba(0,0,0,.5); }
.ss-out::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 18px; background: #B3271C; border-radius: 2px 2px 0 0; }
.ss-out b { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%) rotate(-90deg); font-family: var(--serif); font-size: 14px; font-weight: 700; color: #5E140F; white-space: nowrap; }
.fallen .ss-out { animation: stickFall 1.2s cubic-bezier(.3,.1,.4,1) forwards; }
@keyframes stickFall { 0% { opacity: 1; transform: translate(-40px, -120px) rotate(-30deg); } 35% { opacity: 1; transform: translate(-30px, -60px) rotate(-30deg); } 100% { opacity: 1; transform: translate(70px, 128px) rotate(84deg); } }
.ss-floor { position: absolute; left: 10%; right: 10%; bottom: 18px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse, rgba(224,164,88,.18), transparent 70%); }
.ss-meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.ss-meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #B3271C, #F2D58C); box-shadow: 0 0 10px rgba(242,213,140,.6); }
.ss-shake { user-select: none; -webkit-user-select: none; touch-action: none; }
.slip { position: relative; background: #F4EAD5; color: #3A2A14; border-radius: 4px; padding: 22px 20px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 1px solid #C9A86A; outline: 3px double #A8231A; outline-offset: -10px; display: flex; flex-direction: column; gap: 12px; animation: slipIn .6s ease-out; }
@keyframes slipIn { from { transform: translateY(24px) rotate(-1.5deg); opacity: 0; } }
.slip-head { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
.slip-no { font-family: var(--serif); font-size: 22px; font-weight: 700; color: #A8231A; }
.slip-seal { font-family: var(--serif); font-size: 14px; font-weight: 700; padding: 6px 10px; border: 2px solid; border-radius: 50%; transform: rotate(-8deg); }
.slip-verse { text-align: center; font-family: var(--serif); font-size: 17px; line-height: 1.7; padding: 4px 8px; border-top: 1px solid #D9C49A; border-bottom: 1px solid #D9C49A; }
.slip-verse p { margin: 0; }
.slip-sum { margin: 0; font-size: 15px; font-weight: 600; text-align: center; padding: 0 8px; }
.slip-topics { margin: 0; padding: 0 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }

.slip-topics dd { margin: 2px 0 0; font-size: 13px; line-height: 1.45; }
.slip-tip { margin: 0 6px; padding: 10px 12px; background: rgba(168,35,26,.07); border-radius: 4px; font-size: 13px; }

.slip-foot { margin: 0; text-align: center; font-size: 10px; color: #8A7652; }
@media (prefers-reduced-motion: reduce) { .ss-cyl.shaking, .ss-cyl.shaking .ss-sticks, .i-smoke i, .lit .i-ember { animation: none; } }

/* tarot: reading for someone else */
.who-card { gap: 10px; }
.dob-row { display: grid; grid-template-columns: 1fr 1.6fr 1.3fr; gap: 8px; }
.for-chip { align-self: center; margin: 0; padding: 4px 12px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--violet) 45%, var(--line)); font-size: 13px; color: var(--text); }
.for-chip span { color: var(--violet); margin-right: 2px; }

/* 12-house zodiac wheel */
.t-wheel { position: relative; width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 100 / 106; }
.w-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.w-sec > path { fill: rgba(212,175,99,.03); stroke: #3A3224; stroke-width: .25; transition: fill .3s; }
.w-sec.on > path { fill: rgba(169,155,217,.22); stroke: var(--violet); }
.w-ic { fill: none; stroke: #D4AF63; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.w-ic path, .w-ic circle, .w-ic ellipse, .w-ic rect { fill: none; stroke: inherit; }
.w-sec.on .w-ic { stroke: #F0D89A; }
.w-slot { position: absolute; width: 11%; transform: translate(-50%, -50%); }
.w-slot .tc { box-shadow: none; }
.w-slot .p-slot { font-size: 11px; }
.w-slot .p-slot b { font-weight: 500; }
.w-center { position: absolute; left: 50%; top: 50%; width: 32%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; pointer-events: none; }
.w-center .eyebrow { font-size: 9px; letter-spacing: .12em; }
.w-center b { font-family: var(--serif); font-size: 15px; line-height: 1.25; color: var(--text); }
.w-center span:last-child { font-size: 10px; color: var(--muted); }

/* pick-your-own fan */
.p-slots { display: flex; justify-content: center; gap: 10px; }
.p-slots.h { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.p-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; }
.p-slots.n1 .p-wrap { width: 80px; }
.p-slots.h .p-wrap { width: auto; }
.p-slot { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 300 / 520; border-radius: 5px; border: 1px dashed var(--line-2); color: var(--faint); font-family: var(--mono); overflow: hidden; }
.p-slot.next { border-color: var(--violet); color: var(--violet); box-shadow: 0 0 14px rgba(169,155,217,.35); animation: breathe 2s ease-in-out infinite; }
.p-slot.on { border: 0; animation: drop .45s cubic-bezier(.2,.8,.3,1.2); }
.p-slot.on svg { display: block; width: 100%; height: 100%; }
@keyframes drop { from { transform: translateY(40px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes breathe { 50% { box-shadow: 0 0 4px rgba(169,155,217,.15); } }
.p-hint { text-align: center; font-size: 14px; color: var(--text-2); }
.p-hint b { color: var(--violet); }
.fan-wrap { overflow-x: auto; overflow-y: hidden; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: 14px 0 6px; scrollbar-width: none; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); -webkit-overflow-scrolling: touch; }
.fan-wrap::-webkit-scrollbar { display: none; }
.fan { display: flex; width: max-content; padding: 0 40vw; height: 196px; align-items: flex-start; }
.fan-card { flex: none; width: 76px; aspect-ratio: 300 / 520; margin-right: -54px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: none; cursor: pointer; box-shadow: -3px 2px 8px rgba(0,0,0,.55); transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 100%; transition: transform .3s ease, opacity .35s ease; }
.fan-card svg { display: block; width: 100%; height: 100%; }
.fan-card:hover, .fan-card:focus-visible { transform: translateY(calc(var(--y) - 16px)) rotate(var(--r)); }
.fan-card.taken { opacity: 0; transform: translateY(calc(var(--y) - 70px)) rotate(var(--r)) scale(.9); pointer-events: none; }
.fan-wrap.shuffle .fan-card { animation: deal .6s ease-out backwards; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes deal { from { transform: translateY(60px) rotate(0); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fan-card, .p-slot.on, .p-slot.next, .fan-wrap.shuffle .fan-card { animation: none; transition: none; } }

/* sixth sense */
.sense-hero { flex-direction: row; align-items: center; gap: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--violet) 10%, var(--surface)), var(--surface)); }
.sense-hero svg { flex: none; }
.sense-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.sense { border-bottom: 1px solid var(--line); }
.sense-head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 0; background: none; border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.sense-ic { flex: none; width: 34px; height: 34px; border-radius: 17px; border: 1px solid color-mix(in srgb, var(--violet) 50%, var(--line)); display: flex; align-items: center; justify-content: center; color: var(--violet); font-size: 15px; }
.sense .n { font-size: 14px; font-weight: 600; }
.sense .lv { font-size: 12px; font-weight: 600; white-space: nowrap; }
.sense-body { padding: 0 0 12px 46px; display: flex; flex-direction: column; gap: 8px; }

/* ฤกษ์ finder */
.ev-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ev { min-height: 44px; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font: inherit; font-size: 13px; line-height: 1.25; cursor: pointer; }
.ev[aria-pressed="true"] { border-color: var(--amber); color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--amber) 12%, var(--surface)); }
.rk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rk { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.rk.open { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.rk-head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 12px; background: none; border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.rk-n { flex: none; width: 26px; height: 26px; border-radius: 13px; border: 1px solid var(--gold); color: var(--gold-2); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.rk:first-child .rk-n { background: var(--gold); color: var(--bg); }
.rk-date { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.rk-score { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.rk-score b { font-size: 15px; color: var(--gold-2); }
.rk-body { padding: 0 12px 14px 50px; display: flex; flex-direction: column; gap: 8px; }
.why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.why li { padding-left: 18px; position: relative; }
.why li::before { position: absolute; left: 0; top: 0; font-weight: 700; }
.why .ok::before { content: '✓'; color: var(--harmony); }
.why .no::before { content: '!'; color: var(--tension); left: 4px; }
@media (max-width: 360px) { .ev-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rk-body { padding-left: 12px; } }

/* seven-day strip */
.week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 8px; min-height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; cursor: pointer; }
.day.sel { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 9%, var(--surface)); }

.day .dots { display: flex; gap: 2px; }

.day-detail { gap: 8px; }

/* chart */
.legend { display: flex; gap: 16px; justify-content: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 1.5px; vertical-align: middle; margin-right: 6px; }
.el-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 20px; align-items: center; gap: 10px; font-size: 13px; }
.el-bar { height: 4px; border-radius: 2px; background: var(--surface-2); }
.el-bar span { display: block; height: 100%; border-radius: 2px; background: var(--faint); }
.el-bar span.top { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.planet-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; align-items: start; }
.planet-row .g { font-family: var(--symbols); font-size: 20px; color: var(--gold); text-align: center; text-shadow: 0 0 10px rgba(240, 216, 154, 0.5); }
.planet-row .deg { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: var(--mono); font-size: 13px; }
.timeline { border-left: 1px solid var(--line-2); margin-left: 6px; display: flex; flex-direction: column; }
.timeline .item { position: relative; padding: 0 0 22px 20px; display: flex; flex-direction: column; gap: 4px; }
.timeline .dot { position: absolute; left: -5px; top: 4px; width: 9px; height: 9px; border-radius: 5px; }
.level { align-self: flex-start; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; border: 1px solid currentColor; border-radius: 3px; padding: 2px 8px; }

/* match */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr); align-items: center; text-align: center; }
.pair .s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pair .gl { font-family: var(--symbols); font-size: 30px; }
.gauge { position: relative; width: 130px; height: 130px; }
.gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.sign-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sign-btn { min-height: 58px; border-radius: 6px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--text); background: transparent; border: 1px solid var(--line); font-size: 13px; }
.sign-btn .gl { font-family: var(--symbols); font-size: 17px; line-height: 1; color: var(--muted); }
.sign-btn.me .gl { color: var(--gold); }
.sign-btn[aria-checked="true"] { background: rgba(217, 140, 134, 0.12); border-color: var(--rose); box-shadow: 0 0 12px rgba(217, 140, 134, 0.25); }
.sign-btn[aria-checked="true"] .gl { color: var(--rose); }
.date-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 92px; gap: 8px; }

/* tarot */
.spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.spread .slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tcard { width: 100%; height: 164px; border-radius: 6px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--gold); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--line-2), 0 0 18px rgba(212, 175, 99, 0.15); color: var(--text); text-align: center; }
.tcard .num { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--gold); }
.tcard .nm { font-family: var(--serif); font-size: 13px; font-weight: 600; line-height: 1.3; }
.tcard.rev svg { transform: rotate(180deg); }
.tback { width: 100%; height: 164px; border-radius: 6px; background: #17131F; border: 1px solid var(--violet); box-shadow: 0 0 20px rgba(169, 155, 217, 0.25); padding: 8px; display: flex; align-items: center; justify-content: center; color: var(--violet); cursor: pointer; }
.tback:disabled { cursor: default; opacity: 0.5; box-shadow: none; }

/* numerology */
.lp-ring { flex: none; width: 76px; height: 76px; border-radius: 38px; border: 1px solid var(--teal); box-shadow: 0 0 20px rgba(127, 196, 180, 0.3), inset 0 0 14px rgba(127, 196, 180, 0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.num-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.num-tool { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 70px; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.num-tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.num-tool[aria-pressed="true"] { border-color: var(--teal); color: #BDEBDF; background: rgba(127,196,180,.08); box-shadow: 0 0 16px rgba(127,196,180,.18); }
.num-tool.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; min-height: 52px; font-size: 15px; gap: 10px; }
.nm-form { display: flex; flex-direction: column; gap: 10px; }
.nm-opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
.nm-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); border-left: 3px solid var(--lc); background: var(--surface); }
.nm-head { display: flex; align-items: baseline; gap: 10px; }
.nm-head span:first-child { font-size: 14px; color: var(--text-2); }
.nm-head b { font-size: 20px; color: var(--text); }
.nm-lv { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--lc); }
.lt-row { display: flex; flex-wrap: wrap; gap: 4px; }
.lt { display: flex; flex-direction: column; align-items: center; min-width: 30px; padding: 4px 3px 3px; border-radius: 7px; border: 1px solid var(--line); background: rgba(0,0,0,.2); }
.lt b { font-size: 16px; font-weight: 500; color: var(--text); line-height: 1.3; }

.lt.good { border-color: rgba(212,175,99,.7); }
.lt.kal { border-color: var(--tension); background: rgba(224,122,98,.1); }
.num-input { font-size: 22px; letter-spacing: .08em; }
.num-empty { text-align: center; padding: 18px 0; }
.num-sum { gap: 10px; background: radial-gradient(ellipse 60% 80% at 0% 0%, rgba(127,196,180,.12), transparent 70%), var(--surface); }
.ns-top { display: flex; align-items: center; gap: 14px; }
.ns-ring { flex: none; width: 72px; height: 72px; }
.ns-title { font-family: var(--serif); font-size: 19px; color: var(--text); }
.ns-note { margin: 0; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.25); }
.hex-sw { flex: none; width: 52px; height: 52px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 6px 18px rgba(0,0,0,.4); }
.hex-row { display: flex; flex-wrap: wrap; gap: 6px; }
.hex-row span { display: flex; flex-direction: column; align-items: center; min-width: 34px; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.2); }
.hex-row b { font-family: var(--mono); font-size: 17px; color: var(--text); }
.hex-row i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--teal); }
.birth-hex { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.birth-hex .hex-sw { width: 38px; height: 38px; border-radius: 10px; }
.birth-hex b { font-size: 16px; color: var(--text); letter-spacing: .06em; }
.pairs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pairs > div { border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); }

/* luck */

// ---------- time ----------
function dayNumber(date) {
  // days since 2000 Jan 0.0 UT
  return date.getTime() / 86400000 - 10956;
}

function tzOffsetMinutes(tz, ms) {
  const f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const p = {};
  for (const part of f.formatToParts(new Date(ms))) p[part.type] = part.value;
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return Math.round((asUtc - ms) / 60000);
}

// local wall-clock time at a place -> UTC Date
function localToUtc(y, m, d, h, mi, place) {
  const guess = Date.UTC(y, m - 1, d, h, mi);
  if (place.tz) {
    let off = tzOffsetMinutes(place.tz, guess);
    let utc = guess - off * 60000;
    const off2 = tzOffsetMinutes(place.tz, utc);
    if (off2 !== off) utc = guess - off2 * 60000;
    return new Date(utc);
  }
  return new Date(guess - (place.offset || 0) * 60 * 60000);
}

    if (Math.abs(dE) < 1e-7) break;
  }
  return E;
}

    case 'mars': return { N: 49.5574 + 2.11081e-5 * d, i: 1.8497 - 1.78e-8 * d, w: 286.5016 + 2.92961e-5 * d, a: 1.523688, e: 0.093405 + 2.516e-9 * d, M: 18.6021 + 0.5240207766 * d };
    case 'jupiter': return { N: 100.4542 + 2.76854e-5 * d, i: 1.303 - 1.557e-7 * d, w: 273.8777 + 1.64505e-5 * d, a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: 19.895 + 0.0830853001 * d };
    case 'saturn': return { N: 113.6634 + 2.3898e-5 * d, i: 2.4886 - 1.081e-7 * d, w: 339.3939 + 2.97661e-5 * d, a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: 316.967 + 0.0334442282 * d };
    case 'uranus': return { N: 74.0005 + 1.3978e-5 * d, i: 0.7733 + 1.9e-8 * d, w: 96.6612 + 3.0565e-5 * d, a: 19.18171 - 1.55e-8 * d, e: 0.047318 + 7.45e-9 * d, M: 142.5905 + 0.011725806 * d };
    case 'neptune': return { N: 131.7806 + 3.0173e-5 * d, i: 1.77 - 2.55e-7 * d, w: 272.8461 - 6.027e-6 * d, a: 30.05826 + 3.313e-8 * d, e: 0.008606 + 2.15e-9 * d, M: 260.2471 + 0.005995147 * d };
    default: return null;
  }
}

function orbitXYZ(el) {
  const M = rev(el.M);
  const E = kepler(M, el.e);
  const xv = el.a * (cosd(E) - el.e);
  const yv = el.a * Math.sqrt(1 - el.e * el.e) * sind(E);
  const v = atan2d(yv, xv);
  const r = Math.sqrt(xv * xv + yv * yv);
  const vw = v + el.w;
  const x = r * (cosd(el.N) * cosd(vw) - sind(el.N) * sind(vw) * cosd(el.i));
  const y = r * (sind(el.N) * cosd(vw) + cosd(el.N) * sind(vw) * cosd(el.i));
  const z = r * (sind(vw) * sind(el.i));
  return { x, y, z, r };
}

function sunData(d) {
  const w = 282.9404 + 4.70935e-5 * d;
  const e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.047 + 0.9856002585 * d);
  const E = kepler(M, e);
  const xv = cosd(E) - e;
  const yv = Math.sqrt(1 - e * e) * sind(E);
  const v = atan2d(yv, xv);
  const r = Math.sqrt(xv * xv + yv * yv);
  const lon = rev(v + w);
  return { lon, r, M, L: rev(M + w), x: r * cosd(lon), y: r * sind(lon) };
}

function moonLon(d, sun) {
  const el = { N: 125.1228 - 0.0529538083 * d, i: 5.1454, w: 318.0634 + 0.1643573223 * d, a: 60.2666, e: 0.0549, M: 115.3654 + 13.0649929509 * d };
  const p = orbitXYZ(el);
  let lon = atan2d(p.y, p.x);
  const Mm = rev(el.M), Ms = sun.M;
  const Lm = rev(el.N + el.w + el.M);
  const D = rev(Lm - sun.L);
  const F = rev(Lm - el.N);
  lon += -1.274 * sind(Mm - 2 * D) + 0.658 * sind(2 * D) - 0.186 * sind(Ms)
    - 0.059 * sind(2 * Mm - 2 * D) - 0.057 * sind(Mm - 2 * D + Ms) + 0.053 * sind(Mm + 2 * D)
    + 0.046 * sind(2 * D - Ms) + 0.041 * sind(Mm - Ms) - 0.035 * sind(D) - 0.031 * sind(Mm + Ms)
    - 0.015 * sind(2 * F - 2 * D) + 0.011 * sind(Mm - 4 * D);
  return rev(lon);
}

function plutoHelio(d) {
  const S = 50.03 + 0.033459652 * d;
  const P = 238.95 + 0.003968789 * d;
  let lon = 238.9508 + 0.00400703 * d
    - 19.799 * sind(P) + 19.848 * cosd(P) + 0.897 * sind(2 * P) - 4.956 * cosd(2 * P)
    + 0.61 * sind(3 * P) + 1.211 * cosd(3 * P) - 0.341 * sind(4 * P) - 0.19 * cosd(4 * P)
    + 0.128 * sind(5 * P) - 0.034 * cosd(5 * P) - 0.038 * sind(6 * P) + 0.031 * cosd(6 * P)
    + 0.02 * sind(S - P) - 0.01 * cosd(S - P);
  const lat = -3.9082 - 5.453 * sind(P) - 14.975 * cosd(P) + 3.527 * sind(2 * P) + 1.673 * cosd(2 * P)
    - 1.051 * sind(3 * P) + 0.328 * cosd(3 * P) + 0.179 * sind(4 * P) - 0.292 * cosd(4 * P)
    + 0.019 * sind(5 * P) + 0.1 * cosd(5 * P) - 0.031 * sind(6 * P) - 0.026 * cosd(6 * P)
    + 0.011 * cosd(S - P);
  const r = 40.72 + 6.68 * sind(P) + 6.9 * cosd(P) - 1.18 * sind(2 * P) - 0.03 * cosd(2 * P)
    + 0.15 * sind(3 * P) - 0.14 * cosd(3 * P);
  lon += 3.82394e-5 * d; // J2000 -> equinox of date
  return { x: r * cosd(lat) * cosd(lon), y: r * cosd(lat) * sind(lon), z: r * sind(lat) };
}

function helio(id, d) {
  if (id === 'pluto') return plutoHelio(d);
  const el = elements(id, d);
  const p = orbitXYZ(el);
  if (id === 'jupiter' || id === 'saturn' || id === 'uranus') {
    const Mj = rev(19.895 + 0.0830853001 * d);
    const Ms = rev(316.967 + 0.0334442282 * d);
    const Mu = rev(142.5905 + 0.011725806 * d);
    let lon = atan2d(p.y, p.x);
    let lat = atan2d(p.z, Math.sqrt(p.x * p.x + p.y * p.y));
    if (id === 'jupiter') {
      lon += -0.332 * sind(2 * Mj - 5 * Ms - 67.6) - 0.056 * sind(2 * Mj - 2 * Ms + 21) + 0.042 * sind(3 * Mj - 5 * Ms + 21)
        - 0.036 * sind(Mj - 2 * Ms) + 0.022 * cosd(Mj - Ms) + 0.023 * sind(2 * Mj - 3 * Ms + 52) - 0.016 * sind(Mj - 5 * Ms - 69);
    } else if (id === 'saturn') {
      lon += 0.812 * sind(2 * Mj - 5 * Ms - 67.6) - 0.229 * cosd(2 * Mj - 4 * Ms - 2) + 0.119 * sind(Mj - 2 * Ms - 3)
        + 0.046 * sind(2 * Mj - 6 * Ms - 69) + 0.014 * sind(Mj - 3 * Ms + 32);
      lat += -0.02 * cosd(2 * Mj - 4 * Ms - 2) + 0.018 * sind(2 * Mj - 6 * Ms - 49);
    } else {
      lon += 0.04 * sind(Ms - 2 * Mu + 6) + 0.035 * sind(Ms - 3 * Mu + 33) - 0.015 * sind(Mj - Mu + 20);
    }
    return { x: p.r * cosd(lat) * cosd(lon), y: p.r * cosd(lat) * sind(lon), z: p.r * sind(lat) };
  }
  return p;
}

function lonAt(id, d) {
  const sun = sunData(d);
  if (id === 'sun') return sun.lon;
  if (id === 'moon') return moonLon(d, sun);
  const h = helio(id, d);
  return rev(atan2d(h.y + sun.y, h.x + sun.x));
}

// All planet longitudes for a UTC date. Includes retrograde flags.
function planetPositions(date) {
  const d = dayNumber(date);
  const out = {};
  for (const p of PLANETS) {
    const lon = lonAt(p.id, d);
    let retro = false;
    if (p.id !== 'sun' && p.id !== 'moon') {
      const a = lonAt(p.id, d - 0.5), b = lonAt(p.id, d + 0.5);
      let diff = b - a;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      retro = diff < 0;
    }
    out[p.id] = { lon, retro };
  }
  return out;
}

function angles(date, latDeg, lonDeg) {
  const d = dayNumber(date);
  const sun = sunData(d);
  const ecl = 23.4393 - 3.563e-7 * d;
  const ut = (date.getTime() / 3600000) % 24;
  const ramc = rev(sun.L + 180 + ut * 15 + lonDeg);
  const asc = rev(atan2d(cosd(ramc), -(sind(ramc) * cosd(ecl) + tand(latDeg) * sind(ecl))));
  const mc = rev(atan2d(sind(ramc), cosd(ramc) * cosd(ecl)));
  return { asc, mc };
}

const signOf = (lon) => Math.floor(rev(lon) / 30);
function fmtDeg(lon) {
  const inSign = rev(lon) % 30;
  let deg = Math.floor(inSign);
  let min = Math.round((inSign - deg) * 60);
  if (min === 60) { deg += 1; min = 0; }
  return String(deg).padStart(2, '0') + '°' + String(min).padStart(2, '0') + '′';
}
const angDist = (a, b) => { const x = Math.abs(rev(a) - rev(b)) % 360; return x > 180 ? 360 - x : x; };

function findAspect(a, b, orbScale = 1) {
  const dist = angDist(a, b);
  for (const asp of ASPECTS) {
    const off = Math.abs(dist - asp.angle);
    if (off <= asp.orb * orbScale) return { ...asp, off };
  }
  return null;
}

// ---------- natal chart ----------
function computeChart(profile) {
  const t = profile.timeKnown ? { h: profile.hour, m: profile.minute } : { h: 12, m: 0 };
  const yCE = profile.yearBE - 543;
  const utc = localToUtc(yCE, profile.month, profile.day, t.h, t.m, profile.place);
  const pos = planetPositions(utc);
  let asc = null, mc = null;
  if (profile.timeKnown) {
    const a = angles(utc, profile.place.lat, profile.place.lon);
    asc = a.asc; mc = a.mc;
  }
  // whole-sign houses from the rising sign (or the Sun sign when the time is unknown)
  const firstSign = asc != null ? signOf(asc) : signOf(pos.sun.lon);
  const houseOf = (lon) => ((signOf(lon) - firstSign + 12) % 12) + 1;
  const planets = PLANETS.map((p) => {
    const lon = pos[p.id].lon;
    return { ...p, lon, retro: pos[p.id].retro, sign: signOf(lon), house: houseOf(lon) };
  });
  const aspects = [];
  for (let i = 0; i < planets.length; i++) {
    for (let j = i + 1; j < planets.length; j++) {
      const scale = (planets[i].id === 'sun' || planets[i].id === 'moon') ? 1.2 : 1;
      const a = findAspect(planets[i].lon, planets[j].lon, scale);
      if (a) aspects.push({ a: planets[i], b: planets[j], ...a });
    }
  }
  aspects.sort((x, y) => x.off - y.off);
  const elementCount = [0, 0, 0, 0];
  planets.forEach((p) => { elementCount[elementOf(p.sign)] += 1; });
  const signCount = new Array(12).fill(0);
  planets.forEach((p) => { signCount[p.sign] += 1; });
  return { utc, asc, mc, firstSign, houseOf, planets, aspects, elementCount, signCount, timeKnown: profile.timeKnown };
}

// When does a slow planet leave its current sign? (scan forward)
function signExit(id, date) {
  const d0 = dayNumber(date);
  const s0 = signOf(lonAt(id, d0));
  const step = id === 'jupiter' ? 3 : 7;
  for (let k = step; k < 365 * 25; k += step) {
    if (signOf(lonAt(id, d0 + k)) !== s0) {
      // make sure it is not a short retrograde dip back
      if (signOf(lonAt(id, d0 + k + 120)) !== s0) return new Date(date.getTime() + k * 86400000);
    }
  }
  return null;
}

function transits(chart, now = new Date()) {
  const pos = planetPositions(now);
  const out = [];
  for (const id of ['saturn', 'jupiter', 'uranus', 'neptune', 'pluto']) {
    const lon = pos[id].lon;
    const sign = signOf(lon);
    const house = chart.houseOf(lon);
    const natal = chart.planets.find((p) => p.id === id);
    const isReturn = (id === 'saturn' || id === 'jupiter') && angDist(lon, natal.lon) < 10;
    const hits = [];
    for (const target of chart.planets.filter((p) => ['sun', 'moon', 'venus', 'mars', 'mercury'].includes(p.id))) {
      const a = findAspect(lon, target.lon, 0.5);
      if (a) hits.push({ target, ...a });
    }
    if (chart.asc != null) {
      const a = findAspect(lon, chart.asc, 0.5);
      if (a) hits.push({ target: { th: 'ลัคนา', glyph: 'ASC' }, ...a });
    }
    const exit = signExit(id, now);
    let weight = { saturn: 5, jupiter: 4, uranus: 3, neptune: 2, pluto: 2 }[id] + hits.length * 2 + (isReturn ? 6 : 0);
    const p = planetById(id);
    let title = (isReturn ? (id === 'saturn' ? 'ดาวเสาร์คืนเรือน' : 'ดาวพฤหัสคืนเรือน') : 'ดาว' + p.th + 'จรราศี' + SIGNS[sign].th) + ' · ภพ ' + house;
    let body = TRANSIT_TEXT[id](HOUSES[house - 1]);
    if (isReturn) body = (id === 'saturn' ? 'รอบ 29 ปีของดาวเสาร์กลับมาทับตำแหน่งเดิม ช่วงทบทวนชีวิตครั้งใหญ่ ' : 'รอบ 12 ปีของดาวพฤหัสกลับมา เริ่มวงจรการเติบโตใหม่ ') + body;
    out.push({
      id, glyph: p.glyph, lon, sign, house, retro: pos[id].retro, hits, isReturn, exit, weight, title, body,
      level: weight >= 9 ? 'HIGH' : id === 'jupiter' ? 'SUPPORT' : 'SHIFT'
    });
  }
  out.sort((a, b) => b.weight - a.weight);
  return out;
}

function offAt(id, target, angle, ms) {

// When will this aspect be exact? Returns { applying, at } (at = Date or null).
function exactness(id, target, angle, now) {
  const t0 = now.getTime();
  const o0 = offAt(id, target, angle, t0);
  const probe = id === 'moon' ? 60e3 : 3600e3;
  if (offAt(id, target, angle, t0 + probe) > o0) return { applying: false, at: null };
  if (['jupiter', 'saturn', 'uranus', 'neptune', 'pluto'].includes(id)) return { applying: true, at: null };
  const step = id === 'moon' ? 600e3 : 3 * 3600e3;
  const span = id === 'moon' ? 36 * 3600e3 : 12 * 86400e3;
  let prev = o0;
  for (let k = step; k <= span; k += step) {
    const o = offAt(id, target, angle, t0 + k);
    if (o > prev) {
      let a = Math.max(t0, t0 + k - 2 * step), b = t0 + k;
      for (let i = 0; i < 40; i++) {
        const m1 = a + (b - a) / 3, m2 = b - (b - a) / 3;
        if (offAt(id, target, angle, m1) < offAt(id, target, angle, m2)) b = m2; else a = m1;
      }
      return { applying: true, at: new Date((a + b) / 2) };
    }
    prev = o;
  }
  return { applying: true, at: null };
}

// All transit-to-natal aspects active right now, strongest first, with reasons.
function liveAspects(chart, now = new Date(), { n = 6, exact = true, only = null } = {}) {
  const d = dayNumber(now);
  const targets = chart.planets.map((p) => ({ id: p.id, th: p.th, glyph: p.glyph, lon: p.lon, sign: p.sign }));
  if (chart.asc != null) targets.push({ id: 'asc', th: 'ลัคนา', glyph: 'ASC', lon: chart.asc, sign: signOf(chart.asc) });
  const out = [];
  for (const m of PLANETS) {
    if (only && !only.includes(m.id)) continue;
    const lon = lonAt(m.id, d);
    for (const t of targets) {
      const dist = angDist(lon, t.lon);
      for (const asp of ASPECTS) {
        const off = Math.abs(dist - asp.angle);
        const orb = MOVER_ORB[m.id];
        if (off > orb) continue;
        const strength = MOVER_W[m.id] * TARGET_W[t.id] * (1 - off / orb);
        out.push({ mover: { ...m, lon, sign: signOf(lon), house: chart.houseOf(lon) }, target: t, asp, off, strength });
      }
    }
  }
  out.sort((a, b) => b.strength - a.strength);
  const top = out.slice(0, n);
  for (const x of top) {
    if (exact) { const ex = exactness(x.mover.id, x.target.lon, x.asp.angle, now); x.applying = ex.applying; x.exactAt = ex.at; }
    x.reason = MOVER_ACT[x.mover.id] + TARGET_AREA[x.target.id];
    x.advice = ASPECT_ADVICE[x.asp.id];
  }
  return top;
}

// Moon phase as a Thai lunar day (tithi): 12 degrees of Moon-Sun elongation per day.
// Astronomical approximation; the official Thai calendar can differ by a day.
function lunarPhase(date) {
  const d = dayNumber(date);
  const el = rev(lonAt('moon', d) - lonAt('sun', d));
  const waxing = el < 180;
  const day = Math.min(15, Math.floor((waxing ? el : el - 180) / 12) + 1);
  const th = (waxing ? 'ขึ้น ' : 'แรม ') + day + ' ค่ำ';
  const name = el < 12 || el >= 348 ? 'จันทร์ดับ' : Math.abs(el - 180) < 12 ? 'จันทร์เต็มดวง' : waxing ? 'ข้างขึ้น' : 'ข้างแรม';
  return { elongation: el, waxing, day, th, name, lit: (1 - Math.cos(el * Math.PI / 180)) / 2 };
}

// Seven-day outlook, sampled at local noon each day. Fast planets drive the day-to-day changes.
const FAST = ['moon', 'sun', 'mercury', 'venus', 'mars'];
function weekAhead(chart, start = new Date()) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12, 0);
    const dl = daily(chart, d);
    const avg = dl.scores.reduce((a, s) => a + s.score, 0) / dl.scores.length;
    const moonLon = lonAt('moon', dayNumber(d));
    const fast = liveAspects(chart, d, { n: 12, exact: false, only: FAST });
    let tone = 0;
    for (const x of fast) tone += x.strength * (x.asp.nature === 0 ? 0.4 : x.asp.nature);
    const rating = Math.max(1, Math.min(5, Math.round(3.2 + 2 * Math.tanh(tone / 4))));
    out.push({ date: d, scores: dl.scores, avg, rating, moonSign: signOf(moonLon), moonHouse: chart.houseOf(moonLon), phase: lunarPhase(d), top: fast.slice(0, 3) });
  }
  return out;
}

function nextIngress(id, now, span, step) {
  const t0 = now.getTime();
  const s0 = signOf(lonOf(id, now));
  for (let k = step; k <= span; k += step) {
    if (signOf(lonOf(id, new Date(t0 + k))) !== s0) {
      let a = t0 + k - step, b = t0 + k;
      while (b - a > 30e3) { const m = (a + b) / 2; if (signOf(lonOf(id, new Date(m))) === s0) a = m; else b = m; }
      return { kind: 'ingress', id, at: new Date(b), sign: signOf(lonOf(id, new Date(b + 60e3))) };
    }
  }
  return null;
}
// Upcoming sign changes of the fast planets.
function upcomingIngresses(chart, now = new Date()) {
  const ev = [nextIngress('moon', now, 3 * 86400e3, 15 * 60e3)];
  for (const id of ['sun', 'mercury', 'venus', 'mars']) ev.push(nextIngress(id, now, 45 * 86400e3, 6 * 3600e3));
  return ev.filter(Boolean).map((e) => ({ ...e, house: chart.houseOf(e.sign * 30 + 1) })).sort((a, b) => a.at - b.at);
}

const PAIR_TABLE = [
  ['0° ร่วมราศี', 76, 'นิสัยคล้ายกันมาก เข้าใจกันง่าย แต่ระวังมองข้ามจุดอ่อนเดียวกัน'],
  ['30° เซมิเซ็กซ์ไทล์', 58, 'อยู่ใกล้กันแต่มองโลกต่างมุม ต้องอาศัยการเรียนรู้กัน'],
  ['60° เซ็กซ์ไทล์', 84, 'คุยกันถูกคอ ช่วยเปิดโอกาสใหม่ให้กันและกัน'],
  ['90° สแควร์', 52, 'แรงดึงดูดสูงแต่ปะทะกันง่าย ต้องตกลงกติกาให้ชัด'],
  ['120° ไทรน์', 91, 'จังหวะชีวิตสอดคล้อง อยู่ด้วยกันแล้วสบายใจ'],
  ['150° ควินคันซ์', 60, 'ความต้องการต่างกันแบบละเอียดอ่อน ต้องปรับจูนสม่ำเสมอ'],
  ['180° ออปโพสิชัน', 73, 'ขั้วตรงข้ามที่เติมเต็มกัน ดึงดูดแรงแต่ต้องหาจุดกึ่งกลาง']
];

function compatibility(mySign, theirSign, myChart, theirPositions) {
  const diff = (theirSign - mySign + 12) % 12;
  const k = Math.min(diff, 12 - diff);
  const row = PAIR_TABLE[k];
  let score = row[1];
  const tags = [row[0]];
  const e1 = elementOf(mySign), e2 = elementOf(theirSign);
  const friendly = (e1 - e2 + 4) % 2 === 0;
  tags.push('ธาตุ' + ELEMENTS[e1].th + ' × ธาตุ' + ELEMENTS[e2].th + (friendly ? ' · ส่งเสริม' : ' · ต่างกัน'));
  const links = [];
  if (myChart && theirPositions) {
    score = Math.round(score * 0.6 + 30);
    const mine = ['sun', 'moon', 'venus', 'mars'];
    for (const a of mine) for (const b of mine) {
      const asp = findAspect(myChart.planets.find((p) => p.id === a).lon, theirPositions[b].lon, 0.7);
      if (asp) {
        score += asp.nature === 0 ? 3 : asp.nature * 4;
        links.push(planetById(a).glyph + ' ' + asp.th + ' ' + planetById(b).glyph);
      }
    }
    score = Math.max(35, Math.min(98, score));
  }
  return { score, reading: row[2], tags, links };
}

// Clockwise order of the ทักษา wheel, and the eight positions counted from the owner.
const WHEEL = [1, 2, 3, 4, 7, 5, 8, 6];

  { id: 'boriwan', th: 'บริวาร', use: 'คนรอบตัว ครอบครัว ลูกน้อง', tone: 1 },

];

// Returns the eight positions with the planet that sits in each, starting from `owner`.
function thaksa(owner) {
  const start = WHEEL.indexOf(owner);
  return POSITIONS.map((pos, i) => ({ ...pos, planet: WHEEL[(start + i) % 8] }));
}
const posOf = (owner, planet) => thaksa(owner).find((x) => x.planet === planet);
const at = (owner, id) => thaksa(owner).find((x) => x.id === id).planet;

// Thai day planet. The Thai day starts at sunrise (taken as 06:00), so 00:00–05:59 still belongs
// to the previous day; Wednesday from 18:00 is ราหู (พุธกลางคืน).
const JS_TO_TH = [1, 2, 3, 4, 5, 6, 7];
function dayPlanet(y, m, d, hour = 12, rahu = true) {
  let wd = new Date(y, m - 1, d).getDay();
  if (hour < 6) wd = (wd + 6) % 7;
  const p = JS_TO_TH[wd];
  return rahu && p === 4 && (hour >= 18 || hour < 6) ? 8 : p;
}
function birthPlanet(profile) {
  const h = profile.timeKnown ? profile.hour : 12;
  return dayPlanet(profile.yearBE - 543, profile.month, profile.day, h);
}

// Thai astrology uses the sidereal zodiac. Lahiri ayanamsa: 23.853° at J2000, +50.29″ per year.
const ayanamsa = (date) => 23.853 + ((date.getTime() - Date.UTC(2000, 0, 1, 12)) / 31557600000) * (50.29 / 3600);
// Traditional Thai sign lords (กุมภ์ uses เสาร์; ราหู is its co-lord).
const SIGN_LORD = [3, 6, 4, 2, 1, 4, 6, 3, 5, 7, 7, 5];
function thaiLagna(chart) {
  if (chart.asc == null || !chart.timeKnown) return null;
  const lon = rev(chart.asc - ayanamsa(chart.utc));
  const sign = Math.floor(lon / 30);
  return { lon, sign, deg: lon - sign * 30, lord: SIGN_LORD[sign] };
}

// Lucky colours and numbers for an owner planet.
function luckOf(owner) {
  const t = thaksa(owner);
  const pick = (id) => t.find((x) => x.id === id).planet;
  return {
    owner,
    wheel: t,
    money: pick('sri'), work: pick('det'), patron: pick('montri'), health: pick('ayu'), people: pick('boriwan'),
    avoid: pick('kalakini'),
    numbers: [pick('sri'), pick('det'), pick('montri'), owner].filter((n, i, a) => a.indexOf(n) === i)
  };
}

// The shirt-colour table for a given day: owner is the day's planet.
function dayColors(date = new Date()) {
  const owner = dayPlanet(date.getFullYear(), date.getMonth() + 1, date.getDate(), date.getHours(), false);
  return { owner, ...luckOf(owner) };
}

// ยามอัฏฐกาล: 8 watches by day (06:00–18:00) and 8 by night (18:00–06:00), 1 ชั่วโมงครึ่ง each.
// Day watches start with the day planet and step +5; night watches step +4 (wrap at 7).
function yams(date, person) {
  const base = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  if (date.getHours() < 6) base.setDate(base.getDate() - 1);
  const p = JS_TO_TH[base.getDay()];
  const step = (x, k) => ((x - 1 + k) % 7) + 1;
  const out = [];
  for (const [night, k, h0] of [[false, 5, 6], [true, 4, 18]]) {
    let planet = p;
    for (let i = 0; i < 8; i++) {
      const start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h0, 0);
      start.setMinutes(start.getMinutes() + i * 90);
      const end = new Date(start.getTime() + 90 * 60000);
      const pos = posOf(person, planet);
      out.push({ night, i, planet, start, end, pos });
      planet = step(planet, k);
    }
  }
  return out;
}

// Approximate วันพระ: ขึ้น/แรม 8 ค่ำ, ขึ้น 15 ค่ำ, and the last day of the waning half.
function holyDay(date) {
  const ph = lunarPhase(date);
  if (ph.day === 8) return true;
  if (ph.waxing && ph.day === 15) return true;
  if (!ph.waxing && ph.day >= 14) {
    const next = lunarPhase(new Date(date.getTime() + 86400000));
    return next.waxing;
  }
  return false;
}

function findAuspicious(chart, person, eventId, { days = 60, start = new Date(), partner = null } = {}) {
  const ev = EVENTS.find((e) => e.id === eventId);
  const results = [];
  for (let i = 1; i <= days; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 10, 0);
    const owner = dayPlanet(d.getFullYear(), d.getMonth() + 1, d.getDate(), 10, false);
    const pos = posOf(person, owner);
    const good = [], warn = [];
    let score = 42;
    let blocked = false;

    // 1. Thai: the day must not be the person's (or the partner's) กาลกิณี.
    if (pos.id === 'kalakini') { blocked = true; warn.push(`${DAY_NAME(owner)}เป็นวันกาลกิณีของคุณ`); }
    if (partner && posOf(partner, owner).id === 'kalakini') { blocked = true; warn.push(`${DAY_NAME(owner)}เป็นวันกาลกิณีของคู่`); }
    const rank = ev.pos.indexOf(pos.id);
    if (rank >= 0) { score += 18 - rank * 4; good.push(`${DAY_NAME(owner)}เป็นวัน${pos.th}ของคุณ เด่นเรื่อง${pos.use}`); }
    else if (pos.tone === 2) { score += 6; good.push(`${DAY_NAME(owner)}เป็นวัน${pos.th}ของคุณ`); }
    if (partner) {
      const pp = posOf(partner, owner);
      if (ev.pos.includes(pp.id)) { score += 8; good.push(`เป็นวัน${pp.th}ของคู่ด้วย`); }
    }
    if (ev.avoidDays.includes(owner)) { score -= 14; warn.push(`ตามธรรมเนียมไม่นิยม${ev.th}${DAY_NAME(owner)}`); }

    // 2. Thai lunar: auspicious beginnings favour ข้างขึ้น; avoid จันทร์ดับ and (for weddings) วันพระ.
    const ph = lunarPhase(d);
    if (ph.name === 'จันทร์ดับ') { score -= 12; warn.push('ตรงกับจันทร์ดับ'); }
    else if (ph.waxing) { score += 4 * ev.waxing; if (ev.waxing) good.push(`ข้างขึ้น (${ph.th}) พลังกำลังเติบโต`); }
    else if (ev.waxing >= 2) { score -= 4; warn.push(`ข้างแรม (${ph.th})`); }
    if (ev.noHolyDay && holyDay(d)) { score -= 10; warn.push('ตรงกับวันพระ ไม่นิยมจัดงานมงคลสมรส'); }

    // 3. Sky: retrograde planets that matter for this event.
    const sky = planetPositions(d);
    for (const id of ev.direct) {
      if (sky[id].retro) { score -= id === 'mercury' ? 12 : 10; warn.push(`ดาว${id === 'mercury' ? 'พุธ' : id === 'venus' ? 'ศุกร์' : 'พฤหัส'}ถอยหลัง`); }
    }
    // 4. Moon's natal house and the Moon's aspects to the planets that matter.
    const moonHouse = chart.houseOf(sky.moon.lon);
    const hRank = ev.houses.indexOf(moonHouse);
    if (hRank >= 0) { score += 10 - hRank * 3; good.push(`ดวงจันทร์ผ่านภพ ${moonHouse} ของคุณ (ราศี${SIGNS[signOf(sky.moon.lon)].th})`); }
    if ([8, 12].includes(moonHouse) && !ev.houses.includes(moonHouse)) { score -= 6; warn.push(`ดวงจันทร์ผ่านภพ ${moonHouse}`); }
    const asp = liveAspects(chart, d, { n: 20, exact: false, only: ['moon', 'venus', 'jupiter', 'sun', 'mars', 'saturn'] });
    for (const x of asp) {
      if (!ev.targets.includes(x.target.id)) continue;
      const benefic = ['venus', 'jupiter', 'moon', 'sun'].includes(x.mover.id);
      const w = Math.min(1, x.strength);
      if (x.asp.nature > 0 && benefic) { score += 7 * w; if (w > 0.4) good.push(`${nm(x.mover.id, x.mover.th)}จรทำมุม${x.asp.th}กับ${nm(x.target.id, x.target.th)}ของคุณ`); }
      else if (x.asp.nature < 0 && ['mars', 'saturn'].includes(x.mover.id)) { score -= 8 * w; if (w > 0.4) warn.push(`${nm(x.mover.id, x.mover.th)}จร${x.asp.th}${nm(x.target.id, x.target.th)}ของคุณ`); }
      else if (x.asp.nature < 0 && x.mover.id === 'moon') score -= 3 * w;
    }

    // 5. Best ยาม inside the day: daytime ceremonies only, preferring the event's positions.
    const slots = yams(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 9), person)
      .filter((y) => !y.night && (ev.early || y.start.getHours() >= 7) && y.start.getHours() < 16)
      .filter((y) => y.pos.id !== 'kalakini' && !(partner && posOf(partner, y.planet).id === 'kalakini'))
      .map((y) => ({ ...y, r: ev.pos.includes(y.pos.id) ? ev.pos.indexOf(y.pos.id) : y.pos.tone === 2 ? 3 : 5 }))
      .sort((a, b) => a.r - b.r || a.start - b.start);
    const best = slots[0] || null;
    if (best && best.r <= 3) score += 4;

    if (blocked) continue;
    results.push({ date: d, owner, score: Math.round(Math.max(0, Math.min(100, score))), good, warn, phase: ph, best, alt: slots.slice(1, 3) });
  }
  results.sort((a, b) => b.score - a.score || a.date - b.date);
  return { event: ev, results };
}

function dominance(ch) {
  const ascSign = ch.timeKnown ? signOf(ch.asc) : null;
  return ch.planets.map((p) => {
    let s = p.id === 'sun' || p.id === 'moon' ? 2 : 0;
    if (RULER[p.sign] === p.id || TRAD_RULER[p.sign] === p.id) s += 3;
    if (EXALT[p.id] === p.sign) s += 2;
    if (ch.timeKnown && [1, 10].includes(p.house)) s += 3;
    if (ch.timeKnown && [4, 7].includes(p.house)) s += 1.5;
    if (ascSign != null && (RULER[ascSign] === p.id || TRAD_RULER[ascSign] === p.id)) s += 3;
    if (RULER[ch.planets[0].sign] === p.id) s += 1;
    for (const a of ch.aspects) if (a.a.id === p.id || a.b.id === p.id) s += Math.max(0, 1 - a.off / 8);
    if (['uranus', 'neptune', 'pluto'].includes(p.id)) s *= 0.7;
    return { p, s };
  }).sort((x, y) => y.s - x.s);
}

  const mj = asp('mercury', 'jupiter'); if (mj && mj.nature >= 0) add('seer', 8 * aspW(mj), `${aspTxt(mj)} อธิบายและแนะนำคนเก่ง`);

  // Houses (need birth time).
  if (known) {
    const h12 = inHouse(12), h8 = inHouse(8), h9 = inHouse(9);
    if (P.moon.house === 12) { add('intuition', 18, 'ดวงจันทร์ในภพ 12 (ภพแห่งจิตใต้สำนึก)'); add('dream', 26, 'ดวงจันทร์ในภพ 12'); add('spirit', 14, 'ดวงจันทร์ในภพ 12'); }
    if (P.moon.house === 8) { add('spirit', 18, 'ดวงจันทร์ในภพ 8 (ภพแห่งความลึกลับ)'); add('people', 14, 'ดวงจันทร์ในภพ 8'); add('intuition', 10, 'ดวงจันทร์ในภพ 8'); }
    if (P.neptune.house === 12) { add('spirit', 24, 'ดาวเนปจูนในภพ 12'); add('dream', 18, 'ดาวเนปจูนในภพ 12'); }
    if (P.neptune.house === 8) { add('spirit', 22, 'ดาวเนปจูนในภพ 8'); add('intuition', 8, 'ดาวเนปจูนในภพ 8'); }

    if (P.pluto.house === 1) add('people', 12, 'ดาวพลูโตในภพ 1');

    if ([8, 9, 12].includes(P.mercury.house)) add('seer', 16, `ดาวพุธในภพ ${P.mercury.house} ความคิดสนใจเรื่องลึกลับและปรัชญา`);
    if (P.uranus.house === 1 || P.uranus.house === 10 || P.uranus.house === 9) add('seer', 14, `ดาวมฤตยู (ดาวแห่งโหราศาสตร์) เด่นในภพ ${P.uranus.house}`);

    if (h9.length >= 2) add('seer', 8, `ดาว ${h9.length} ดวงในภพ 9 (ภพแห่งปรัชญาและศาสตร์ชั้นสูง)`);
