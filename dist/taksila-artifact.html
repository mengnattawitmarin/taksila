<title>ตักศิลา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0B08">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+Symbols&amp;family=Noto+Sans+Symbols+2&amp;display=swap">
<style>
/* Taksila — design tokens and components */
:root {
  --bg: #0D0B08;
  --surface: #15120D;
  --surface-2: #1C1811;
  --line: #2C261B;
  --line-2: #3D3424;
  --text: #F1E6CF;
  --text-2: #C9BC9F;
  --muted: #A3967D;
  --faint: #5A4E38;
  --gold: #D4AF63;
  --gold-2: #F0D89A;
  --rose: #D98C86;
  --violet: #A99BD9;
  --teal: #7FC4B4;
  --amber: #E0A458;
  --harmony: #8FB3E0;
  --tension: #E07A62;
  --serif: 'Taviraj', 'Noto Serif Thai', serif;
  --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --symbols: 'Noto Sans Symbols', 'Noto Sans Symbols 2', 'Segoe UI Symbol', serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--gold); }
a:hover { color: var(--gold-2); }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }

.app { max-width: 430px; margin: 0 auto; min-height: 100dvh; position: relative; background: var(--bg); }
.screen { padding-block: max(28px, env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.screen.no-nav { padding-bottom: 34px; }
.edge { margin-left: -20px; margin-right: -20px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type */
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; }
.label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin: 0; font-weight: 500; }
.h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.3; margin: 0; }
.h2 { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.45; margin: 0; }
.body { font-size: 14px; line-height: 1.65; color: var(--text-2); margin: 0; }
.small { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0; }
.sym { font-family: var(--symbols); }
.glow-text { text-shadow: 0 0 12px rgba(240, 216, 154, 0.5); }

/* page header */
.page-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sigil { flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid currentColor; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px color-mix(in srgb, currentColor 30%, transparent); }
.back { flex: none; width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--text); border: none; background: none; cursor: pointer; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.rule { border: none; border-top: 1px solid var(--line); margin: 0; }
.row-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row-list > * { border-bottom: 1px solid var(--line); }

/* buttons */
.btn { min-height: 52px; border-radius: 6px; border: none; background: var(--gold); color: var(--bg); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; padding: 0 18px; width: 100%; }
.btn:hover { background: var(--gold-2); color: var(--bg); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-line { background: transparent; color: var(--gold); border: 1px solid var(--line-2); }
.btn-line:hover { background: var(--surface); color: var(--gold-2); }
.link-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; background: none; border: none; color: var(--gold); cursor: pointer; padding: 0; }

.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent, var(--gold)); color: var(--text); font-weight: 600; background: var(--surface); box-shadow: 0 0 12px color-mix(in srgb, var(--accent, var(--gold)) 35%, transparent); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 44px; border: none; background: transparent; color: var(--text-2); font-size: 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { color: var(--text); font-weight: 600; background: color-mix(in srgb, var(--accent, var(--gold)) 12%, transparent); box-shadow: inset 0 -2px 0 var(--accent, var(--gold)); }

.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: 0 -4px; }
.tabs button { min-height: 44px; border: none; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--gold); }

.tag { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--text-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.input, .select { min-height: 48px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); padding: 0 12px; font-size: 15px; width: 100%; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 21px, calc(100% - 11px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.input:disabled, .select:disabled { color: var(--faint); background-color: var(--bg); }
.check { min-height: 44px; display: inline-flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text); font-size: 14px; cursor: pointer; padding: 0; }
.check .box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--faint); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.check[aria-pressed="true"] .box { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.step-title { display: flex; align-items: baseline; gap: 10px; font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0; }
.step-title .mono { font-size: 11px; color: var(--gold); }

.option-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; max-height: 236px; overflow-y: auto; }
.option { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border: none; background: transparent; color: var(--text); cursor: pointer; text-align: left; }
.option + .option { border-top: 1px solid var(--line); }
.option[aria-checked="true"] { background: var(--surface-2); }
.radio-dot { flex: none; width: 16px; height: 16px; border-radius: 8px; border: 1px solid var(--faint); }
.option[aria-checked="true"] .radio-dot { border: 5px solid var(--gold); box-shadow: 0 0 10px var(--gold); }

/* home */
.map-link { display: block; line-height: 0; align-self: center; border-radius: 50%; }
.big3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; }
.big3 > div { display: flex; flex-direction: column; gap: 2px; }
.big3 > div + div { border-left: 1px solid var(--line); }
.big3 .v { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.score-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.score-grid > div { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-2); }
.bars { display: flex; gap: 2px; }
.bars span { flex: 1 1 0; height: 3px; border-radius: 1px; background: var(--line); }
.bars span.on { background: var(--gold); }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
.mini { flex: none; width: 152px; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.mini .t { font-family: var(--serif); font-size: 15px; font-weight: 600; }
.tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tool { text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tool .sigil { width: 36px; height: 36px; }
.tool .n { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.ask-link { text-decoration: none; color: var(--text); border: 1px solid var(--line-2); border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }

/* oracle grid: the divination rooms */
.oracle-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.oracle { --c: var(--gold); text-decoration: none; color: var(--text); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, var(--surface)), var(--surface)); border: 1px solid var(--line); border-radius: 10px; padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; transition: border-color .2s, transform .2s; }
.oracle:active { transform: scale(.97); }
.oracle:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
.oracle .sigil { color: var(--c); width: 40px; height: 40px; }
.oracle .n { font-family: var(--serif); font-size: 15px; font-weight: 600; }
.oracle .small { font-size: 11px; line-height: 1.3; }

/* live daily drawer */
.live-dot { width: 7px; height: 7px; border-radius: 4px; background: var(--gold-2); box-shadow: 0 0 8px var(--gold-2); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.fold-in { overflow: hidden; min-height: 0; }
.open > .fold { grid-template-rows: 1fr; }
.chev { display: flex; color: var(--muted); transition: transform .3s ease; }
.open > button > .chev { transform: rotate(180deg); }
.drawer-toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 2px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); font: inherit; cursor: pointer; text-align: left; }
.drawer-toggle .peek { display: flex; gap: 4px; }
.drawer-toggle .lbl { flex: 1; font-size: 13px; color: var(--gold-2); }
.chip { display: inline-flex; align-items: center; gap: 1px; padding: 3px 6px; border-radius: 12px; border: 1px solid var(--line); font-size: 12px; color: var(--gold-2); }
.drawer-body { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }
.asp-list, .next-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.asp { border-top: 1px solid var(--line); }
.asp:last-child { border-bottom: 1px solid var(--line); }
.asp-head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 0; background: none; border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.asp-glyphs { flex: none; width: 66px; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-radius: 14px; background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); color: var(--gold-2); font-size: 14px; }
.asp-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.asp-title > span:first-child { font-size: 14px; font-weight: 600; }
.asp-title .mono { font-size: 10px; color: var(--muted); }
.asp-body { display: flex; flex-direction: column; gap: 8px; padding: 0 0 14px 78px; }
.asp-facts { margin: 4px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.asp-facts dt { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
.asp-facts dd { margin: 0; font-size: 12px; }
.tr-bar { width: 64px; height: 3px; margin-top: 6px; border-radius: 2px; background: var(--line); display: block; }
.tr-bar span { display: block; height: 100%; border-radius: 2px; }
.legend { font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.next-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
@media (max-width: 360px) { .asp-body { padding-left: 0; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } .fold, .chev { transition: none; } }

/* seven-day strip */
.week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 8px; min-height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; cursor: pointer; }
.day.sel { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 9%, var(--surface)); }
.day .wd { font-size: 10px; color: var(--muted); }
.day .dn { font-family: var(--mono); font-size: 15px; }
.day .dots { display: flex; gap: 2px; }
.day .dots i { width: 3px; height: 3px; border-radius: 2px; }
.day-detail { gap: 8px; }
.day-asp { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.day-asp li { display: flex; align-items: center; gap: 12px; }

/* chart */
.legend { display: flex; gap: 16px; justify-content: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 1.5px; vertical-align: middle; margin-right: 6px; }
.el-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 20px; align-items: center; gap: 10px; font-size: 13px; }
.el-bar { height: 4px; border-radius: 2px; background: var(--surface-2); }
.el-bar span { display: block; height: 100%; border-radius: 2px; background: var(--faint); }
.el-bar span.top { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.planet-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; align-items: start; }
.planet-row .g { font-family: var(--symbols); font-size: 20px; color: var(--gold); text-align: center; text-shadow: 0 0 10px rgba(240, 216, 154, 0.5); }
.planet-row .deg { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: var(--mono); font-size: 13px; }
.timeline { border-left: 1px solid var(--line-2); margin-left: 6px; display: flex; flex-direction: column; }
.timeline .item { position: relative; padding: 0 0 22px 20px; display: flex; flex-direction: column; gap: 4px; }
.timeline .dot { position: absolute; left: -5px; top: 4px; width: 9px; height: 9px; border-radius: 5px; }
.level { align-self: flex-start; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; border: 1px solid currentColor; border-radius: 3px; padding: 2px 8px; }

/* match */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr); align-items: center; text-align: center; }
.pair .s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pair .gl { font-family: var(--symbols); font-size: 30px; }
.gauge { position: relative; width: 130px; height: 130px; }
.gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.sign-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sign-btn { min-height: 58px; border-radius: 6px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--text); background: transparent; border: 1px solid var(--line); font-size: 13px; }
.sign-btn .gl { font-family: var(--symbols); font-size: 17px; line-height: 1; color: var(--muted); }
.sign-btn.me .gl { color: var(--gold); }
.sign-btn[aria-checked="true"] { background: rgba(217, 140, 134, 0.12); border-color: var(--rose); box-shadow: 0 0 12px rgba(217, 140, 134, 0.25); }
.sign-btn[aria-checked="true"] .gl { color: var(--rose); }
.date-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 92px; gap: 8px; }

/* tarot */
.spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.spread .slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tcard { width: 100%; height: 164px; border-radius: 6px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--gold); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--line-2), 0 0 18px rgba(212, 175, 99, 0.15); color: var(--text); text-align: center; }
.tcard .num { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--gold); }
.tcard .nm { font-family: var(--serif); font-size: 13px; font-weight: 600; line-height: 1.3; }
.tcard.rev svg { transform: rotate(180deg); }
.tback { width: 100%; height: 164px; border-radius: 6px; background: #17131F; border: 1px solid var(--violet); box-shadow: 0 0 20px rgba(169, 155, 217, 0.25); padding: 8px; display: flex; align-items: center; justify-content: center; color: var(--violet); cursor: pointer; }
.tback:disabled { cursor: default; opacity: 0.5; box-shadow: none; }

/* numerology */
.lp-ring { flex: none; width: 76px; height: 76px; border-radius: 38px; border: 1px solid var(--teal); box-shadow: 0 0 20px rgba(127, 196, 180, 0.3), inset 0 0 14px rgba(127, 196, 180, 0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pairs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pairs > div { border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); }
.pairs > div.bad { border-style: dashed; border-color: #6A3A30; }

/* luck */
.slots { display: flex; gap: 12px; justify-content: center; }
.slot-n { width: 64px; height: 76px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 34px; font-weight: 500; border: 1px dashed var(--line-2); color: var(--faint); }
.slot-n.on { border: 1px solid var(--amber); color: #FFE3B0; background: var(--surface); box-shadow: 0 0 20px rgba(224, 164, 88, 0.35), inset 0 0 12px rgba(224, 164, 88, 0.15); animation: pop 0.35s ease-out; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.shake { animation: shake 0.5s ease-in-out; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(3deg); } }

/* chat */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 320px; border-radius: 8px; padding: 12px 14px; font-size: 15px; line-height: 1.65; }
.msg.bot { border: 1px solid var(--line); background: var(--surface); }
.msg.me { align-self: flex-end; max-width: 260px; background: var(--line); font-size: 14px; }
.msg .basis { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.composer { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); background: var(--bg); padding: 8px 0 10px; display: flex; flex-direction: column; gap: 8px; }
.composer form { display: flex; gap: 8px; }
.send { flex: none; width: 48px; height: 48px; border-radius: 24px; border: none; background: var(--gold); color: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 16px rgba(212, 175, 99, 0.35); }

/* nav */
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 430px; height: calc(70px + env(safe-area-inset-bottom)); padding: 0 4px env(safe-area-inset-bottom); display: flex; justify-content: space-around; align-items: stretch; background: rgba(13, 11, 8, 0.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); z-index: 10; }
.nav a { flex: 1 1 0; min-width: 0; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 500; }
.nav a[aria-current="page"] { color: var(--gold); font-weight: 600; box-shadow: inset 0 2px 0 var(--gold); }

const tand = (x) => Math.tan(x * RAD);

const HOUSES = [

  'การเงิน ทรัพย์สิน',
  'การสื่อสาร พี่น้อง การเรียนรู้',

const ASPECTS = [
  { id: 'conj', angle: 0, orb: 8, th: 'ร่วม', nature: 0 },
  { id: 'sext', angle: 60, orb: 5, th: 'หกสิบองศา', nature: 1 },
  { id: 'square', angle: 90, orb: 7, th: 'ตั้งฉาก', nature: -1 },

// ---------- time ----------
function dayNumber(date) {
  // days since 2000 Jan 0.0 UT
  return date.getTime() / 86400000 - 10956;
}

function tzOffsetMinutes(tz, ms) {
  const f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const p = {};
  for (const part of f.formatToParts(new Date(ms))) p[part.type] = part.value;
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return Math.round((asUtc - ms) / 60000);
}

// local wall-clock time at a place -> UTC Date
function localToUtc(y, m, d, h, mi, place) {
  const guess = Date.UTC(y, m - 1, d, h, mi);
  if (place.tz) {
    let off = tzOffsetMinutes(place.tz, guess);
    let utc = guess - off * 60000;
    const off2 = tzOffsetMinutes(place.tz, utc);
    if (off2 !== off) utc = guess - off2 * 60000;
    return new Date(utc);
  }
  return new Date(guess - (place.offset || 0) * 60 * 60000);
}

// ---------- orbital mechanics ----------
function kepler(M, e) {
  let E = M + (180 / Math.PI) * e * sind(M) * (1 + e * cosd(M));
  for (let i = 0; i < 8; i++) {
    const dE = (E - (180 / Math.PI) * e * sind(E) - M) / (1 - e * cosd(E));
    E -= dE;
    if (Math.abs(dE) < 1e-7) break;
  }
  return E;
}

function elements(id, d) {
  switch (id) {
    case 'mercury': return { N: 48.3313 + 3.24587e-5 * d, i: 7.0047 + 5.0e-8 * d, w: 29.1241 + 1.01444e-5 * d, a: 0.387098, e: 0.205635 + 5.59e-10 * d, M: 168.6562 + 4.0923344368 * d };
    case 'venus': return { N: 76.6799 + 2.4659e-5 * d, i: 3.3946 + 2.75e-8 * d, w: 54.891 + 1.38374e-5 * d, a: 0.72333, e: 0.006773 - 1.302e-9 * d, M: 48.0052 + 1.6021302244 * d };
    case 'mars': return { N: 49.5574 + 2.11081e-5 * d, i: 1.8497 - 1.78e-8 * d, w: 286.5016 + 2.92961e-5 * d, a: 1.523688, e: 0.093405 + 2.516e-9 * d, M: 18.6021 + 0.5240207766 * d };
    case 'jupiter': return { N: 100.4542 + 2.76854e-5 * d, i: 1.303 - 1.557e-7 * d, w: 273.8777 + 1.64505e-5 * d, a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: 19.895 + 0.0830853001 * d };
    case 'saturn': return { N: 113.6634 + 2.3898e-5 * d, i: 2.4886 - 1.081e-7 * d, w: 339.3939 + 2.97661e-5 * d, a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: 316.967 + 0.0334442282 * d };
    case 'uranus': return { N: 74.0005 + 1.3978e-5 * d, i: 0.7733 + 1.9e-8 * d, w: 96.6612 + 3.0565e-5 * d, a: 19.18171 - 1.55e-8 * d, e: 0.047318 + 7.45e-9 * d, M: 142.5905 + 0.011725806 * d };
    case 'neptune': return { N: 131.7806 + 3.0173e-5 * d, i: 1.77 - 2.55e-7 * d, w: 272.8461 - 6.027e-6 * d, a: 30.05826 + 3.313e-8 * d, e: 0.008606 + 2.15e-9 * d, M: 260.2471 + 0.005995147 * d };
    default: return null;
  }
}

function orbitXYZ(el) {
  const M = rev(el.M);
  const E = kepler(M, el.e);
  const xv = el.a * (cosd(E) - el.e);
  const yv = el.a * Math.sqrt(1 - el.e * el.e) * sind(E);
  const v = atan2d(yv, xv);
  const r = Math.sqrt(xv * xv + yv * yv);
  const vw = v + el.w;
  const x = r * (cosd(el.N) * cosd(vw) - sind(el.N) * sind(vw) * cosd(el.i));
  const y = r * (sind(el.N) * cosd(vw) + cosd(el.N) * sind(vw) * cosd(el.i));
  const z = r * (sind(vw) * sind(el.i));
  return { x, y, z, r };
}

function sunData(d) {
  const w = 282.9404 + 4.70935e-5 * d;
  const e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.047 + 0.9856002585 * d);
  const E = kepler(M, e);
  const xv = cosd(E) - e;
  const yv = Math.sqrt(1 - e * e) * sind(E);
  const v = atan2d(yv, xv);
  const r = Math.sqrt(xv * xv + yv * yv);
  const lon = rev(v + w);
  return { lon, r, M, L: rev(M + w), x: r * cosd(lon), y: r * sind(lon) };
}

function moonLon(d, sun) {
  const el = { N: 125.1228 - 0.0529538083 * d, i: 5.1454, w: 318.0634 + 0.1643573223 * d, a: 60.2666, e: 0.0549, M: 115.3654 + 13.0649929509 * d };
  const p = orbitXYZ(el);
  let lon = atan2d(p.y, p.x);
  const Mm = rev(el.M), Ms = sun.M;
  const Lm = rev(el.N + el.w + el.M);
  const D = rev(Lm - sun.L);
  const F = rev(Lm - el.N);
  lon += -1.274 * sind(Mm - 2 * D) + 0.658 * sind(2 * D) - 0.186 * sind(Ms)
    - 0.059 * sind(2 * Mm - 2 * D) - 0.057 * sind(Mm - 2 * D + Ms) + 0.053 * sind(Mm + 2 * D)
    + 0.046 * sind(2 * D - Ms) + 0.041 * sind(Mm - Ms) - 0.035 * sind(D) - 0.031 * sind(Mm + Ms)
    - 0.015 * sind(2 * F - 2 * D) + 0.011 * sind(Mm - 4 * D);
  return rev(lon);
}

function plutoHelio(d) {
  const S = 50.03 + 0.033459652 * d;
  const P = 238.95 + 0.003968789 * d;
  let lon = 238.9508 + 0.00400703 * d
    - 19.799 * sind(P) + 19.848 * cosd(P) + 0.897 * sind(2 * P) - 4.956 * cosd(2 * P)
    + 0.61 * sind(3 * P) + 1.211 * cosd(3 * P) - 0.341 * sind(4 * P) - 0.19 * cosd(4 * P)
    + 0.128 * sind(5 * P) - 0.034 * cosd(5 * P) - 0.038 * sind(6 * P) + 0.031 * cosd(6 * P)
    + 0.02 * sind(S - P) - 0.01 * cosd(S - P);
  const lat = -3.9082 - 5.453 * sind(P) - 14.975 * cosd(P) + 3.527 * sind(2 * P) + 1.673 * cosd(2 * P)
    - 1.051 * sind(3 * P) + 0.328 * cosd(3 * P) + 0.179 * sind(4 * P) - 0.292 * cosd(4 * P)
    + 0.019 * sind(5 * P) + 0.1 * cosd(5 * P) - 0.031 * sind(6 * P) - 0.026 * cosd(6 * P)
    + 0.011 * cosd(S - P);
  const r = 40.72 + 6.68 * sind(P) + 6.9 * cosd(P) - 1.18 * sind(2 * P) - 0.03 * cosd(2 * P)
    + 0.15 * sind(3 * P) - 0.14 * cosd(3 * P);
  lon += 3.82394e-5 * d; // J2000 -> equinox of date
  return { x: r * cosd(lat) * cosd(lon), y: r * cosd(lat) * sind(lon), z: r * sind(lat) };
}

function helio(id, d) {
  if (id === 'pluto') return plutoHelio(d);
  const el = elements(id, d);
  const p = orbitXYZ(el);
  if (id === 'jupiter' || id === 'saturn' || id === 'uranus') {
    const Mj = rev(19.895 + 0.0830853001 * d);
    const Ms = rev(316.967 + 0.0334442282 * d);
    const Mu = rev(142.5905 + 0.011725806 * d);
    let lon = atan2d(p.y, p.x);
    let lat = atan2d(p.z, Math.sqrt(p.x * p.x + p.y * p.y));
    if (id === 'jupiter') {
      lon += -0.332 * sind(2 * Mj - 5 * Ms - 67.6) - 0.056 * sind(2 * Mj - 2 * Ms + 21) + 0.042 * sind(3 * Mj - 5 * Ms + 21)
        - 0.036 * sind(Mj - 2 * Ms) + 0.022 * cosd(Mj - Ms) + 0.023 * sind(2 * Mj - 3 * Ms + 52) - 0.016 * sind(Mj - 5 * Ms - 69);
    } else if (id === 'saturn') {
      lon += 0.812 * sind(2 * Mj - 5 * Ms - 67.6) - 0.229 * cosd(2 * Mj - 4 * Ms - 2) + 0.119 * sind(Mj - 2 * Ms - 3)
        + 0.046 * sind(2 * Mj - 6 * Ms - 69) + 0.014 * sind(Mj - 3 * Ms + 32);
      lat += -0.02 * cosd(2 * Mj - 4 * Ms - 2) + 0.018 * sind(2 * Mj - 6 * Ms - 49);
    } else {
      lon += 0.04 * sind(Ms - 2 * Mu + 6) + 0.035 * sind(Ms - 3 * Mu + 33) - 0.015 * sind(Mj - Mu + 20);
    }
    return { x: p.r * cosd(lat) * cosd(lon), y: p.r * cosd(lat) * sind(lon), z: p.r * sind(lat) };
  }
  return p;
}

function lonAt(id, d) {
  const sun = sunData(d);
  if (id === 'sun') return sun.lon;
  if (id === 'moon') return moonLon(d, sun);
  const h = helio(id, d);
  return rev(atan2d(h.y + sun.y, h.x + sun.x));
}

// All planet longitudes for a UTC date. Includes retrograde flags.
function planetPositions(date) {
  const d = dayNumber(date);
  const out = {};
  for (const p of PLANETS) {
    const lon = lonAt(p.id, d);
    let retro = false;
    if (p.id !== 'sun' && p.id !== 'moon') {
      const a = lonAt(p.id, d - 0.5), b = lonAt(p.id, d + 0.5);
      let diff = b - a;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      retro = diff < 0;
    }
    out[p.id] = { lon, retro };
  }
  return out;
}

function angles(date, latDeg, lonDeg) {
  const d = dayNumber(date);
  const sun = sunData(d);
  const ecl = 23.4393 - 3.563e-7 * d;
  const ut = (date.getTime() / 3600000) % 24;
  const ramc = rev(sun.L + 180 + ut * 15 + lonDeg);
  const asc = rev(atan2d(cosd(ramc), -(sind(ramc) * cosd(ecl) + tand(latDeg) * sind(ecl))));
  const mc = rev(atan2d(sind(ramc), cosd(ramc) * cosd(ecl)));
  return { asc, mc };
}

const signOf = (lon) => Math.floor(rev(lon) / 30);
function fmtDeg(lon) {
  const inSign = rev(lon) % 30;
  let deg = Math.floor(inSign);
  let min = Math.round((inSign - deg) * 60);
  if (min === 60) { deg += 1; min = 0; }
  return String(deg).padStart(2, '0') + '°' + String(min).padStart(2, '0') + '′';
}
const angDist = (a, b) => { const x = Math.abs(rev(a) - rev(b)) % 360; return x > 180 ? 360 - x : x; };

function findAspect(a, b, orbScale = 1) {
  const dist = angDist(a, b);
  for (const asp of ASPECTS) {
    const off = Math.abs(dist - asp.angle);
    if (off <= asp.orb * orbScale) return { ...asp, off };
  }
  return null;
}

// ---------- natal chart ----------
function computeChart(profile) {
  const t = profile.timeKnown ? { h: profile.hour, m: profile.minute } : { h: 12, m: 0 };
  const yCE = profile.yearBE - 543;
  const utc = localToUtc(yCE, profile.month, profile.day, t.h, t.m, profile.place);
  const pos = planetPositions(utc);
  let asc = null, mc = null;
  if (profile.timeKnown) {
    const a = angles(utc, profile.place.lat, profile.place.lon);
    asc = a.asc; mc = a.mc;
  }
  // whole-sign houses from the rising sign (or the Sun sign when the time is unknown)
  const firstSign = asc != null ? signOf(asc) : signOf(pos.sun.lon);
  const houseOf = (lon) => ((signOf(lon) - firstSign + 12) % 12) + 1;
  const planets = PLANETS.map((p) => {
    const lon = pos[p.id].lon;
    return { ...p, lon, retro: pos[p.id].retro, sign: signOf(lon), house: houseOf(lon) };
  });
  const aspects = [];
  for (let i = 0; i < planets.length; i++) {
    for (let j = i + 1; j < planets.length; j++) {
      const scale = (planets[i].id === 'sun' || planets[i].id === 'moon') ? 1.2 : 1;
      const a = findAspect(planets[i].lon, planets[j].lon, scale);
      if (a) aspects.push({ a: planets[i], b: planets[j], ...a });
    }
  }
  aspects.sort((x, y) => x.off - y.off);
  const elementCount = [0, 0, 0, 0];
  planets.forEach((p) => { elementCount[elementOf(p.sign)] += 1; });
  const signCount = new Array(12).fill(0);
  planets.forEach((p) => { signCount[p.sign] += 1; });
  return { utc, asc, mc, firstSign, houseOf, planets, aspects, elementCount, signCount, timeKnown: profile.timeKnown };
}

// When does a slow planet leave its current sign? (scan forward)
function signExit(id, date) {
  const d0 = dayNumber(date);
  const s0 = signOf(lonAt(id, d0));
  const step = id === 'jupiter' ? 3 : 7;
  for (let k = step; k < 365 * 25; k += step) {
    if (signOf(lonAt(id, d0 + k)) !== s0) {
      // make sure it is not a short retrograde dip back
      if (signOf(lonAt(id, d0 + k + 120)) !== s0) return new Date(date.getTime() + k * 86400000);
    }
  }
  return null;
}

const TRANSIT_TEXT = {
  jupiter: (h) => 'ขยายโอกาสเรื่อง' + h + ' มีคนสนับสนุน เหมาะเริ่มสิ่งใหม่',
  saturn: (h) => 'ต้องจัดระเบียบและรับผิดชอบเรื่อง' + h + ' ผลจะมั่นคงถ้าอดทน',
  uranus: (h) => 'เรื่อง' + h + ' มีความเปลี่ยนแปลงกะทันหัน เปิดรับวิธีใหม่',
  neptune: (h) => 'เรื่อง' + h + ' อาจคลุมเครือ ใช้สัญชาตญาณร่วมกับข้อเท็จจริง',
  pluto: (h) => 'การเปลี่ยนแปลงลึกซึ้งในเรื่อง' + h + ' ปล่อยสิ่งเก่าเพื่อเติบโต'
};

function transits(chart, now = new Date()) {
  const pos = planetPositions(now);
  const out = [];
  for (const id of ['saturn', 'jupiter', 'uranus', 'neptune', 'pluto']) {
    const lon = pos[id].lon;
    const sign = signOf(lon);
    const house = chart.houseOf(lon);
    const natal = chart.planets.find((p) => p.id === id);
    const isReturn = (id === 'saturn' || id === 'jupiter') && angDist(lon, natal.lon) < 10;
    const hits = [];
    for (const target of chart.planets.filter((p) => ['sun', 'moon', 'venus', 'mars', 'mercury'].includes(p.id))) {
      const a = findAspect(lon, target.lon, 0.5);
      if (a) hits.push({ target, ...a });
    }
    if (chart.asc != null) {
      const a = findAspect(lon, chart.asc, 0.5);
      if (a) hits.push({ target: { th: 'ลัคนา', glyph: 'ASC' }, ...a });
    }
    const exit = signExit(id, now);
    let weight = { saturn: 5, jupiter: 4, uranus: 3, neptune: 2, pluto: 2 }[id] + hits.length * 2 + (isReturn ? 6 : 0);
    const p = planetById(id);
    let title = (isReturn ? (id === 'saturn' ? 'ดาวเสาร์คืนเรือน' : 'ดาวพฤหัสคืนเรือน') : 'ดาว' + p.th + 'จรราศี' + SIGNS[sign].th) + ' · ภพ ' + house;
    let body = TRANSIT_TEXT[id](HOUSES[house - 1]);
    if (isReturn) body = (id === 'saturn' ? 'รอบ 29 ปีของดาวเสาร์กลับมาทับตำแหน่งเดิม ช่วงทบทวนชีวิตครั้งใหญ่ ' : 'รอบ 12 ปีของดาวพฤหัสกลับมา เริ่มวงจรการเติบโตใหม่ ') + body;
    out.push({
      id, glyph: p.glyph, lon, sign, house, retro: pos[id].retro, hits, isReturn, exit, weight, title, body,
      level: weight >= 9 ? 'HIGH' : id === 'jupiter' ? 'SUPPORT' : 'SHIFT'
    });
  }
  out.sort((a, b) => b.weight - a.weight);
  return out;
}

// ---------- daily reading ----------
const AREA = {
  sun: 'งานและเป้าหมาย', moon: 'อารมณ์และครอบครัว', mercury: 'การสื่อสารและเอกสาร', venus: 'ความรักและการเงิน',
  mars: 'การลงมือทำ', jupiter: 'โอกาสใหม่', saturn: 'ความรับผิดชอบ'
};
const CATS = [
  { th: 'ความรัก', natal: ['venus', 'moon'], movers: ['venus', 'moon', 'mars', 'jupiter'] },
  { th: 'การงาน', natal: ['sun', 'saturn', 'mars'], movers: ['jupiter', 'saturn', 'mars', 'sun', 'mercury'] },
  { th: 'การเงิน', natal: ['venus', 'jupiter'], movers: ['venus', 'jupiter', 'moon', 'saturn'] },
  { th: 'สุขภาพ', natal: ['sun', 'mars', 'moon'], movers: ['mars', 'saturn', 'moon'] }
];

function daily(chart, now = new Date()) {
  const pos = planetPositions(now);
  const natal = Object.fromEntries(chart.planets.map((p) => [p.id, p]));
  const scores = CATS.map((c) => {
    let s = 0;
    for (const m of c.movers) for (const n of c.natal) {
      const a = findAspect(pos[m].lon, natal[n].lon, m === 'moon' ? 0.8 : 0.6);
      if (a) s += a.nature === 0 ? (['saturn', 'mars'].includes(m) ? -0.5 : 0.5) : a.nature;
    }
    s = 3.2 + s * 0.55;
    return { name: c.th, score: Math.max(1, Math.min(5, Math.round(s))) };
  });
  // headline: tightest aspect from a fast mover to a personal natal planet
  let best = null;
  for (const m of ['moon', 'sun', 'mercury', 'venus', 'mars', 'jupiter']) {
    for (const n of ['sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn']) {
      const a = findAspect(pos[m].lon, natal[n].lon, 0.6);
      if (a && (!best || a.off < best.off)) best = { m, n, ...a };
    }
  }
  let headline, basis;
  if (best) {
    const area = AREA[best.n];
    headline = best.nature > 0 ? 'วันที่จังหวะลื่นไหล เหมาะกับเรื่อง' + area
      : best.nature < 0 ? 'มีแรงกดดันเรื่อง' + area + ' ใจเย็นแล้วจะผ่านไปได้ดี'
        : 'พลังงานรวมตัวที่เรื่อง' + area + ' เหมาะโฟกัสเรื่องนี้';
    basis = 'ดาว' + planetById(best.m).th + 'จร' + best.th + 'ดาว' + planetById(best.n).th + 'ในดวงกำเนิด';
  } else {
    const h = chart.houseOf(pos.sun.lon);
    headline = 'วันที่สงบ เหมาะใส่ใจเรื่อง' + HOUSES[h - 1];
    basis = 'ดวงอาทิตย์จรภพ ' + h;
  }
  return { scores, headline, basis, sunSign: signOf(pos.sun.lon), moonSign: signOf(pos.moon.lon), pos };
}

function offAt(id, target, angle, ms) {
  return Math.abs(angDist(lonAt(id, dayNumber(new Date(ms))), target) - angle);
}
// When will this aspect be exact? Returns { applying, at } (at = Date or null).
function exactness(id, target, angle, now) {
  const t0 = now.getTime();
  const o0 = offAt(id, target, angle, t0);
  const probe = id === 'moon' ? 60e3 : 3600e3;
  if (offAt(id, target, angle, t0 + probe) > o0) return { applying: false, at: null };
  if (['jupiter', 'saturn', 'uranus', 'neptune', 'pluto'].includes(id)) return { applying: true, at: null };
  const step = id === 'moon' ? 600e3 : 3 * 3600e3;
  const span = id === 'moon' ? 36 * 3600e3 : 12 * 86400e3;
  let prev = o0;
  for (let k = step; k <= span; k += step) {
    const o = offAt(id, target, angle, t0 + k);
    if (o > prev) {
      let a = Math.max(t0, t0 + k - 2 * step), b = t0 + k;
      for (let i = 0; i < 40; i++) {
        const m1 = a + (b - a) / 3, m2 = b - (b - a) / 3;
        if (offAt(id, target, angle, m1) < offAt(id, target, angle, m2)) b = m2; else a = m1;
      }
      return { applying: true, at: new Date((a + b) / 2) };
    }
    prev = o;
  }
  return { applying: true, at: null };
}

// All transit-to-natal aspects active right now, strongest first, with reasons.
function liveAspects(chart, now = new Date(), { n = 6, exact = true, only = null } = {}) {
  const d = dayNumber(now);
  const targets = chart.planets.map((p) => ({ id: p.id, th: p.th, glyph: p.glyph, lon: p.lon, sign: p.sign }));
  if (chart.asc != null) targets.push({ id: 'asc', th: 'ลัคนา', glyph: 'ASC', lon: chart.asc, sign: signOf(chart.asc) });
  const out = [];
  for (const m of PLANETS) {
    if (only && !only.includes(m.id)) continue;
    const lon = lonAt(m.id, d);
    for (const t of targets) {
      const dist = angDist(lon, t.lon);
      for (const asp of ASPECTS) {
        const off = Math.abs(dist - asp.angle);
        const orb = MOVER_ORB[m.id];
        if (off > orb) continue;
        const strength = MOVER_W[m.id] * TARGET_W[t.id] * (1 - off / orb);
        out.push({ mover: { ...m, lon, sign: signOf(lon), house: chart.houseOf(lon) }, target: t, asp, off, strength });
      }
    }
  }
  out.sort((a, b) => b.strength - a.strength);
  const top = out.slice(0, n);
  for (const x of top) {
    if (exact) { const ex = exactness(x.mover.id, x.target.lon, x.asp.angle, now); x.applying = ex.applying; x.exactAt = ex.at; }
    x.reason = MOVER_ACT[x.mover.id] + TARGET_AREA[x.target.id];
    x.advice = ASPECT_ADVICE[x.asp.id];
  }
  return top;
}

// Moon phase as a Thai lunar day (tithi): 12 degrees of Moon-Sun elongation per day.
// Astronomical approximation; the official Thai calendar can differ by a day.
function lunarPhase(date) {
  const d = dayNumber(date);
  const el = rev(lonAt('moon', d) - lonAt('sun', d));
  const waxing = el < 180;
  const day = Math.min(15, Math.floor((waxing ? el : el - 180) / 12) + 1);
  const th = (waxing ? 'ขึ้น ' : 'แรม ') + day + ' ค่ำ';
  const name = el < 12 || el >= 348 ? 'จันทร์ดับ' : Math.abs(el - 180) < 12 ? 'จันทร์เต็มดวง' : waxing ? 'ข้างขึ้น' : 'ข้างแรม';
  return { elongation: el, waxing, day, th, name, lit: (1 - Math.cos(el * Math.PI / 180)) / 2 };
}

// Seven-day outlook, sampled at local noon each day. Fast planets drive the day-to-day changes.
const FAST = ['moon', 'sun', 'mercury', 'venus', 'mars'];
function weekAhead(chart, start = new Date()) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12, 0);
    const dl = daily(chart, d);
    const avg = dl.scores.reduce((a, s) => a + s.score, 0) / dl.scores.length;
    const moonLon = lonAt('moon', dayNumber(d));
    const fast = liveAspects(chart, d, { n: 12, exact: false, only: FAST });
    let tone = 0;
    for (const x of fast) tone += x.strength * (x.asp.nature === 0 ? 0.4 : x.asp.nature);
    const rating = Math.max(1, Math.min(5, Math.round(3.2 + 2 * Math.tanh(tone / 4))));
    out.push({ date: d, scores: dl.scores, avg, rating, moonSign: signOf(moonLon), moonHouse: chart.houseOf(moonLon), phase: lunarPhase(d), top: fast.slice(0, 3) });
  }
  return out;
}

function nextIngress(id, now, span, step) {
  const t0 = now.getTime();
  const s0 = signOf(lonOf(id, now));
  for (let k = step; k <= span; k += step) {
    if (signOf(lonOf(id, new Date(t0 + k))) !== s0) {
      let a = t0 + k - step, b = t0 + k;
      while (b - a > 30e3) { const m = (a + b) / 2; if (signOf(lonOf(id, new Date(m))) === s0) a = m; else b = m; }
      return { kind: 'ingress', id, at: new Date(b), sign: signOf(lonOf(id, new Date(b + 60e3))) };
    }
  }
  return null;
}
// Upcoming sign changes of the fast planets.
function upcomingIngresses(chart, now = new Date()) {
  const ev = [nextIngress('moon', now, 3 * 86400e3, 15 * 60e3)];
  for (const id of ['sun', 'mercury', 'venus', 'mars']) ev.push(nextIngress(id, now, 45 * 86400e3, 6 * 3600e3));
  return ev.filter(Boolean).map((e) => ({ ...e, house: chart.houseOf(e.sign * 30 + 1) })).sort((a, b) => a.at - b.at);
}

const PAIR_TABLE = [

  ['60° เซ็กซ์ไทล์', 84, 'คุยกันถูกคอ ช่วยเปิดโอกาสใหม่ให้กันและกัน'],
  ['90° สแควร์', 52, 'แรงดึงดูดสูงแต่ปะทะกันง่าย ต้องตกลงกติกาให้ชัด'],
  ['120° ไทรน์', 91, 'จังหวะชีวิตสอดคล้อง อยู่ด้วยกันแล้วสบายใจ'],
  ['150° ควินคันซ์', 60, 'ความต้องการต่างกันแบบละเอียดอ่อน ต้องปรับจูนสม่ำเสมอ'],
  ['180° ออปโพสิชัน', 73, 'ขั้วตรงข้ามที่เติมเต็มกัน ดึงดูดแรงแต่ต้องหาจุดกึ่งกลาง']
];

function compatibility(mySign, theirSign, myChart, theirPositions) {
  const diff = (theirSign - mySign + 12) % 12;
  const k = Math.min(diff, 12 - diff);
  const row = PAIR_TABLE[k];
  let score = row[1];
  const tags = [row[0]];
  const e1 = elementOf(mySign), e2 = elementOf(theirSign);
  const friendly = (e1 - e2 + 4) % 2 === 0;
  tags.push('ธาตุ' + ELEMENTS[e1].th + ' × ธาตุ' + ELEMENTS[e2].th + (friendly ? ' · ส่งเสริม' : ' · ต่างกัน'));
  const links = [];
  if (myChart && theirPositions) {
    score = Math.round(score * 0.6 + 30);
    const mine = ['sun', 'moon', 'venus', 'mars'];
    for (const a of mine) for (const b of mine) {
      const asp = findAspect(myChart.planets.find((p) => p.id === a).lon, theirPositions[b].lon, 0.7);
      if (asp) {
        score += asp.nature === 0 ? 3 : asp.nature * 4;
        links.push(planetById(a).glyph + ' ' + asp.th + ' ' + planetById(b).glyph);
      }
    }
    score = Math.max(35, Math.min(98, score));
  }
  return { score, reading: row[2], tags, links };
}

// ---- js/starmap.js ----
// Builds the animated star-map SVG from a computed natal chart.

const C = 170; // centre of the 340x340 viewBox

// Screen angle (degrees, 0 = right, 90 = down) for an ecliptic longitude.
// The rising point sits on the left and the zodiac runs counter-clockwise.
function screenAngle(chart, lon) {
  const base = chart.asc != null ? chart.asc : chart.firstSign * 30;
  return rev(180 + base - lon);
}
function pt(r, a) {
  const t = (a * Math.PI) / 180;
  return [C + r * Math.cos(t), C + r * Math.sin(t)];
}
const f = (n) => n.toFixed(1);

function starMap(chart, opts = {}) {
  const id = opts.id || 'm';
  const showHouses = opts.houses && chart.timeKnown;
  const hud = opts.hud || {};
  const parts = [];

  parts.push(`<defs>
<radialGradient id="${id}Sky" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#3D2E15"/><stop offset="1" stop-color="#120D06"/></radialGradient>
<radialGradient id="${id}Glow"><stop offset="0" stop-color="#FFE7A8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<radialGradient id="${id}Halo"><stop offset="0.86" stop-color="#D4AF63" stop-opacity="0"/><stop offset="0.94" stop-color="#D4AF63" stop-opacity="0.22"/><stop offset="1" stop-color="#D4AF63" stop-opacity="0"/></radialGradient>
</defs>`);
  parts.push(`<circle cx="${C}" cy="${C}" r="170" fill="url(#${id}Halo)"/>`);
  if (hud.tl) {
    parts.push(`<g font-family="'IBM Plex Mono',monospace" font-size="8.5" letter-spacing="1" fill="#A3967D">
<text x="2" y="12">${hud.tl}</text><text x="338" y="12" text-anchor="end">${hud.tr}</text>
<text x="2" y="334">${hud.bl}</text><text x="338" y="334" text-anchor="end">${hud.br}</text></g>`);
  }
  parts.push(`<circle cx="${C}" cy="${C}" r="166" fill="url(#${id}Sky)" stroke="#C9A14A" stroke-width="0.8"/>`);
  parts.push(`<g><circle cx="${C}" cy="${C}" r="160" fill="none" stroke="#C9A14A" stroke-width="1.2" stroke-dasharray="70 6 3 6 3 6" opacity="0.85"/><animateTransform attributeName="transform" type="rotate" from="0 ${C} ${C}" to="360 ${C} ${C}" dur="90s" repeatCount="indefinite"/></g>`);
  parts.push(`<g fill="none">
<circle cx="${C}" cy="${C}" r="153" stroke="#8A7040" stroke-width="4" stroke-dasharray="0.6 4.74"/>
<circle cx="${C}" cy="${C}" r="146" stroke="#C9A14A" stroke-width="0.8"/>
<circle cx="${C}" cy="${C}" r="126" stroke="#C9A14A" stroke-width="0.8"/>
<g stroke="#F0D89A" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.25"><circle cx="${C}" cy="${C}" r="112"/><circle cx="${C}" cy="${C}" r="96"/><circle cx="${C}" cy="${C}" r="80"/><circle cx="${C}" cy="${C}" r="66"/></g>
<g><circle cx="${C}" cy="${C}" r="120" stroke="#F0D89A" stroke-width="0.6" stroke-dasharray="2 9" opacity="0.4"/><animateTransform attributeName="transform" type="rotate" from="360 ${C} ${C}" to="0 ${C} ${C}" dur="140s" repeatCount="indefinite"/></g>
<g><path d="M${C} ${C}L${C} 44A126 126 0 0 1 233 60.9Z" fill="#F0D89A" opacity="0.07"/><path d="M${C} ${C}L233 60.9" stroke="#F0D89A" stroke-width="0.8" opacity="0.5"/><animateTransform attributeName="transform" type="rotate" from="0 ${C} ${C}" to="360 ${C} ${C}" dur="16s" repeatCount="indefinite"/></g>
<circle cx="${C}" cy="${C}" r="54" stroke="#C9A14A" stroke-width="0.8"/>
<path d="M170 122V152M170 188V218M122 170H152M188 170H218" stroke="#F0D89A" stroke-width="0.6" opacity="0.45"/>
</g>`);

  // major ticks every 30° aligned with sign boundaries, plus dividers and glyphs
  const div = [], ticks = [], glyphs = [], houses = [];
  for (let s = 0; s < 12; s++) {
    const a = screenAngle(chart, s * 30);
    const [x1, y1] = pt(126, a), [x2, y2] = pt(150, a), [t1x, t1y] = pt(149.5, a), [t2x, t2y] = pt(156.5, a);
    div.push(`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`);
    ticks.push(`M${f(t1x)} ${f(t1y)}L${f(t2x)} ${f(t2y)}`);
    const [gx, gy] = pt(136, screenAngle(chart, s * 30 + 15));
    const mine = chart.planets[0].sign === s;
    glyphs.push(`<text x="${f(gx)}" y="${f(gy)}"${mine ? ' fill="#FFE7A8" font-size="17"' : ''}>${SIGNS[s].glyph}&#xFE0E;</text>`);
  }
  if (showHouses) {
    for (let h = 1; h <= 12; h++) {
      const sign = (chart.firstSign + h - 1) % 12;
      const [hx, hy] = pt(118, screenAngle(chart, sign * 30 + 15));
      houses.push(`<text x="${f(hx)}" y="${f(hy)}">H${h}</text>`);
    }
  }
  parts.push(`<path d="${ticks.join('')}" stroke="#F0D89A" stroke-width="1.2"/>`);
  parts.push(`<path d="${div.join('')}" stroke="#C9A14A" stroke-width="0.8"/>`);
  if (showHouses) {
    const inner = [];
    for (let s = 0; s < 12; s++) {
      const a = screenAngle(chart, s * 30);
      const [x1, y1] = pt(126, a), [x2, y2] = pt(54, a);
      inner.push(`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`);
    }
    parts.push(`<path d="${inner.join('')}" stroke="#F0D89A" stroke-width="0.4" opacity="0.16"/>`);
  }

  // background stars (deterministic pseudo-random so the map is stable)
  let seed = Math.floor(chart.planets[0].lon * 1000) + 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const stars = [];
  for (let i = 0; i < 22; i++) {
    const r = 58 + rnd() * 64, a = rnd() * 360;
    const [x, y] = pt(r, a);
    const tw = i % 6 === 0 ? `<animate attributeName="opacity" values="0.2;1;0.2" dur="${(2.5 + rnd() * 2).toFixed(1)}s" repeatCount="indefinite"/>` : '';
    stars.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${(0.6 + rnd() * 0.8).toFixed(1)}" opacity="${(0.5 + rnd() * 0.5).toFixed(2)}">${tw}</circle>`);
  }
  parts.push(`<g fill="#F0D89A">${stars.join('')}</g>`);
  parts.push(`<g font-family="'Noto Sans Symbols 2','Noto Sans Symbols',serif" font-size="15" fill="#E8D2A0" text-anchor="middle" dominant-baseline="central">${glyphs.join('')}</g>`);
  if (showHouses) parts.push(`<g font-family="'IBM Plex Mono',monospace" font-size="7" fill="#8A7A5A" text-anchor="middle" dominant-baseline="central">${houses.join('')}</g>`);

  // rising axis
  if (chart.asc != null) {
    parts.push(`<path d="M116 170H20" stroke="#F0D89A" stroke-width="1.4"/><path d="M224 170H320" stroke="#F0D89A" stroke-width="0.8" opacity="0.5"/>
<g font-family="'IBM Plex Mono',monospace" font-size="7.5" letter-spacing="1.2" fill="#F0D89A" text-anchor="middle"><text x="92" y="182">ASC</text><text x="248" y="182" opacity="0.7">DSC</text></g>`);
  }

  // place planets on one of four orbit radii so glyphs do not collide
  const levels = [112, 96, 80, 66];
  const placed = [];
  const sorted = chart.planets.map((p) => ({ p, a: screenAngle(chart, p.lon) })).sort((x, y) => x.a - y.a);
  for (const item of sorted) {
    let lvl = 0;
    for (let L = 0; L < levels.length; L++) {
      const clash = placed.some((q) => q.lvl === L && Math.min(Math.abs(q.a - item.a), 360 - Math.abs(q.a - item.a)) < 11);
      if (!clash) { lvl = L; break; }
      lvl = (L + 1) % levels.length;
    }
    const [x, y] = pt(levels[lvl], item.a);
    placed.push({ ...item, lvl, x, y });
  }

  // aspect lines on the inner circle
  const lines = [];
  chart.aspects.filter((a) => a.nature !== 0).slice(0, 10).forEach((asp) => {
    const [x1, y1] = pt(54, screenAngle(chart, asp.a.lon));
    const [x2, y2] = pt(54, screenAngle(chart, asp.b.lon));
    const col = asp.nature > 0 ? '#8FB3E0' : '#E07A62';
    lines.push(`<path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${col}" stroke-width="0.8" opacity="0.85"/><circle cx="${f(x1)}" cy="${f(y1)}" r="1.5" fill="#F0D89A"/><circle cx="${f(x2)}" cy="${f(y2)}" r="1.5" fill="#F0D89A"/>`);
  });
  parts.push(lines.join(''));
  parts.push(`<path d="M170 164L172 168L176 170L172 172L170 176L168 172L164 170L168 168Z" fill="#FFE7A8"/>`);

  const glowEls = [], glyphEls = [], degEls = [];
  for (const q of placed) {
    const lum = q.p.id === 'sun' || q.p.id === 'moon';
    if (lum) {
      glowEls.push(`<circle cx="${f(q.x)}" cy="${f(q.y)}" r="14" fill="url(#${id}Glow)"><animate attributeName="r" values="12;18;12" dur="${q.p.id === 'sun' ? 4 : 5}s" repeatCount="indefinite"/></circle>`);
      degEls.push(`<text x="${f(q.x)}" y="${f(q.y + 18)}">${Math.floor(q.p.lon % 30)}°</text>`);
    } else {
      glowEls.push(`<circle cx="${f(q.x)}" cy="${f(q.y)}" r="9" fill="url(#${id}Glow)" opacity="0.55"/>`);
    }
    glyphEls.push(`<text x="${f(q.x)}" y="${f(q.y)}"${lum ? ' font-size="16"' : ''}>${q.p.glyph}&#xFE0E;</text>`);
  }
  parts.push(glowEls.join(''));
  parts.push(`<g font-family="'Noto Sans Symbols','Noto Sans Symbols 2',serif" font-size="12" fill="#FFF3CF" text-anchor="middle" dominant-baseline="central">${glyphEls.join('')}</g>`);
  parts.push(`<g font-family="'IBM Plex Mono',monospace" font-size="7.5" fill="#F0D89A" text-anchor="middle">${degEls.join('')}</g>`);

  const size = opts.size || 340;
  return `<svg role="img" aria-label="${opts.label || 'ผังดาวกำเนิด'}" width="${size}" height="${size}" viewBox="0 0 340 340" fill="none" style="max-width:100%;height:auto">${parts.join('')}</svg>`;
}

const KEY = 'taksila.v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ profile: state.profile })); } catch (e) { /* storage unavailable */ } }

// ---------------- state ----------------

  profile: saved.profile || null,
  chart: null,
  draft: null,
  placeQuery: '',
  chartTab: 0,
  liveOpen: false,
  aspOpen: new Set(),
  weekSel: null,
  match: { sign: null, useDate: false, day: 1, month: 1, yearBE: 2540 },
  tarot: { topic: 0, cards: null, open: 0 },
  num: { mode: 'phone', value: '' },

};
if (state.profile) state.chart = safeChart(state.profile);

function safeChart(p) { try { return computeChart(p); } catch (e) { console.error(e); return null; } }

function blankDraft() {
  const p = state.profile;
  if (p) return JSON.parse(JSON.stringify({ ...p, placeIdx: p.placeIdx ?? -1, custom: p.custom || { lat: p.place.lat, lon: p.place.lon, offset: 7 } }));
  return { name: '', day: 1, month: 1, yearBE: 2540, hour: 12, minute: 0, timeKnown: true, placeIdx: 0, place: PLACES[0], custom: { lat: 13.75, lon: 100.5, offset: 7 } };
}
const daysIn = (m, yBE) => new Date(yBE - 543, m, 0).getDate();
const opts = (arr, sel) => arr.map(([v, t]) => `<option value="${v}"${String(v) === String(sel) ? ' selected' : ''}>${t}</option>`).join('');
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

function placeOptions() {
  const d = state.draft, q = state.placeQuery.trim();

  const rows = list.map(({ p, i }) => `<button type="button" class="option" role="radio" aria-checked="${d.placeIdx === i}" data-act="place" data-i="${i}">

}

function bigThree(ch) {
  const sun = ch.planets[0], moon = ch.planets[1];
  return `<div class="big3">
<div><span class="label" style="font-size:9px">SUN</span><span class="v">${G(sun.glyph)} ${SIGNS[sun.sign].th}</span></div>
<div><span class="label" style="font-size:9px">MOON</span><span class="v">${G(moon.glyph)} ${SIGNS[moon.sign].th}</span></div>
<div><span class="label" style="font-size:9px">RISING</span><span class="v">${ch.asc != null ? SIGNS[signOf(ch.asc)].th : '<span class="small">ไม่ทราบเวลา</span>'}</span></div></div>`;
}

function hudFor(p) {
  const place = p.place;
  return {
    tl: `NATAL ${pad(p.day)}.${pad(p.month)}.${p.yearBE - 543}`,
    tr: p.timeKnown ? `${pad(p.hour)}:${pad(p.minute)} LOCAL` : 'TIME UNKNOWN',
    bl: `LAT ${Math.abs(place.lat).toFixed(2)}${place.lat >= 0 ? 'N' : 'S'}`,
    br: `LON ${Math.abs(place.lon).toFixed(2)}${place.lon >= 0 ? 'E' : 'W'}`
  };
}

function greeting(now) {
  const h = now.getHours();
  return h < 5 ? 'สวัสดียามดึก' : h < 10 ? 'สวัสดีตอนเช้า' : h < 12 ? 'สวัสดีตอนสาย' : h < 16 ? 'สวัสดีตอนบ่าย' : h < 19 ? 'สวัสดีตอนเย็น' : 'สวัสดียามค่ำ';
}

// ---------------- live daily reading ----------------
const pname = (id, th) => id === 'sun' ? 'ดวงอาทิตย์' : id === 'moon' ? 'ดวงจันทร์' : id === 'asc' ? 'ลัคนา' : 'ดาว' + th;
function when(d, now = new Date()) {
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(now)) / 86400000);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return diff === 0 ? 'วันนี้ ' + hm : diff === 1 ? 'พรุ่งนี้ ' + hm : `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${hm}`;
}
const natureColor = (n) => n > 0 ? 'var(--harmony)' : n < 0 ? 'var(--tension)' : 'var(--gold-2)';

const aspKey = (x) => `${x.mover.id}-${x.asp.id}-${x.target.id}`;
const targetGlyph = (t) => t.id === 'asc' ? '<span class="mono" style="font-size:10px;letter-spacing:.05em">ASC</span>' : `<span class="sym">${t.glyph}&#xFE0E;</span>`;

function liveDailyHTML() {
  const ch = state.chart, now = new Date();
  const dl = daily(ch, now);
  const la = liveAspects(ch, now);
  const up = upcomingIngresses(ch, now);
  const top = la[0];
  const open = state.liveOpen;
  const headline = top ? top.reason : dl.headline;
  const basis = top ? `${pname(top.mover.id, top.mover.th)}จร${top.asp.th}${pname(top.target.id, top.target.th)}ในดวงกำเนิด` : dl.basis;
  const timing = (x) => x.applying ? (x.exactAt ? `แม่นยำสุด ${when(x.exactAt, now)}` : 'ส่งผลหลายสัปดาห์') : 'กำลังคลายตัว';
  const trio = (x) => `<span class="sym">${x.mover.glyph}&#xFE0E;</span><span class="sym" style="color:${natureColor(x.asp.nature)}">${ASPECT_GLYPH[x.asp.id]}&#xFE0E;</span>${targetGlyph(x.target)}`;
  const items = la.map((x) => {
    const m = x.mover, t = x.target, col = natureColor(x.asp.nature), k = aspKey(x);
    const pct = Math.round(Math.min(1, x.strength / 1.6) * 100);
    const isOpen = state.aspOpen.has(k);
    return `<li class="asp${isOpen ? ' open' : ''}" style="--c:${col}">
<button class="asp-head" data-act="aspToggle" data-k="${k}" aria-expanded="${isOpen}">
<span class="asp-glyphs" aria-hidden="true">${trio(x)}</span>
<span class="asp-title"><span>${pname(m.id, m.th)}${x.asp.th}${pname(t.id, t.th)}</span><span class="mono">${timing(x)}</span></span>
<span class="chev">${icon('down', 16, 1.6)}</span>
</button>
<div class="fold"><div class="fold-in"><div class="asp-body">
<p class="body" style="font-size:14px">${x.reason}</p>
<p class="small" style="color:${col}">${x.advice}</p>
<dl class="asp-facts">
<div><dt>ดาวจร</dt><dd>${SIGNS[m.sign].th} ${fmtDeg(m.lon)}${m.retro ? ' (ถอยหลัง)' : ''} · ภพ ${m.house}</dd></div>
<div><dt>ดาวกำเนิด</dt><dd>${SIGNS[t.sign].th} ${fmtDeg(t.lon)}</dd></div>
<div><dt>ระยะห่าง</dt><dd>${x.off.toFixed(1)}° · ${x.applying ? 'กำลังเข้าใกล้' : 'ผ่านจุดแม่นยำแล้ว'}</dd></div>
<div><dt>น้ำหนัก</dt><dd><span class="tr-bar" role="img" aria-label="${pct}%"><span style="width:${pct}%;background:${col}"></span></span></dd></div>
</dl></div></div></div></li>`;
  }).join('');
  const nextEvents = up.slice(0, 4).map((e) => `<li><span class="sym" style="color:var(--gold-2)">${PLANETS.find((p) => p.id === e.id).glyph}&#xFE0E;</span>
<span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px">${pname(e.id, PLANETS.find((p) => p.id === e.id).th)}เข้าราศี${SIGNS[e.sign].th}</span><span class="small">ภพ ${e.house} · ${HOUSES[e.house - 1]}</span></span>
<span class="mono" style="font-size:10px;color:var(--gold);white-space:nowrap">${when(e.at, now)}</span></li>`).join('');
  return `<div class="card daily${open ? ' open' : ''}">
<span style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow" style="letter-spacing:.2em;display:flex;align-items:center;gap:8px"><span class="live-dot" aria-hidden="true"></span>TODAY · LIVE</span><span class="mono small" style="font-size:10px">อัปเดต ${pad(now.getHours())}:${pad(now.getMinutes())}</span></span>
<p class="h2" style="font-size:20px">${headline}</p>
<p class="small">ที่มา · <span style="color:var(--text)">${basis}</span></p>
<div class="score-grid">${dl.scores.map((s) => `<div><span>${s.name}</span><span class="bars" role="img" aria-label="${s.name} ${s.score} จาก 5">${[1, 2, 3, 4, 5].map((i) => `<span${i <= s.score ? ' class="on"' : ''}></span>`).join('')}</span></div>`).join('')}</div>
<button class="drawer-toggle" data-act="liveToggle" data-closed="ดูเหตุผล ${la.length} มุมดาว" aria-expanded="${open}">
<span class="peek" aria-hidden="true">${la.slice(0, 3).map((x) => `<span class="chip">${trio(x)}</span>`).join('')}</span>
<span class="lbl">${open ? 'พับเก็บ' : `ดูเหตุผล ${la.length} มุมดาว`}</span>
<span class="chev">${icon('down', 16, 1.6)}</span>
</button>
<div class="fold"><div class="fold-in"><div class="drawer-body">
${la.length ? `<ul class="asp-list">${items}</ul>` : '<p class="small">วันนี้ไม่มีดาวจรทำมุมใกล้ดาวในดวงกำเนิด เป็นวันที่ค่อนข้างสงบ</p>'}
<p class="small legend">${G(ASPECT_GLYPH.conj)} ร่วม ${G(ASPECT_GLYPH.sext)} หกสิบ ${G(ASPECT_GLYPH.square)} ตั้งฉาก ${G(ASPECT_GLYPH.trine)} ตรีโกณ ${G(ASPECT_GLYPH.opp)} เล็ง</p>
<h3 class="label">ถัดไป · ดาวย้ายราศี</h3>
<ul class="next-list">${nextEvents}</ul>
</div></div></div>
</div>`;
}

// ---------------- seven-day outlook ----------------
const WEEKDAY_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const WEEKDAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const RATING_TH = ['', 'ระวังตัว', 'ค่อย ๆ ไป', 'กลาง ๆ', 'ดี', 'ดีมาก'];
const ratingColor = (r) => r >= 4 ? 'var(--gold-2)' : r <= 2 ? 'var(--tension)' : 'var(--muted)';
function moonIcon(ph, r = 7) {
  const k = Math.cos(ph.elongation * Math.PI / 180), rx = Math.abs(k) * r;
  const s1 = ph.waxing ? 1 : 0, s2 = ph.waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  return `<svg width="${2 * r + 2}" height="${2 * r + 2}" viewBox="${-r - 1} ${-r - 1} ${2 * r + 2} ${2 * r + 2}" aria-hidden="true"><circle r="${r}" fill="#2C261B" stroke="#5A4C33" stroke-width="0.6"/><path d="M0 ${-r}A${r} ${r} 0 0 ${s1} 0 ${r}A${rx.toFixed(2)} ${r} 0 0 ${s2} 0 ${-r}Z" fill="#F0D89A"/></svg>`;
}
let weekCache = null;
function weekData() {
  const now = new Date(), key = now.toDateString();
  if (!weekCache || weekCache.key !== key || weekCache.chart !== state.chart) weekCache = { key, chart: state.chart, days: weekAhead(state.chart, now) };
  return weekCache.days;
}
function weekHTML() {
  const days = weekData(), sel = state.weekSel;
  const strip = days.map((d, i) => `<button class="day${sel === i ? ' sel' : ''}" data-act="weekDay" data-i="${i}" aria-pressed="${sel === i}" aria-label="${WEEKDAY[d.date.getDay()]} ${d.date.getDate()} ${RATING_TH[d.rating]}">
<span class="wd">${i === 0 ? 'วันนี้' : WEEKDAY_SHORT[d.date.getDay()]}</span><span class="dn">${d.date.getDate()}</span>${moonIcon(d.phase)}
<span class="dots" aria-hidden="true">${[1, 2, 3, 4, 5].map((n) => `<i style="background:${n <= d.rating ? ratingColor(d.rating) : 'var(--line)'}"></i>`).join('')}</span></button>`).join('');
  let detail = '';
  if (sel != null) {
    const d = days[sel];
    detail = `<div class="card day-detail">
<span class="eyebrow" style="letter-spacing:.14em">${WEEKDAY[d.date.getDay()].toUpperCase()} ${d.date.getDate()} ${MONTHS_SHORT[d.date.getMonth()]} · ${d.phase.th}</span>
<p class="h2" style="font-size:18px;color:${ratingColor(d.rating)}">${RATING_TH[d.rating]}</p>
<p class="small">ดวงจันทร์อยู่ราศี${SIGNS[d.moonSign].th} ผ่านภพ ${d.moonHouse} ของคุณ เรื่อง${HOUSES[d.moonHouse - 1]}จะเด่นขึ้นมาในวันนี้ · ${d.phase.name}</p>
${d.top.length ? `<ul class="day-asp">${d.top.map((x) => `<li style="--c:${natureColor(x.asp.nature)}"><span class="asp-glyphs" aria-hidden="true"><span class="sym">${x.mover.glyph}&#xFE0E;</span><span class="sym" style="color:var(--c)">${ASPECT_GLYPH[x.asp.id]}&#xFE0E;</span>${targetGlyph(x.target)}</span>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:600">${pname(x.mover.id, x.mover.th)}${x.asp.th}${pname(x.target.id, x.target.th)}</span><span class="small">${x.reason}</span></span></li>`).join('')}</ul>` : '<p class="small">ดาวเคลื่อนเร็วไม่ทำมุมสำคัญ เป็นวันเรียบ ๆ เหมาะกับงานประจำ</p>'}
</div>`;
  }
  return `<h2 class="label" style="display:flex;justify-content:space-between"><span>7 วันข้างหน้า</span><span class="mono" style="font-size:10px;letter-spacing:.1em">กดดูรายวัน</span></h2>
<div class="week-strip">${strip}</div>${detail}`;
}

// Real-time refresh: recompute the live section every 30 seconds and announce sign changes.
let liveTimer = null;
let lastSigns = null;
function signSnapshot() {
  const now = new Date();
  return Object.fromEntries(['moon', 'sun', 'mercury', 'venus', 'mars'].map((id) => [id, signOf(lonOf(id, now))]));
}
function tickLive() {
  const box = document.getElementById('live-daily');
  if (!box || !state.chart) return;
  const snap = signSnapshot();
  if (lastSigns) {
    for (const id of Object.keys(snap)) {
      if (snap[id] !== lastSigns[id]) toast(`${pname(id, PLANETS.find((p) => p.id === id).th)}ย้ายเข้าราศี${SIGNS[snap[id]].th}แล้ว ดวงของคุณอัปเดตแล้ว`);
    }
  }
  lastSigns = snap;
  box.innerHTML = liveDailyHTML();
  const wk = document.getElementById('week');
  if (wk && weekCache && weekCache.key !== new Date().toDateString()) { state.weekSel = null; wk.innerHTML = weekHTML(); }
}
function startLive() {
  clearInterval(liveTimer);
  lastSigns = state.chart ? signSnapshot() : null;
  liveTimer = setInterval(tickLive, 30000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tickLive(); });

function keyPattern(ch) {
  const max = Math.max(...ch.signCount);
  if (max >= 3) {
    const s = ch.signCount.indexOf(max);
    const inSign = ch.planets.filter((p) => p.sign === s);
    const h = inSign[0].house;
    return {
      title: `ดาว ${max} ดวงรวมกันในราศี${SIGNS[s].th} ภพ ${h}`,
      body: `พลังชีวิตรวมอยู่ที่เรื่อง${HOUSES[h - 1]} และแสดงออกแบบชาว${SIGNS[s].th}: ${SIGNS[s].trait}`,
      code: inSign.map((p) => p.glyph).join(' ') + ' · ' + SIGNS[s].en.toUpperCase() + ' · H' + h
    };
  }
  const e = ch.elementCount.indexOf(Math.max(...ch.elementCount));
  return { title: `ธาตุ${ELEMENTS[e].th}เด่นที่สุดในดวง`, body: 'ดาวส่วนใหญ่อยู่ในราศีธาตุ' + ELEMENTS[e].th + ' เป็นพลังหลักที่ขับเคลื่อนชีวิต', code: ELEMENTS[e].id.toUpperCase() + ' DOMINANT' };
}

function planetText(p) {
  return `${p.kw} แสดงออกแบบราศี${SIGNS[p.sign].th} (${SIGNS[p.sign].trait}) และเกี่ยวกับเรื่อง${HOUSES[p.house - 1]}${p.retro ? ' · ดาวถอยหลังตอนเกิด พลังของดาวนี้หันเข้าด้านใน' : ''}`;
}
const ASPECT_TEXT = {
  1: 'สองพลังส่งเสริมกัน ใช้ได้อย่างเป็นธรรมชาติ',
  [-1]: 'สองพลังดึงกันคนละทาง เป็นแรงผลักให้เติบโตถ้าหาสมดุลได้',
  0: 'สองพลังหลอมรวมกัน ส่งผลชัดเจน'
};

function viewChart() {
  const ch = state.chart, p = state.profile, tab = state.chartTab, now = new Date();
  const kp = keyPattern(ch);
  const elOrder = [0, 1, 2, 3].sort((a, b) => ch.elementCount[b] - ch.elementCount[a]);
  const top = elOrder[0], low = elOrder[3];
  let body = '';
  if (tab === 0) {
    body = `<div style="display:flex;justify-content:center">${starMap(ch, { id: 'chart', houses: true, label: 'ผังดาวกำเนิดฉบับเต็ม' })}</div>
<div class="legend"><span><i style="background:var(--harmony)"></i>HARMONY</span><span><i style="background:var(--tension)"></i>TENSION</span><span>WHOLE SIGN</span></div>

function reduceNum(n, keepMaster) {
  while (n > 9 && !(keepMaster && (n === 11 || n === 22 || n === 33))) n = String(n).split('').reduce((a, b) => a + +b, 0);
  return n;
}
function numResults() {
  const v = state.num.value.replace(/[^0-9]/g, '');
  if (!v) return '<p class="small">พิมพ์ตัวเลขเพื่อดูผลวิเคราะห์</p>';
  const sum = v.split('').reduce((a, b) => a + +b, 0);
  const red = reduceNum(sum, false);
  const src = state.num.mode === 'phone' ? v.slice(-7) : v;
  const pairs = [];
  for (let i = 0; i < src.length - 1; i++) {
    const a = +src[i], b = +src[i + 1];
    const bad = [7, 8].includes(a) || [7, 8].includes(b);
    const neutral = a === 0 || b === 0;
    pairs.push({ n: src[i] + src[i + 1], bad, neutral, meaning: DIGITS[a] + ' + ' + DIGITS[b] });
  }
  return `<p class="mono" style="font-size:13px;margin:0;color:var(--text-2)">SUM <span style="color:var(--teal)">${sum}</span> → ${red} · ${SUM_MEANING[red] || ''}</p>
${pairs.length ? `<h2 class="label" style="margin-top:6px">PAIRS · คู่เลข${state.num.mode === 'phone' ? ' (7 หลักท้าย)' : ''}</h2>
<div class="pairs">${pairs.map((p) => `<div class="${p.bad ? 'bad' : ''}"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:22px">${p.n}</span><span class="mono" style="font-size:12px;font-weight:600;color:${p.bad ? 'var(--tension)' : p.neutral ? 'var(--muted)' : 'var(--teal)'}">${p.bad ? '!' : p.neutral ? '·' : '+'}</span></div><span class="small" style="font-size:11px">${p.meaning}</span></div>`).join('')}</div>` : ''}

}
