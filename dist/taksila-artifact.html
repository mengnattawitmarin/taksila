    const ps = ch.planets.filter((p) => p.sign === stellium.i);
    const h = ch.timeKnown ? ps[0].house : null;
    highlights.push({ title: `ดาวรวมกลุ่ม ${stellium.n} ดวงในราศี${SIGNS[stellium.i].th}`, body: `${ps.map(pnm).join(' ')} อยู่ด้วยกัน พลังชีวิตจึงเทไปที่${h ? 'เรื่อง' + HOUSES[h - 1] + ' (ภพ ' + h + ')' : 'คุณสมบัติของราศีนี้'} อย่างชัดเจน: ${SIGNS[stellium.i].trait}` });
  }
  highlights.push({ title: `${pnm(ruler)}คือดาวเด่นของดวง`, body: `พลังของ${pnm(ruler)} (${ruler.kw || PLANETS.find((x) => x.id === ruler.id).kw}) โดดเด่นกว่าดาวอื่น ส่งผลต่อบุคลิกและเส้นทางชีวิตมากที่สุด` });
  highlights.push({ title: `ธาตุ${ELEMENT_TEXT[elOrder[0]].th}เด่น · ${MODE_TEXT[topMode].th}`, body: `${ELEMENT_TEXT[elOrder[0]].core} และ${MODE_TEXT[topMode].text}` });
  if (ch.timeKnown) {
    const angular = ch.planets.filter((p) => p.house === 1 || p.house === 10).filter((p) => p.id !== ruler.id);
    if (angular.length) highlights.push({ title: `${angular.map(pnm).join(' ')} อยู่มุมเด่นของดวง`, body: angular.map((p) => `${pnm(p)}ในภพ ${p.house} ทำให้${p.house === 1 ? 'บุคลิกมีพลังของ' : 'การงานได้รับพลังของ'}${(PLANETS.find((x) => x.id === p.id).kw)}`).join(' ') });
  }

  // Personality
  const personality = [
    { label: 'ตัวตนแท้', sign: sun.sign, text: `ดวงอาทิตย์ราศี${SIGNS[sun.sign].th}: ${SIGNS[sun.sign].trait}` },
    { label: 'จิตใจ', sign: moon.sign, text: `ดวงจันทร์ราศี${SIGNS[moon.sign].th}: ${MOON_NEED[moon.sign]}` },
    ascSign != null ? { label: 'ภาพที่คนเห็น', sign: ascSign, text: `ลัคนาราศี${SIGNS[ascSign].th}: ${SIGNS[ascSign].trait}` } : null,
    { label: 'ความรัก', sign: venus.sign, text: `ดาวศุกร์ราศี${SIGNS[venus.sign].th}: ${VENUS_LOVE[venus.sign]}` }
  ].filter(Boolean);

  // Career: 10th sign (whole sign) or Sun sign, planets in 10th, dominant planet.
  const tenth = ch.timeKnown ? (ascSign + 9) % 12 : null;
  const inTenth = ch.timeKnown ? ch.planets.filter((p) => p.house === 10) : [];
  const careerSet = new Set();
  inTenth.forEach((p) => PLANET_CAREER[p.id].slice(0, 2).forEach((c) => careerSet.add(c)));
  PLANET_CAREER[ruler.id].forEach((c) => careerSet.add(c));
  if (tenth != null) PLANET_CAREER[RULER[tenth]].slice(0, 2).forEach((c) => careerSet.add(c));
  PLANET_CAREER[dom[1].p.id].slice(0, 1).forEach((c) => careerSet.add(c));
  const career = {
    style: tenth != null ? `ภพการงาน (ภพ 10) เป็นราศี${SIGNS[tenth].th}: เหมาะกับ${SIGN_CAREER[tenth]}` : `ดวงอาทิตย์ราศี${SIGNS[sun.sign].th}: เหมาะกับ${SIGN_CAREER[sun.sign]}`,
    list: [...careerSet].slice(0, 8),
    basis: [inTenth.length ? `${inTenth.map(pnm).join(' ')}ในภพ 10` : null, `ดาวเด่น ${pnm(ruler)}`, tenth != null ? `เจ้าภพ 10 คือ${pnm(PLANETS.find((x) => x.id === RULER[tenth]))}` : null].filter(Boolean).join(' · ')
  };

  // Talents and cautions from aspects
  const talents = [], cautions = [];
  for (const a of ch.aspects) {
    const def = PAIRS[pairKey(a.a.id, a.b.id)];
    if (!def) continue;
    const slow = ['jupiter', 'saturn', 'uranus', 'neptune', 'pluto'];
    const tight = Math.max(0, 1 - a.off / 8) * (slow.includes(a.a.id) && slow.includes(a.b.id) ? 0.55 : 1);
    const mal = MALEFIC.includes(a.a.id) || MALEFIC.includes(a.b.id);
    const src = `${pnm(a.a)}${a.th}${pnm(a.b)} (${a.off.toFixed(1)}°)`;
    if (a.nature > 0 || (a.nature === 0 && !mal)) talents.push({ title: def.good[0], body: def.good[1], src, w: tight, glyphs: [a.a.glyph, a.b.glyph], asp: a.id });
    else if (a.nature < 0) cautions.push({ title: def.hard[0], body: def.hard[1], src, w: tight, glyphs: [a.a.glyph, a.b.glyph], asp: a.id });
    else { talents.push({ title: def.good[0], body: def.good[1], src, w: tight * 0.8, glyphs: [a.a.glyph, a.b.glyph], asp: a.id }); cautions.push({ title: def.hard[0], body: def.hard[1], src, w: tight * 0.6, glyphs: [a.a.glyph, a.b.glyph], asp: a.id }); }
  }
  // Talents from placement
  const neptune = ch.planets.find((p) => p.id === 'neptune');
  if (ch.timeKnown && [8, 12].includes(neptune.house) || el[3] >= 6) talents.push({ title: 'มีเซนส์', body: el[3] >= 6 ? 'ธาตุน้ำในดวงสูง รับรู้บรรยากาศและความรู้สึกได้ไว' : `ดาวเนปจูนในภพ ${neptune.house} ทำให้สัมผัสพิเศษไว`, src: el[3] >= 6 ? 'ธาตุน้ำเด่น' : `เนปจูนภพ ${neptune.house}`, w: 0.5, glyphs: ['♆'] });
  if (el[1] >= 6) talents.push({ title: 'ขยัน ทำจริง', body: 'ธาตุดินในดวงสูง ทำงานต่อเนื่องจนเห็นผล', src: 'ธาตุดินเด่น', w: 0.45, glyphs: ['⊕'] });
  if (el[2] >= 6) talents.push({ title: 'เข้าสังคมเก่ง', body: 'ธาตุลมในดวงสูง คุยกับคนได้ทุกแบบ', src: 'ธาตุลมเด่น', w: 0.45, glyphs: ['≋'] });
  if (el[0] >= 6) talents.push({ title: 'มีภาวะผู้นำ', body: 'ธาตุไฟในดวงสูง กล้าเริ่มและนำคนอื่น', src: 'ธาตุไฟเด่น', w: 0.45, glyphs: ['△'] });
  // dedupe by title, strongest first
  const uniq = (arr) => { const seen = new Set(); return arr.sort((a, b) => b.w - a.w).filter((x) => !seen.has(x.title) && seen.add(x.title)); };

  // Cautions from placement
  const low = elOrder[3];
  if (el[low] <= 1) cautions.push({ title: `ขาดธาตุ${ELEMENT_TEXT[low].th}`, body: ELEMENT_TEXT[low].lack, src: `ธาตุ${ELEMENT_TEXT[low].th} ${el[low]} จุด`, w: 0.5, glyphs: [] });
  if (ch.timeKnown) cautions.push({ title: `บทเรียนเรื่อง${HOUSES[saturn.house - 1].split(' ')[0]}`, body: `ดาวเสาร์ในภพ ${saturn.house} บอกว่าเรื่อง${HOUSES[saturn.house - 1]}จะมาช้าและต้องใช้ความอดทน แต่เมื่อสำเร็จจะมั่นคงมาก`, src: `เสาร์ภพ ${saturn.house}`, w: 0.35, glyphs: ['♄'] });

  // Luck and health
  const luck = ch.timeKnown ? `ดาวพฤหัสในภพ ${jupiter.house} โชคและผู้อุปถัมภ์มักมาทางเรื่อง${HOUSES[jupiter.house - 1]}` : `ดาวพฤหัสในราศี${SIGNS[jupiter.sign].th} โชคมาเมื่อ${SIGNS[jupiter.sign].trait.split(' ')[0]}`;
  const health = [ascSign != null ? `ลัคนาราศี${SIGNS[ascSign].th}: ${SIGN_BODY[ascSign]}` : null, ch.timeKnown ? `ภพ 6 ราศี${SIGNS[(ascSign + 5) % 12].th}: ${SIGN_BODY[(ascSign + 5) % 12]}` : `ดวงอาทิตย์ราศี${SIGNS[sun.sign].th}: ${SIGN_BODY[sun.sign]}`].filter(Boolean);

  return { symbols, highlights, personality, career, talents: uniq(talents).slice(0, 6), cautions: uniq(cautions).slice(0, 5), luck, health, ruler, elements: el };
}

// ---------- sixth sense: intuition, spirit sensitivity, premonition, reading people, astrologer talent ----------
// Signatures collected from common Western psychic-astrology practice (Neptune, Moon, Pluto, Uranus,
// the 8th and 12th houses, water emphasis) plus the south node (เกตุ, Ketu), which Thai and Indian
// astrology treat as the planet of ญาณ and the unseen.
const SENSES = [
  { id: 'intuition', th: 'สัญชาตญาณ เซนส์แรง', icon: '\u263D', desc: 'รู้สึกได้ก่อนคนอื่นว่าอะไรจะเกิด อ่านบรรยากาศเก่ง' },
  { id: 'spirit', th: 'สัมผัสสิ่งลึกลับ โลกวิญญาณ', icon: '\u2646', desc: 'ไวต่อพลังงานที่มองไม่เห็น รับรู้สิ่งเร้นลับ บางคนเห็นหรือรู้สึกถึงวิญญาณ' },
  { id: 'dream', th: 'ฝันเป็นลาง', icon: '\u2727', desc: 'ความฝันมักมีความหมาย ฝันแล้วเป็นจริง' },
  { id: 'flash', th: 'ลางสังหรณ์ฉับพลัน', icon: '\u2645', desc: 'ได้ยินเสียงในใจหรือไอเดียผุดขึ้นมาแบบไม่รู้ที่มา' },
  { id: 'people', th: 'หยั่งรู้ใจคน', icon: '\u2647', desc: 'มองทะลุเจตนาและความลับของคนได้ลึก' },
  { id: 'seer', th: 'พรสวรรค์ด้านการดูดวง', icon: '\u263F', desc: 'มีแววเป็นหมอดู โหร หรือผู้ให้คำปรึกษาด้านจิตวิญญาณ' }
];
const LEVEL = (s) => s >= 70 ? 'เด่นมาก' : s >= 45 ? 'เด่น' : s >= 22 ? 'มีบ้าง' : 'น้อย';

function sixthSense(ch) {
  const P = Object.fromEntries(ch.planets.map((p) => [p.id, p]));
  const known = ch.timeKnown;
  const asp = (a, b) => ch.aspects.find((x) => (x.a.id === a && x.b.id === b) || (x.a.id === b && x.b.id === a));
  const ketuLon = rev360(meanNode(ch.utc) + 180), ketuSign = signOf(ketuLon), ketuHouse = ch.houseOf(ketuLon);
  const near = (lon, id, orb = 8) => angDist(lon, P[id].lon) <= orb;
  const water = ch.planets.filter((p) => [3, 7, 11].includes(p.sign)).length + (known && [3, 7, 11].includes(signOf(ch.asc)) ? 2 : 0);
  const inHouse = (h) => known ? ch.planets.filter((p) => p.house === h) : [];
  const res = Object.fromEntries(SENSES.map((x) => [x.id, { ...x, score: 0, why: [] }]));
  const add = (id, pts, why) => { res[id].score += pts; res[id].why.push(why); };
  const aspW = (a) => Math.max(0.35, 1 - a.off / 8);
  const aspTxt = (a) => `${pnm(a.a)}${a.th}${pnm(a.b)} (${a.off.toFixed(1)}°)`;

  // Moon–Neptune: the classic medium/empath signature.
  const mn = asp('moon', 'neptune');
  if (mn) { const w = aspW(mn); add('intuition', 30 * w, aspTxt(mn)); add('spirit', 34 * w, aspTxt(mn)); add('dream', 30 * w, aspTxt(mn)); }
  const sn = asp('sun', 'neptune'); if (sn) { const w = aspW(sn); add('spirit', 16 * w, aspTxt(sn)); add('dream', 14 * w, aspTxt(sn)); }
  const men = asp('mercury', 'neptune'); if (men) { const w = aspW(men); add('spirit', 14 * w, aspTxt(men)); add('seer', 16 * w, aspTxt(men)); add('intuition', 10 * w, aspTxt(men)); }
  const mm = asp('moon', 'mercury'); if (mm && mm.id === 'conj') add('intuition', 10, `ดวงจันทร์ร่วมดาวพุธ ความคิดกับความรู้สึกเชื่อมกัน`);
  // Uranus with Moon or Mercury: sudden knowing, clairaudience; Mercury–Uranus is the astrologer's mind.
  const mu = asp('moon', 'uranus'); if (mu) { const w = aspW(mu); add('flash', 30 * w, aspTxt(mu)); add('intuition', 8 * w, aspTxt(mu)); }
  const meu = asp('mercury', 'uranus'); if (meu) { const w = aspW(meu); add('flash', 26 * w, aspTxt(meu)); add('seer', 26 * w, aspTxt(meu)); }
  // Pluto with personal planets: x-ray insight into people and hidden matters.
  for (const id of ['moon', 'sun', 'mercury', 'venus', 'mars']) {
    const a = asp(id, 'pluto'); if (!a) continue;
    const w = aspW(a);
    add('people', (id === 'moon' || id === 'mercury' ? 26 : 16) * w, aspTxt(a));
    if (id === 'moon') add('spirit', 10 * w, aspTxt(a));
    if (id === 'mercury') add('seer', 12 * w, aspTxt(a));
  }
  const jn = asp('jupiter', 'neptune'); if (jn) add('seer', 8 * aspW(jn), `${aspTxt(jn)} ความศรัทธาและความสนใจด้านจิตวิญญาณ`);
  const mj = asp('mercury', 'jupiter'); if (mj && mj.nature >= 0) add('seer', 8 * aspW(mj), `${aspTxt(mj)} อธิบายและแนะนำคนเก่ง`);

  // Houses (need birth time).
  if (known) {
    const h12 = inHouse(12), h8 = inHouse(8), h9 = inHouse(9);
    if (P.moon.house === 12) { add('intuition', 18, 'ดวงจันทร์ในภพ 12 (ภพแห่งจิตใต้สำนึก)'); add('dream', 26, 'ดวงจันทร์ในภพ 12'); add('spirit', 14, 'ดวงจันทร์ในภพ 12'); }
    if (P.moon.house === 8) { add('spirit', 18, 'ดวงจันทร์ในภพ 8 (ภพแห่งความลึกลับ)'); add('people', 14, 'ดวงจันทร์ในภพ 8'); add('intuition', 10, 'ดวงจันทร์ในภพ 8'); }
    if (P.neptune.house === 12) { add('spirit', 24, 'ดาวเนปจูนในภพ 12'); add('dream', 18, 'ดาวเนปจูนในภพ 12'); }
    if (P.neptune.house === 8) { add('spirit', 22, 'ดาวเนปจูนในภพ 8'); add('intuition', 8, 'ดาวเนปจูนในภพ 8'); }
    if (P.neptune.house === 1 || angDist(P.neptune.lon, ch.asc) <= 8) add('spirit', 18, 'ดาวเนปจูนอยู่ใกล้ลัคนา ร่างกายเป็นเหมือนเสาอากาศรับพลัง');
    if (P.pluto.house === 8) add('people', 16, 'ดาวพลูโตในภพ 8');
    if (P.pluto.house === 1) add('people', 12, 'ดาวพลูโตในภพ 1');
    if (P.uranus.house === 12 || P.uranus.house === 8) add('flash', 14, `ดาวมฤตยูในภพ ${P.uranus.house}`);
    if ([8, 9, 12].includes(P.mercury.house)) add('seer', 16, `ดาวพุธในภพ ${P.mercury.house} ความคิดสนใจเรื่องลึกลับและปรัชญา`);
    if (P.uranus.house === 1 || P.uranus.house === 10 || P.uranus.house === 9) add('seer', 14, `ดาวมฤตยู (ดาวแห่งโหราศาสตร์) เด่นในภพ ${P.uranus.house}`);
    if (h12.length >= 3) { add('spirit', 14, `ดาว ${h12.length} ดวงในภพ 12`); add('dream', 12, `ดาว ${h12.length} ดวงในภพ 12`); }
    if (h8.length >= 3) { add('spirit', 10, `ดาว ${h8.length} ดวงในภพ 8`); add('seer', 10, `ดาว ${h8.length} ดวงในภพ 8`); }
    if (h9.length >= 2) add('seer', 8, `ดาว ${h9.length} ดวงในภพ 9 (ภพแห่งปรัชญาและศาสตร์ชั้นสูง)`);
    // Ketu (เกตุ)
    if (ketuHouse === 12) { add('spirit', 18, 'ดาวเกตุในภพ 12 ญาณและบุญเก่าด้านจิตวิญญาณ'); add('seer', 10, 'ดาวเกตุในภพ 12'); }
    if (ketuHouse === 8) { add('spirit', 14, 'ดาวเกตุในภพ 8 รับรู้เรื่องลี้ลับ'); add('seer', 8, 'ดาวเกตุในภพ 8'); }
    if (P.saturn.house === 12 || P.saturn.house === 8) add('spirit', 6, `ดาวเสาร์ในภพ ${P.saturn.house} สนใจเรื่องชีวิตหลังความตาย`);
  }
  if (near(ketuLon, 'moon')) { add('intuition', 16, 'ดาวเกตุกุมดวงจันทร์ ญาณหยั่งรู้แรง'); add('spirit', 12, 'ดาวเกตุกุมดวงจันทร์'); }
  if (near(ketuLon, 'mercury')) add('seer', 12, 'ดาวเกตุกุมดาวพุธ ความคิดเชื่อมกับญาณ');
  if (near(ketuLon, 'neptune')) add('spirit', 12, 'ดาวเกตุกุมดาวเนปจูน');

  // Signs.
  if ([3, 7, 11].includes(P.moon.sign)) { add('intuition', 14, `ดวงจันทร์ราศี${SIGNS[P.moon.sign].th} (ธาตุน้ำ)`); if (P.moon.sign === 11) add('dream', 14, 'ดวงจันทร์ราศีมีน'); if (P.moon.sign === 7) add('people', 12, 'ดวงจันทร์ราศีพิจิก'); }
  if (P.sun.sign === 11) { add('intuition', 8, 'ดวงอาทิตย์ราศีมีน'); add('dream', 8, 'ดวงอาทิตย์ราศีมีน'); }
  if (P.sun.sign === 7 || P.mercury.sign === 7) add('people', 8, `${P.sun.sign === 7 ? 'ดวงอาทิตย์' : 'ดาวพุธ'}ราศีพิจิก`);
  if (P.mercury.sign === 11) add('spirit', 6, 'ดาวพุธราศีมีน รับข้อมูลจากความรู้สึก');
  if (P.sun.sign === 10 || P.mercury.sign === 10 || (known && signOf(ch.asc) === 10)) add('seer', 8, 'ราศีกุมภ์เด่น (ราศีของโหราศาสตร์)');
  if (known && signOf(ch.asc) === 11) { add('spirit', 10, 'ลัคนาราศีมีน'); add('intuition', 8, 'ลัคนาราศีมีน'); }
  if (known && signOf(ch.asc) === 7) add('people', 10, 'ลัคนาราศีพิจิก');
  if (water >= 5) add('intuition', 14, `ธาตุน้ำในดวงสูง (${water} จุด)`);

  // Astrologer talent also grows with overall sensitivity.
  const base = (res.intuition.score + res.spirit.score + res.people.score) / 3;
  if (base > 25) add('seer', Math.min(16, base * 0.3), 'เซนส์โดยรวมดี ช่วยให้อ่านดวงได้ลึกกว่าตำรา');

  const list = SENSES.map((x) => {
    const r = res[x.id];
    const score = Math.round(Math.min(100, r.score));
    return { ...r, score, level: LEVEL(score), why: [...new Set(r.why)].slice(0, 4) };
  });
  const overall = Math.round(list.reduce((a, x) => a + x.score, 0) / list.length * 1.25);
  const top = [...list].sort((a, b) => b.score - a.score)[0];
  return { list, overall: Math.min(100, overall), top, ketu: { lon: ketuLon, sign: ketuSign, house: known ? ketuHouse : null } };
}
const rev360 = (x) => ((x % 360) + 360) % 360;

// ---- js/tarot.js ----
// Rider–Waite–Smith tarot: 78 cards with art by Pamela Colman Smith (1909, public domain).
// Meanings follow A. E. Waite's "The Pictorial Key to the Tarot" (1910) and the reading
// tradition built on Smith's pictures, retold in everyday Thai.

// Draw distinct cards using the browser's crypto random. About one in three come up reversed.
function drawCards(count) {
  const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const pool = CARDS.map((_, i) => i);
  for (let i = pool.length - 1; i > 0; i--) { const j = rnd(i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, count).map((i) => ({ i, rev: rnd(3) === 0 }));
}

const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const randomDigit = () => rnd(10);
const randomInt = (n) => rnd(n);

// ---------- ping-pong globe ----------
// Balls carry hidden digits. Air from the bottom keeps them dancing; "stir" blows harder.
function mountGlobe(el, { count = 24, onPick } = {}) {
  const S = el.clientWidth, R = S / 2, r = Math.round(S * 0.062);
  const balls = [];
  const digits = Array.from({ length: count }, (_, k) => k % 10);
  for (let k = digits.length - 1; k > 0; k--) { const j = rnd(k + 1); [digits[k], digits[j]] = [digits[j], digits[k]]; }
  for (let k = 0; k < count; k++) {
    const d = document.createElement('button');
    d.className = 'pball';
    d.type = 'button';
    d.setAttribute('aria-label', 'จับลูกปิงปอง');
    d.style.width = d.style.height = 2 * r + 'px';
    el.appendChild(d);
    const a = Math.random() * Math.PI * 2, m = Math.random() * (R - r) * 0.8;
    balls.push({ el: d, x: R + Math.cos(a) * m, y: R + Math.sin(a) * m, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, digit: digits[k], hue: k % 3 });
    d.classList.add('h' + (k % 3));
  }
  let stirUntil = 0, raf = 0, alive = true;
  const g = 0.32, maxR = R - r - 2;
  function step(t) {
    if (!alive) return;
    const strong = t < stirUntil;
    for (const b of balls) {
      b.vy += g;
      // blower at the bottom of the globe
      if (b.y > R + R * 0.35) {
        const p = strong ? 1.5 : 0.48;
        b.vy -= Math.random() * p * 2.2;
        b.vx += (Math.random() - 0.5) * p * 2.2;
      }
      if (strong) { b.vx += (Math.random() - 0.5) * 0.9; b.vy += (Math.random() - 0.5) * 0.9; }
      b.vx *= 0.992; b.vy *= 0.992;
      b.x += b.vx; b.y += b.vy;
      const dx = b.x - R, dy = b.y - R, dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        const nx = dx / dist, ny = dy / dist, dot = b.vx * nx + b.vy * ny;
        if (dot > 0) { b.vx -= 1.75 * dot * nx; b.vy -= 1.75 * dot * ny; }
        b.x = R + nx * maxR; b.y = R + ny * maxR;
      }
    }
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < 2 * r) {
          const nx = dx / d, ny = dy / d, over = (2 * r - d) / 2;
          a.x -= nx * over; a.y -= ny * over; b.x += nx * over; b.y += ny * over;
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) { const imp = -rel * 0.9; a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny; }
        }
      }
    }
    for (const b of balls) b.el.style.transform = `translate(${(b.x - r).toFixed(1)}px,${(b.y - r).toFixed(1)}px) rotate(${(b.x * 3).toFixed(0)}deg)`;
    raf = requestAnimationFrame(step);
  }
  raf = requestAnimationFrame(step);
  el.addEventListener('pointerdown', (e) => {
    const t = e.target.closest('.pball');
    if (!t) return;
    e.preventDefault();
    const i = balls.findIndex((b) => b.el === t);
    if (i < 0) return;
    const [b] = balls.splice(i, 1);
    t.classList.add('picked');
    setTimeout(() => t.remove(), 450);
    if (onPick) onPick(b.digit, b.hue);
  });
  return {
    stir(ms = 1600) { stirUntil = performance.now() + ms; el.classList.add('stirring'); setTimeout(() => el.classList.remove('stirring'), ms); },
    destroy() { alive = false; cancelAnimationFrame(raf); }
  };
}

// ---------- numbered incense ----------
// The ember moves down the stick; each digit appears in the ash, then the ash drops into the pot.
function burnIncense(el, digits, { onDigit, onDone, duration = 12000 } = {}) {
  const ash = el.querySelector('.i-ash'), body = el.querySelector('.i-body'), ember = el.querySelector('.i-ember');
  const smoke = el.querySelector('.i-smoke'), wins = [...el.querySelectorAll('.i-dig')];
  const zones = [0.24, 0.5, 0.76], start = 0.05, end = 0.93;
  wins.forEach((w, k) => { w.textContent = digits[k]; w.style.top = zones[k] * 100 + '%'; });
  let ashTop = start, dropped = 0, raf = 0, alive = true;
  const t0 = performance.now();
  el.classList.add('lit');
  function frame(t) {
    if (!alive) return;
    const p = Math.min(1, (t - t0) / duration);
    const front = start + (end - start) * p;
    body.style.top = front * 100 + '%';
    ember.style.top = front * 100 + '%';
    smoke.style.top = front * 100 + '%';
    ash.style.top = ashTop * 100 + '%';
    ash.style.height = Math.max(0, front - ashTop) * 100 + '%';
    wins.forEach((w, k) => {
      if (k < dropped) return;
      if (front > zones[k] + 0.03) w.classList.add('show');
    });
    if (dropped < 3 && front > zones[dropped] + 0.13) {
      const cut = zones[dropped] + 0.07;
      dropAsh(ashTop, cut, dropped);
      ashTop = cut; dropped += 1;
    }
    if (p < 1) raf = requestAnimationFrame(frame);
    else {
      while (dropped < 3) { dropAsh(ashTop, zones[dropped] + 0.07, dropped); ashTop = zones[dropped] + 0.07; dropped += 1; }
      el.classList.remove('lit'); el.classList.add('done');
      ash.style.height = '0';
      if (onDone) setTimeout(onDone, 900);
    }
  }
  function dropAsh(top, bottom, k) {
    const piece = document.createElement('div');
    piece.className = 'i-fall';
    piece.style.top = top * 100 + '%';
    piece.style.height = (bottom - top) * 100 + '%';
    const w = wins[k];
    const dg = document.createElement('span');
    dg.textContent = w.textContent;
    dg.style.top = ((zones[k] - top) / (bottom - top)) * 100 + '%';
    piece.appendChild(dg);
    w.classList.remove('show'); w.classList.add('gone');
    el.appendChild(piece);
    setTimeout(() => piece.remove(), 1600);
    if (onDigit) setTimeout(() => onDigit(k, digits[k]), 700);
  }
  raf = requestAnimationFrame(frame);
  return { destroy() { alive = false; cancelAnimationFrame(raf); } };
}

// Hold the button (or shake the phone) to build up energy; at 100% one stick falls out.
function mountSiamsi(el, { total = 28, onFall } = {}) {
  const cyl = el.querySelector('.ss-cyl'), rise = el.querySelector('.ss-rise');
  const meter = document.querySelector('.ss-meter i'), btn = document.querySelector('.ss-shake');
  const no = rnd(total) + 1;
  rise.querySelector('b').textContent = thaiNum(no);
  let energy = 0, holding = false, lastShake = 0, raf = 0, alive = true, fallen = false;
  // finger drag state
  let drag = null, ox = 0, oy = 0, lastDir = 0, lastBuzz = 0;
  const place = () => {
    cyl.style.transform = `translate(${ox.toFixed(1)}px, ${oy.toFixed(1)}px) rotate(${(-16 + ox * 0.35).toFixed(1)}deg)`;
  };
  const kick = (amount) => {
    if (fallen) return;
    energy = Math.min(1, energy + amount);
    lastShake = performance.now();
  };
  cyl.addEventListener('pointerdown', (e) => {
    if (fallen) return;
    e.preventDefault();
    cyl.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, t: performance.now() };
    cyl.classList.add('held');
  });
  cyl.addEventListener('pointermove', (e) => {
    if (!drag || fallen) return;
    const now = performance.now(), dt = Math.max(8, now - drag.t);
    const vx = (e.clientX - drag.px) / dt, vy = (e.clientY - drag.py) / dt;
    ox = Math.max(-70, Math.min(70, (e.clientX - drag.x) * 0.8));
    oy = Math.max(-50, Math.min(40, (e.clientY - drag.y) * 0.6));
    place();
    const speed = Math.hypot(vx, vy);
    kick(Math.min(0.02, speed * 0.009));
    const dir = Math.sign(e.clientX - drag.px) || Math.sign(e.clientY - drag.py);
    if (dir && lastDir && dir !== lastDir && speed > 0.25) {
      kick(0.025);
      cyl.classList.remove('clack'); void cyl.offsetWidth; cyl.classList.add('clack');
      if (navigator.vibrate && now - lastBuzz > 90) { navigator.vibrate(14); lastBuzz = now; }
    }
    if (dir) lastDir = dir;
    drag.px = e.clientX; drag.py = e.clientY; drag.t = now;
  });
  const release = () => {
    drag = null; cyl.classList.remove('held');
    if (!fallen) { ox = 0; oy = 0; cyl.style.transition = 'transform .35s cubic-bezier(.3,1.6,.5,1)'; place(); setTimeout(() => { cyl.style.transition = ''; }, 360); }
  };
  cyl.addEventListener('pointerup', release);
  cyl.addEventListener('pointercancel', release);
  // hold-to-shake button
  const down = (e) => { e.preventDefault(); holding = true; };
  const up = () => { holding = false; };
  if (btn) {
    btn.addEventListener('pointerdown', down);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, up));
  }
  // real phone shake
  let prev = null;
  const onMotion = (e) => {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    if (prev) {
      const d = Math.abs(a.x - prev.x) + Math.abs(a.y - prev.y) + Math.abs(a.z - prev.z);
      if (d > 9) kick(Math.min(0.04, d * 0.0025));
    }
    prev = { x: a.x, y: a.y, z: a.z };
  };
  window.addEventListener('devicemotion', onMotion);

  function frame(t) {
    if (!alive) return;
    if (holding && !fallen) { kick(0.0075 + Math.random() * 0.004); if (navigator.vibrate && Math.random() < 0.06) navigator.vibrate(12); }
    const active = holding || t - lastShake < 160;
    cyl.classList.toggle('shaking', holding && !fallen);
    cyl.classList.toggle('active', active && !fallen);
    if (!active && !fallen) energy = Math.max(0, energy - 0.0015);
    meter.style.width = (energy * 100).toFixed(1) + '%';
    // the chosen stick works its way out, hopping a little while you shake
    const hop = active && !fallen ? Math.abs(Math.sin(t / 45)) * 6 * energy : 0;

    rise.style.opacity = energy > 0.08 ? '1' : '0';

      fallen = true;
      drag = null;

      ox = 0; oy = 0; cyl.style.transition = 'transform .4s ease'; place();
      rise.classList.add('fly');
      if (navigator.vibrate) navigator.vibrate([30, 40, 60]);

}

async function askMotion() {

// Screen angle (degrees, 0 = right, 90 = down) for an ecliptic longitude.
// The rising point sits on the left and the zodiac runs counter-clockwise.
function screenAngle(chart, lon) {
  const base = chart.asc != null ? chart.asc : chart.firstSign * 30;
  return rev(180 + base - lon);
}
function pt(r, a) {
  const t = (a * Math.PI) / 180;
  return [C + r * Math.cos(t), C + r * Math.sin(t)];
}
const f = (n) => n.toFixed(1);

function starMap(chart, opts = {}) {
  const id = opts.id || 'm';
  const showHouses = opts.houses && chart.timeKnown;
  const hud = opts.hud || {};
  const parts = [];

  parts.push(`<defs>
<radialGradient id="${id}Sky" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#3D2E15"/><stop offset="1" stop-color="#120D06"/></radialGradient>
<radialGradient id="${id}Glow"><stop offset="0" stop-color="#FFE7A8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<radialGradient id="${id}Halo"><stop offset="0.86" stop-color="#D4AF63" stop-opacity="0"/><stop offset="0.94" stop-color="#D4AF63" stop-opacity="0.22"/><stop offset="1" stop-color="#D4AF63" stop-opacity="0"/></radialGradient>
</defs>`);
  parts.push(`<circle cx="${C}" cy="${C}" r="170" fill="url(#${id}Halo)"/>`);
  if (hud.tl) {
    parts.push(`<g font-family="'IBM Plex Mono',monospace" font-size="8.5" letter-spacing="1" fill="#A3967D">
<text x="2" y="12">${hud.tl}</text><text x="338" y="12" text-anchor="end">${hud.tr}</text>
<text x="2" y="334">${hud.bl}</text><text x="338" y="334" text-anchor="end">${hud.br}</text></g>`);
  }
  parts.push(`<circle cx="${C}" cy="${C}" r="166" fill="url(#${id}Sky)" stroke="#C9A14A" stroke-width="0.8"/>`);
  parts.push(`<g><circle cx="${C}" cy="${C}" r="160" fill="none" stroke="#C9A14A" stroke-width="1.2" stroke-dasharray="70 6 3 6 3 6" opacity="0.85"/><animateTransform attributeName="transform" type="rotate" from="0 ${C} ${C}" to="360 ${C} ${C}" dur="90s" repeatCount="indefinite"/></g>`);
  parts.push(`<g fill="none">
<circle cx="${C}" cy="${C}" r="153" stroke="#8A7040" stroke-width="4" stroke-dasharray="0.6 4.74"/>
<circle cx="${C}" cy="${C}" r="146" stroke="#C9A14A" stroke-width="0.8"/>
<circle cx="${C}" cy="${C}" r="126" stroke="#C9A14A" stroke-width="0.8"/>
<g stroke="#F0D89A" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.25"><circle cx="${C}" cy="${C}" r="112"/><circle cx="${C}" cy="${C}" r="96"/><circle cx="${C}" cy="${C}" r="80"/><circle cx="${C}" cy="${C}" r="66"/></g>
<g><circle cx="${C}" cy="${C}" r="120" stroke="#F0D89A" stroke-width="0.6" stroke-dasharray="2 9" opacity="0.4"/><animateTransform attributeName="transform" type="rotate" from="360 ${C} ${C}" to="0 ${C} ${C}" dur="140s" repeatCount="indefinite"/></g>
<g><path d="M${C} ${C}L${C} 44A126 126 0 0 1 233 60.9Z" fill="#F0D89A" opacity="0.07"/><path d="M${C} ${C}L233 60.9" stroke="#F0D89A" stroke-width="0.8" opacity="0.5"/><animateTransform attributeName="transform" type="rotate" from="0 ${C} ${C}" to="360 ${C} ${C}" dur="16s" repeatCount="indefinite"/></g>
<circle cx="${C}" cy="${C}" r="54" stroke="#C9A14A" stroke-width="0.8"/>
<path d="M170 122V152M170 188V218M122 170H152M188 170H218" stroke="#F0D89A" stroke-width="0.6" opacity="0.45"/>
</g>`);

  // major ticks every 30° aligned with sign boundaries, plus dividers and glyphs
  const div = [], ticks = [], glyphs = [], houses = [];
  for (let s = 0; s < 12; s++) {
    const a = screenAngle(chart, s * 30);
    const [x1, y1] = pt(126, a), [x2, y2] = pt(150, a), [t1x, t1y] = pt(149.5, a), [t2x, t2y] = pt(156.5, a);
    div.push(`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`);
    ticks.push(`M${f(t1x)} ${f(t1y)}L${f(t2x)} ${f(t2y)}`);
    const [gx, gy] = pt(136, screenAngle(chart, s * 30 + 15));
    const mine = chart.planets[0].sign === s;
    glyphs.push(`<text x="${f(gx)}" y="${f(gy)}"${mine ? ' fill="#FFE7A8" font-size="17"' : ''}>${SIGNS[s].glyph}&#xFE0E;</text>`);
  }
  if (showHouses) {
    for (let h = 1; h <= 12; h++) {
      const sign = (chart.firstSign + h - 1) % 12;
      const [hx, hy] = pt(118, screenAngle(chart, sign * 30 + 15));
      houses.push(`<text x="${f(hx)}" y="${f(hy)}">H${h}</text>`);
    }
  }
  parts.push(`<path d="${ticks.join('')}" stroke="#F0D89A" stroke-width="1.2"/>`);
  parts.push(`<path d="${div.join('')}" stroke="#C9A14A" stroke-width="0.8"/>`);
  if (showHouses) {
    const inner = [];
    for (let s = 0; s < 12; s++) {
      const a = screenAngle(chart, s * 30);
      const [x1, y1] = pt(126, a), [x2, y2] = pt(54, a);
      inner.push(`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`);
    }
    parts.push(`<path d="${inner.join('')}" stroke="#F0D89A" stroke-width="0.4" opacity="0.16"/>`);
  }

  // background stars (deterministic pseudo-random so the map is stable)
  let seed = Math.floor(chart.planets[0].lon * 1000) + 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const stars = [];
  for (let i = 0; i < 22; i++) {
    const r = 58 + rnd() * 64, a = rnd() * 360;
    const [x, y] = pt(r, a);
    const tw = i % 6 === 0 ? `<animate attributeName="opacity" values="0.2;1;0.2" dur="${(2.5 + rnd() * 2).toFixed(1)}s" repeatCount="indefinite"/>` : '';
    stars.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${(0.6 + rnd() * 0.8).toFixed(1)}" opacity="${(0.5 + rnd() * 0.5).toFixed(2)}">${tw}</circle>`);
  }
  parts.push(`<g fill="#F0D89A">${stars.join('')}</g>`);
  parts.push(`<g font-family="'Noto Sans Symbols 2','Noto Sans Symbols',serif" font-size="15" fill="#E8D2A0" text-anchor="middle" dominant-baseline="central">${glyphs.join('')}</g>`);
  if (showHouses) parts.push(`<g font-family="'IBM Plex Mono',monospace" font-size="7" fill="#8A7A5A" text-anchor="middle" dominant-baseline="central">${houses.join('')}</g>`);

  // rising axis
  if (chart.asc != null) {
    parts.push(`<path d="M116 170H20" stroke="#F0D89A" stroke-width="1.4"/><path d="M224 170H320" stroke="#F0D89A" stroke-width="0.8" opacity="0.5"/>
<g font-family="'IBM Plex Mono',monospace" font-size="7.5" letter-spacing="1.2" fill="#F0D89A" text-anchor="middle"><text x="92" y="182">ASC</text><text x="248" y="182" opacity="0.7">DSC</text></g>`);
  }

  // place planets on one of four orbit radii so glyphs do not collide
  const levels = [112, 96, 80, 66];
  const placed = [];
  const sorted = chart.planets.map((p) => ({ p, a: screenAngle(chart, p.lon) })).sort((x, y) => x.a - y.a);
  for (const item of sorted) {
    let lvl = 0;
    for (let L = 0; L < levels.length; L++) {
      const clash = placed.some((q) => q.lvl === L && Math.min(Math.abs(q.a - item.a), 360 - Math.abs(q.a - item.a)) < 11);
      if (!clash) { lvl = L; break; }
      lvl = (L + 1) % levels.length;
    }
    const [x, y] = pt(levels[lvl], item.a);
    placed.push({ ...item, lvl, x, y });
  }

  // aspect lines on the inner circle
  const lines = [];
  chart.aspects.filter((a) => a.nature !== 0).slice(0, 10).forEach((asp) => {
    const [x1, y1] = pt(54, screenAngle(chart, asp.a.lon));
    const [x2, y2] = pt(54, screenAngle(chart, asp.b.lon));
    const col = asp.nature > 0 ? '#8FB3E0' : '#E07A62';
    lines.push(`<path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${col}" stroke-width="0.8" opacity="0.85"/><circle cx="${f(x1)}" cy="${f(y1)}" r="1.5" fill="#F0D89A"/><circle cx="${f(x2)}" cy="${f(y2)}" r="1.5" fill="#F0D89A"/>`);
  });
  parts.push(lines.join(''));
  parts.push(`<path d="M170 164L172 168L176 170L172 172L170 176L168 172L164 170L168 168Z" fill="#FFE7A8"/>`);

  const glowEls = [], glyphEls = [], degEls = [];
  for (const q of placed) {
    const lum = q.p.id === 'sun' || q.p.id === 'moon';
    if (lum) {
      glowEls.push(`<circle cx="${f(q.x)}" cy="${f(q.y)}" r="14" fill="url(#${id}Glow)"><animate attributeName="r" values="12;18;12" dur="${q.p.id === 'sun' ? 4 : 5}s" repeatCount="indefinite"/></circle>`);
      degEls.push(`<text x="${f(q.x)}" y="${f(q.y + 18)}">${Math.floor(q.p.lon % 30)}°</text>`);
    } else {
      glowEls.push(`<circle cx="${f(q.x)}" cy="${f(q.y)}" r="9" fill="url(#${id}Glow)" opacity="0.55"/>`);
    }
    glyphEls.push(`<text x="${f(q.x)}" y="${f(q.y)}"${lum ? ' font-size="16"' : ''}>${q.p.glyph}&#xFE0E;</text>`);
  }
  parts.push(glowEls.join(''));
  parts.push(`<g font-family="'Noto Sans Symbols','Noto Sans Symbols 2',serif" font-size="12" fill="#FFF3CF" text-anchor="middle" dominant-baseline="central">${glyphEls.join('')}</g>`);
  parts.push(`<g font-family="'IBM Plex Mono',monospace" font-size="7.5" fill="#F0D89A" text-anchor="middle">${degEls.join('')}</g>`);

  const size = opts.size || 340;
  return `<svg role="img" aria-label="${opts.label || 'ผังดาวกำเนิด'}" width="${size}" height="${size}" viewBox="0 0 340 340" fill="none" style="max-width:100%;height:auto">${parts.join('')}</svg>`;
}

const KEY = 'taksila.v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ profile: state.profile })); } catch (e) { /* storage unavailable */ } }

// ---------------- state ----------------
const saved = load();
let installEvt = null; // saved install prompt (Android/desktop Chrome)
const state = {
  profile: saved.profile || null,
  chart: null,
  draft: null,
  placeQuery: '',
  chartTab: 0,
  liveOpen: false,
  aspOpen: new Set(),
  weekSel: null,
  ausp: { tab: 0, event: 'wedding', days: 60, partner: 0, open: 0 },
  match: { sign: null, useDate: false, day: 1, month: 1, yearBE: 2540 },
  tarot: { topic: 0, spread: 2, cards: null, deck: null, picks: [], flipped: [], sel: 0, q: '' },
  num: { mode: 'phone', value: '' },
  luck: { mode: 'ball', balls: [], inc: 'idle', incDigits: [], incShown: [], ss: null },
  ask: { topic: 0, messages: [] }
};
if (state.profile) state.chart = safeChart(state.profile);

function safeChart(p) { try { return computeChart(p); } catch (e) { console.error(e); return null; } }

const G = (glyph) => `<span class="sym" aria-hidden="true">${glyph}&#xFE0E;</span>`;
const thaiDate = (d) => `${d.getDate()} ${MONTHS_TH[d.getMonth()]} ${d.getFullYear() + 543}`;
const monthYear = (d) => `${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear() + 543}`;
const pad = (n) => String(n).padStart(2, '0');

function pageHead(n, code, title, color, iconName, extra = '') {

function blankDraft() {
  const p = state.profile;
  if (p) return JSON.parse(JSON.stringify({ ...p, placeIdx: p.placeIdx ?? -1, custom: p.custom || { lat: p.place.lat, lon: p.place.lon, offset: 7 } }));
  return { name: '', day: 1, month: 1, yearBE: 2540, hour: 12, minute: 0, timeKnown: true, placeIdx: 0, place: PLACES[0], custom: { lat: 13.75, lon: 100.5, offset: 7 } };
}
const daysIn = (m, yBE) => new Date(yBE - 543, m, 0).getDate();
const opts = (arr, sel) => arr.map(([v, t]) => `<option value="${v}"${String(v) === String(sel) ? ' selected' : ''}>${t}</option>`).join('');
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

function placeOptions() {
  const d = state.draft, q = state.placeQuery.trim();
  const list = PLACES.map((p, i) => ({ p, i })).filter(({ p }) => !q || (p.name + p.country).includes(q));
  const rows = list.map(({ p, i }) => `<button type="button" class="option" role="radio" aria-checked="${d.placeIdx === i}" data-act="place" data-i="${i}">
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">${p.name}, ${p.country}</span><span class="mono small" style="font-size:11px">${Math.abs(p.lat).toFixed(2)}°${p.lat >= 0 ? 'N' : 'S'} · ${Math.abs(p.lon).toFixed(2)}°${p.lon >= 0 ? 'E' : 'W'}</span></span><span class="radio-dot"></span></button>`);
  rows.push(`<button type="button" class="option" role="radio" aria-checked="${d.placeIdx === -1}" data-act="place" data-i="-1"><span style="font-size:14px;font-weight:500">กำหนดพิกัดเอง</span><span class="radio-dot"></span></button>`);
  return rows.join('');
}

  if (d.day > maxDay) d.day = maxDay;
  return `<main class="screen no-nav">

</header>
<label class="field">ชื่อที่ให้เรียก<input class="input" data-in="name" value="${esc(d.name)}" placeholder="เช่น มีนา" autocomplete="nickname"></label>

function bigThree(ch) {
  const sun = ch.planets[0], moon = ch.planets[1];
  return `<div class="big3">
<div><span class="label" style="font-size:9px">SUN</span><span class="v">${G(sun.glyph)} ${SIGNS[sun.sign].th}</span></div>
<div><span class="label" style="font-size:9px">MOON</span><span class="v">${G(moon.glyph)} ${SIGNS[moon.sign].th}</span></div>
<div><span class="label" style="font-size:9px">RISING</span><span class="v">${ch.asc != null ? SIGNS[signOf(ch.asc)].th : '<span class="small">ไม่ทราบเวลา</span>'}</span></div></div>`;
}

function hudFor(p) {
  const place = p.place;
  return {
    tl: `NATAL ${pad(p.day)}.${pad(p.month)}.${p.yearBE - 543}`,
    tr: p.timeKnown ? `${pad(p.hour)}:${pad(p.minute)} LOCAL` : 'TIME UNKNOWN',
    bl: `LAT ${Math.abs(place.lat).toFixed(2)}${place.lat >= 0 ? 'N' : 'S'}`,
    br: `LON ${Math.abs(place.lon).toFixed(2)}${place.lon >= 0 ? 'E' : 'W'}`
  };
}

function greeting(now) {
  const h = now.getHours();
  return h < 5 ? 'สวัสดียามดึก' : h < 10 ? 'สวัสดีตอนเช้า' : h < 12 ? 'สวัสดีตอนสาย' : h < 16 ? 'สวัสดีตอนบ่าย' : h < 19 ? 'สวัสดีตอนเย็น' : 'สวัสดียามค่ำ';
}

// ---------------- live daily reading ----------------
const pname = (id, th) => id === 'sun' ? 'ดวงอาทิตย์' : id === 'moon' ? 'ดวงจันทร์' : id === 'asc' ? 'ลัคนา' : 'ดาว' + th;
function when(d, now = new Date()) {
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(now)) / 86400000);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return diff === 0 ? 'วันนี้ ' + hm : diff === 1 ? 'พรุ่งนี้ ' + hm : `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${hm}`;
}
const natureColor = (n) => n > 0 ? 'var(--harmony)' : n < 0 ? 'var(--tension)' : 'var(--gold-2)';

const aspKey = (x) => `${x.mover.id}-${x.asp.id}-${x.target.id}`;
const targetGlyph = (t) => t.id === 'asc' ? '<span class="mono" style="font-size:10px;letter-spacing:.05em">ASC</span>' : `<span class="sym">${t.glyph}&#xFE0E;</span>`;

function liveDailyHTML() {
  const ch = state.chart, now = new Date();
  const dl = daily(ch, now);
  const la = liveAspects(ch, now);
  const up = upcomingIngresses(ch, now);
  const top = la[0];
  const open = state.liveOpen;
  const headline = top ? top.reason : dl.headline;
  const basis = top ? `${pname(top.mover.id, top.mover.th)}จร${top.asp.th}${pname(top.target.id, top.target.th)}ในดวงกำเนิด` : dl.basis;
  const timing = (x) => x.applying ? (x.exactAt ? `แม่นยำสุด ${when(x.exactAt, now)}` : 'ส่งผลหลายสัปดาห์') : 'กำลังคลายตัว';
  const trio = (x) => `<span class="sym">${x.mover.glyph}&#xFE0E;</span><span class="sym" style="color:${natureColor(x.asp.nature)}">${ASPECT_GLYPH[x.asp.id]}&#xFE0E;</span>${targetGlyph(x.target)}`;
  const items = la.map((x) => {
    const m = x.mover, t = x.target, col = natureColor(x.asp.nature), k = aspKey(x);
    const pct = Math.round(Math.min(1, x.strength / 1.6) * 100);
    const isOpen = state.aspOpen.has(k);
    return `<li class="asp${isOpen ? ' open' : ''}" style="--c:${col}">
<button class="asp-head" data-act="aspToggle" data-k="${k}" aria-expanded="${isOpen}">
<span class="asp-glyphs" aria-hidden="true">${trio(x)}</span>
<span class="asp-title"><span>${pname(m.id, m.th)}${x.asp.th}${pname(t.id, t.th)}</span><span class="mono">${timing(x)}</span></span>
<span class="chev">${icon('down', 16, 1.6)}</span>
</button>
<div class="fold"><div class="fold-in"><div class="asp-body">
<p class="body" style="font-size:14px">${x.reason}</p>
<p class="small" style="color:${col}">${x.advice}</p>
<dl class="asp-facts">
<div><dt>ดาวจร</dt><dd>${SIGNS[m.sign].th} ${fmtDeg(m.lon)}${m.retro ? ' (ถอยหลัง)' : ''} · ภพ ${m.house}</dd></div>
<div><dt>ดาวกำเนิด</dt><dd>${SIGNS[t.sign].th} ${fmtDeg(t.lon)}</dd></div>
<div><dt>ระยะห่าง</dt><dd>${x.off.toFixed(1)}° · ${x.applying ? 'กำลังเข้าใกล้' : 'ผ่านจุดแม่นยำแล้ว'}</dd></div>
<div><dt>น้ำหนัก</dt><dd><span class="tr-bar" role="img" aria-label="${pct}%"><span style="width:${pct}%;background:${col}"></span></span></dd></div>
</dl></div></div></div></li>`;
  }).join('');
  const nextEvents = up.slice(0, 4).map((e) => `<li><span class="sym" style="color:var(--gold-2)">${PLANETS.find((p) => p.id === e.id).glyph}&#xFE0E;</span>
<span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px">${pname(e.id, PLANETS.find((p) => p.id === e.id).th)}เข้าราศี${SIGNS[e.sign].th}</span><span class="small">ภพ ${e.house} · ${HOUSES[e.house - 1]}</span></span>
<span class="mono" style="font-size:10px;color:var(--gold);white-space:nowrap">${when(e.at, now)}</span></li>`).join('');
  return `<div class="card daily${open ? ' open' : ''}">
<span style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow" style="letter-spacing:.2em;display:flex;align-items:center;gap:8px"><span class="live-dot" aria-hidden="true"></span>TODAY · LIVE</span><span class="mono small" style="font-size:10px">อัปเดต ${pad(now.getHours())}:${pad(now.getMinutes())}</span></span>
<p class="h2" style="font-size:20px">${headline}</p>
<p class="small">ที่มา · <span style="color:var(--text)">${basis}</span></p>
<div class="score-grid">${dl.scores.map((s) => `<div><span>${s.name}</span><span class="bars" role="img" aria-label="${s.name} ${s.score} จาก 5">${[1, 2, 3, 4, 5].map((i) => `<span${i <= s.score ? ' class="on"' : ''}></span>`).join('')}</span></div>`).join('')}</div>
<button class="drawer-toggle" data-act="liveToggle" data-closed="ดูเหตุผล ${la.length} มุมดาว" aria-expanded="${open}">
<span class="peek" aria-hidden="true">${la.slice(0, 3).map((x) => `<span class="peek-chip">${trio(x)}</span>`).join('')}</span>
<span class="lbl">${open ? 'พับเก็บ' : `ดูเหตุผล ${la.length} มุมดาว`}</span>
<span class="chev">${icon('down', 16, 1.6)}</span>
</button>
<div class="fold"><div class="fold-in"><div class="drawer-body">
${la.length ? `<ul class="asp-list">${items}</ul>` : '<p class="small">วันนี้ไม่มีดาวจรทำมุมใกล้ดาวในดวงกำเนิด เป็นวันที่ค่อนข้างสงบ</p>'}
<p class="small legend">${G(ASPECT_GLYPH.conj)} ร่วม ${G(ASPECT_GLYPH.sext)} หกสิบ ${G(ASPECT_GLYPH.square)} ตั้งฉาก ${G(ASPECT_GLYPH.trine)} ตรีโกณ ${G(ASPECT_GLYPH.opp)} เล็ง</p>
<h3 class="label">ถัดไป · ดาวย้ายราศี</h3>
<ul class="next-list">${nextEvents}</ul>
</div></div></div>
</div>`;
}

// ---------------- Thai auspice: colours, numbers, ยามอัฏฐกาล ----------------
const sw = (n, label) => `<span class="swatch"><i style="background:${TH_PLANETS[n].hex}"></i><span><b>${label}</b>${TH_PLANETS[n].color}</span></span>`;
const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
function personalLuck() {
  const p = state.profile, bp = birthPlanet(p);
  return { bp, me: luckOf(bp), lagna: thaiLagna(state.chart) };
}
function currentYams(now = new Date()) {
  const { bp } = personalLuck();
  const all = yams(now, bp);
  const cur = all.find((y) => now >= y.start && now < y.end);
  const nextGood = all.find((y) => y.end > now && y !== cur && y.pos.tone === 2) || all.find((y) => y.end > now && y.pos.tone === 2);
  return { all, cur, nextGood };
}
function auspiceMiniHTML() {
  if (!state.chart) return '';
  const now = new Date(), today = dayColors(now), { me } = personalLuck(), { cur, nextGood } = currentYams(now);
  const best = today.money !== me.avoid ? today.money : today.work;
  return `<a class="card ausp-mini" href="#/auspice">
<span style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow" style="letter-spacing:.2em;color:var(--amber)">มงคลวันนี้ · ${TH_PLANETS[today.owner].day}</span>${icon('next', 14, 1.5)}</span>
<div class="ausp-row">
<div class="ausp-col"><span class="small">สีเสริมดวงคุณ</span><span class="dot-row"><i style="background:${TH_PLANETS[best].hex}"></i><b>${TH_PLANETS[best].color.split(' ')[0]}</b></span></div>
<div class="ausp-col"><span class="small">สีที่ควรเลี่ยง</span><span class="dot-row"><i style="background:${TH_PLANETS[me.avoid].hex}"></i><b>${TH_PLANETS[me.avoid].color.split(' ')[0]}</b></span></div>
<div class="ausp-col"><span class="small">เลขมงคล</span><b class="mono" style="font-size:16px;color:var(--gold-2)">${me.numbers.slice(0, 3).join(' ')}</b></div>
</div>
<span class="small" style="color:var(--text)">${cur ? `ตอนนี้ยาม${cur.pos.th} (${hm(cur.start)}–${hm(cur.end)})` : ''}${nextGood ? ` · ยามดีถัดไป <b style="color:var(--gold-2)">${hm(nextGood.start)}</b> ยาม${nextGood.pos.th}` : ''}</span>
</a>`;
}

function thaksaWheel(owner) {
  const t = thaksa(owner), R = 112, c = 150;
  const nodes = t.map((x, i) => {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2, x0 = c + R * Math.cos(a), y0 = c + R * Math.sin(a);
    const bad = x.id === 'kalakini', good = x.tone === 2;
    return `<g><line x1="${c}" y1="${c}" x2="${x0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#2C261B"/>
<circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="25" fill="#15120D" stroke="${bad ? '#E07A62' : good ? '#D4AF63' : '#3A3224'}" stroke-width="${good || bad ? 1.4 : 1}"/>
<circle cx="${x0.toFixed(1)}" cy="${(y0 - 7).toFixed(1)}" r="5" fill="${TH_PLANETS[x.planet].hex}"/>
<text x="${x0.toFixed(1)}" y="${(y0 + 6).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="${bad ? '#E07A62' : good ? '#F0D89A' : '#C9BCA2'}" font-weight="600">${x.th}</text>
<text x="${x0.toFixed(1)}" y="${(y0 + 17).toFixed(1)}" text-anchor="middle" font-size="8" fill="#A3967D">${TH_PLANETS[x.planet].th} ${x.planet}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 300 300" width="100%" style="max-width:320px;display:block;margin:0 auto" role="img" aria-label="ทักษาประจำตัว">
<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#2C261B" stroke-dasharray="2 4"/>${nodes}
<circle cx="${c}" cy="${c}" r="34" fill="#1B1711" stroke="#D4AF63"/><circle cx="${c}" cy="${c - 10}" r="6" fill="${TH_PLANETS[owner].hex}"/>
<text x="${c}" y="${c + 8}" text-anchor="middle" font-size="11" fill="#F1E6CF" font-weight="600">${TH_PLANETS[owner].th}</text>
<text x="${c}" y="${c + 20}" text-anchor="middle" font-size="8" fill="#A3967D">ดาวประจำตัว</text></svg>`;
}

function luckBlock(title, sub, L) {
  return `<div class="card" style="gap:12px"><span style="display:flex;flex-direction:column;gap:2px"><span class="h2" style="font-size:17px">${title}</span><span class="small">${sub}</span></span>
<div class="swatch-grid">${sw(L.money, 'การเงิน โชคลาภ')}${sw(L.work, 'การงาน')}${sw(L.patron, 'ผู้ใหญ่ อุปถัมภ์')}${sw(L.health, 'สุขภาพ')}</div>
<div class="swatch-avoid">${sw(L.avoid, 'ควรเลี่ยง (กาลกิณี)')}</div>
<p class="small">เลขถูกโฉลก <b class="mono" style="color:var(--gold-2);font-size:15px;letter-spacing:.1em">${L.numbers.join(' · ')}</b> · เลี่ยงเลข <b class="mono" style="color:var(--tension)">${L.avoid}</b></p></div>`;
}

}

    return `<li class="rk${open ? ' open' : ''}">

${ev.partner ? `<label class="field">วันเกิดของคู่ (เพื่อเลี่ยงกาลกิณีของทั้งสองคน)<select class="select" data-in="a.partner">${dayOpts.map(([v, t]) => `<option value="${v}"${v === a.partner ? ' selected' : ''}>${t}</option>`).join('')}</select></label>` : ''}

  const now = new Date(), p = state.profile, { bp, me, lagna } = personalLuck(), tab = state.ausp.tab;

const WEEKDAY_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const WEEKDAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const RATING_TH = ['', 'ระวังตัว', 'ค่อย ๆ ไป', 'กลาง ๆ', 'ดี', 'ดีมาก'];
const ratingColor = (r) => r >= 4 ? 'var(--gold-2)' : r <= 2 ? 'var(--tension)' : 'var(--muted)';
function moonIcon(ph, r = 7) {
  const k = Math.cos(ph.elongation * Math.PI / 180), rx = Math.abs(k) * r;
  const s1 = ph.waxing ? 1 : 0, s2 = ph.waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  return `<svg width="${2 * r + 2}" height="${2 * r + 2}" viewBox="${-r - 1} ${-r - 1} ${2 * r + 2} ${2 * r + 2}" aria-hidden="true"><circle r="${r}" fill="#2C261B" stroke="#5A4C33" stroke-width="0.6"/><path d="M0 ${-r}A${r} ${r} 0 0 ${s1} 0 ${r}A${rx.toFixed(2)} ${r} 0 0 ${s2} 0 ${-r}Z" fill="#F0D89A"/></svg>`;
}
let weekCache = null;
function weekData() {
  const now = new Date(), key = now.toDateString();
  if (!weekCache || weekCache.key !== key || weekCache.chart !== state.chart) weekCache = { key, chart: state.chart, days: weekAhead(state.chart, now) };
  return weekCache.days;
}
function weekHTML() {
  const days = weekData(), sel = state.weekSel;
  const strip = days.map((d, i) => `<button class="day${sel === i ? ' sel' : ''}" data-act="weekDay" data-i="${i}" aria-pressed="${sel === i}" aria-label="${WEEKDAY[d.date.getDay()]} ${d.date.getDate()} ${RATING_TH[d.rating]}">
<span class="wd">${i === 0 ? 'วันนี้' : WEEKDAY_SHORT[d.date.getDay()]}</span><span class="dn">${d.date.getDate()}</span>${moonIcon(d.phase)}
<span class="dots" aria-hidden="true">${[1, 2, 3, 4, 5].map((n) => `<i style="background:${n <= d.rating ? ratingColor(d.rating) : 'var(--line)'}"></i>`).join('')}</span></button>`).join('');
  let detail = '';
  if (sel != null) {
    const d = days[sel];
    detail = `<div class="card day-detail">
<span class="eyebrow" style="letter-spacing:.14em">${WEEKDAY[d.date.getDay()].toUpperCase()} ${d.date.getDate()} ${MONTHS_SHORT[d.date.getMonth()]} · ${d.phase.th}</span>
<p class="h2" style="font-size:18px;color:${ratingColor(d.rating)}">${RATING_TH[d.rating]}</p>
<p class="small">ดวงจันทร์อยู่ราศี${SIGNS[d.moonSign].th} ผ่านภพ ${d.moonHouse} ของคุณ เรื่อง${HOUSES[d.moonHouse - 1]}จะเด่นขึ้นมาในวันนี้ · ${d.phase.name}</p>
${d.top.length ? `<ul class="day-asp">${d.top.map((x) => `<li style="--c:${natureColor(x.asp.nature)}"><span class="asp-glyphs" aria-hidden="true"><span class="sym">${x.mover.glyph}&#xFE0E;</span><span class="sym" style="color:var(--c)">${ASPECT_GLYPH[x.asp.id]}&#xFE0E;</span>${targetGlyph(x.target)}</span>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:600">${pname(x.mover.id, x.mover.th)}${x.asp.th}${pname(x.target.id, x.target.th)}</span><span class="small">${x.reason}</span></span></li>`).join('')}</ul>` : '<p class="small">ดาวเคลื่อนเร็วไม่ทำมุมสำคัญ เป็นวันเรียบ ๆ เหมาะกับงานประจำ</p>'}
</div>`;
  }
  return `<h2 class="label" style="display:flex;justify-content:space-between"><span>7 วันข้างหน้า</span><span class="mono" style="font-size:10px;letter-spacing:.1em">กดดูรายวัน</span></h2>
<div class="week-strip">${strip}</div>${detail}`;
}

// Real-time refresh: recompute the live section every 30 seconds and announce sign changes.
let liveTimer = null;
let lastSigns = null;
function signSnapshot() {
  const now = new Date();
  return Object.fromEntries(['moon', 'sun', 'mercury', 'venus', 'mars'].map((id) => [id, signOf(lonOf(id, now))]));
}
function tickLive() {
  const box = document.getElementById('live-daily');
  if (!box || !state.chart) return;
  const snap = signSnapshot();
  if (lastSigns) {
    for (const id of Object.keys(snap)) {
      if (snap[id] !== lastSigns[id]) toast(`${pname(id, PLANETS.find((p) => p.id === id).th)}ย้ายเข้าราศี${SIGNS[snap[id]].th}แล้ว ดวงของคุณอัปเดตแล้ว`);
    }
  }
  lastSigns = snap;
  box.innerHTML = liveDailyHTML();
  const am = document.getElementById('auspice-mini');
  if (am) am.innerHTML = auspiceMiniHTML();
  const wk = document.getElementById('week');
  if (wk && weekCache && weekCache.key !== new Date().toDateString()) { state.weekSel = null; wk.innerHTML = weekHTML(); }
}
function startLive() {
  clearInterval(liveTimer);
  lastSigns = state.chart ? signSnapshot() : null;
  liveTimer = setInterval(tickLive, 30000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tickLive(); });

function keyPattern(ch) {
  const max = Math.max(...ch.signCount);
  if (max >= 3) {
    const s = ch.signCount.indexOf(max);
    const inSign = ch.planets.filter((p) => p.sign === s);
    const h = inSign[0].house;
    return {
      title: `ดาว ${max} ดวงรวมกันในราศี${SIGNS[s].th} ภพ ${h}`,
      body: `พลังชีวิตรวมอยู่ที่เรื่อง${HOUSES[h - 1]} และแสดงออกแบบชาว${SIGNS[s].th}: ${SIGNS[s].trait}`,
      code: inSign.map((p) => p.glyph).join(' ') + ' · ' + SIGNS[s].en.toUpperCase() + ' · H' + h
    };
  }
  const e = ch.elementCount.indexOf(Math.max(...ch.elementCount));
  return { title: `ธาตุ${ELEMENTS[e].th}เด่นที่สุดในดวง`, body: 'ดาวส่วนใหญ่อยู่ในราศีธาตุ' + ELEMENTS[e].th + ' เป็นพลังหลักที่ขับเคลื่อนชีวิต', code: ELEMENTS[e].id.toUpperCase() + ' DOMINANT' };
}

function viewMatch() {

  return `<main class="screen" style="--accent:var(--rose)">

</section>
<section class="card"><span class="eyebrow" style="color:var(--rose);letter-spacing:.2em">WHY</span>

const CARD_BACK = `<svg aria-hidden="true" viewBox="0 0 120 208" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
<defs><radialGradient id="cbg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#2A2140"/><stop offset="1" stop-color="#110E18"/></radialGradient>
<pattern id="cbp" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M6 0L12 6L6 12L0 6Z" fill="none" stroke="#3A3058" stroke-width=".6"/></pattern></defs>
<rect width="120" height="208" fill="url(#cbg)"/><rect width="120" height="208" fill="url(#cbp)"/>
<rect x="6" y="6" width="108" height="196" rx="4" fill="none" stroke="#D4AF63" stroke-width=".8"/><rect x="10" y="10" width="100" height="188" rx="3" fill="none" stroke="#D4AF63" stroke-width=".4" opacity=".6"/>
<g fill="none" stroke="#D4AF63" stroke-width=".7"><circle cx="60" cy="104" r="30"/><circle cx="60" cy="104" r="22" stroke-dasharray="1 2.4"/><path d="M60 64v80M20 104h80" opacity=".4"/></g>
<path d="M60 86l4 14 14 4-14 4-4 14-4-14-14-4 14-4z" fill="#F0D89A"/><circle cx="60" cy="40" r="1.6" fill="#F0D89A"/><circle cx="60" cy="168" r="1.6" fill="#F0D89A"/></svg>`;
const cardAstro = (c) => {
  if (c.major) return c.sign != null ? `ไพ่ประจำราศี${SIGNS[c.sign].th} ${SIGNS[c.sign].glyph}&#xFE0E;` : `ไพ่ประจำดาว${planetById(c.planet).th} ${planetById(c.planet).glyph}&#xFE0E;`;
  if (c.sign != null) return `ดาว${planetById(c.planet).th}ในราศี${SIGNS[c.sign].th} · ธาตุ${ELEMENTS[c.element].th}`;
  return `ธาตุ${ELEMENTS[c.element].th} · ชุด${c.suitInfo.th}`;
};
// How the card touches the person's own chart.
function cardLink(c, houseSign) {
  const ch = state.chart, out = [];
  const sun = ch.planets[0], moon = ch.planets[1], asc = ch.timeKnown ? signOf(ch.asc) : null;
  if (houseSign != null && c.sign === houseSign) out.push('ไพ่ใบนี้เป็นราศีเดียวกับภพนี้ของคุณ พลังส่งตรงเต็มที่');
  else if (houseSign != null && c.element != null && c.element === houseSign % 4) out.push(`ธาตุ${ELEMENTS[c.element].th}ของไพ่ตรงกับราศีของภพนี้ เสริมกันดี`);
  if (c.sign != null && c.sign === sun.sign) out.push(`ตรงกับราศีเกิดของคุณ (${SIGNS[sun.sign].th}) เรื่องนี้เกี่ยวกับตัวคุณโดยตรง`);
  else if (c.sign != null && c.sign === moon.sign) out.push(`ตรงกับราศีดวงจันทร์ของคุณ เรื่องนี้กระทบใจมาก`);
  else if (c.sign != null && c.sign === asc) out.push(`ตรงกับราศีลัคนาของคุณ คนรอบตัวจะเห็นผลชัด`);
  if (c.planet && ch.planets.find((p) => p.id === c.planet)) {
    const pl = ch.planets.find((p) => p.id === c.planet);
    if (ch.timeKnown) out.push(`ดาว${pl.th}ในดวงกำเนิดของคุณอยู่ภพ ${pl.house} เรื่อง${HOUSES[pl.house - 1].split(' ')[0]}จะได้รับผลของไพ่ใบนี้ด้วย`);
  }
  return out.slice(0, 2);
}
const lean = (c, rev) => rev ? (c.yes === 1 ? 0 : -1) : c.yes;
const LEAN_TH = { 1: 'ใช่ ไปได้', 0: 'ยังไม่ชัด รอดูอีกนิด', '-1': 'ยังไม่ใช่ตอนนี้' };

function tarotCardHTML(d, i, opts = {}) {
  const c = CARDS[d.i], open = state.tarot.flipped.includes(i);
  return `<button class="tc${open ? ' flipped' : ''}${opts.sel ? ' sel' : ''}${d.rev ? ' rev' : ''}" data-act="tarotFlip" data-i="${i}" aria-label="${open ? c.th + (d.rev ? ' กลับหัว' : '') : 'เปิดไพ่ใบที่ ' + (i + 1)}">
<span class="tc-in"><span class="tc-back">${CARD_BACK}</span><span class="tc-front"><img src="${c.img}" alt="${c.en}" loading="lazy" decoding="async"></span></span></button>`;
}

function tarotReading(d, i, spread) {
  const c = CARDS[d.i], t = state.tarot, topic = TAROT_TOPICS[t.topic];
  const pos = spread.pos[i];
  let field = topic.f, head = pos.th, houseSign = null, q = '';
  if (spread.house) {
    const h = HOUSE_READ[i];
    field = h.use; houseSign = (state.chart.firstSign + i) % 12; q = h.q;
    head = `ภพ ${i + 1} · ${q}`;
  }
  const main = d.rev ? c.rev : (field === 'up' ? c.up : c[field]);
  const extra = d.rev ? `ถ้าแก้จุดนี้ได้ พลังของไพ่จะกลับมา: ${field === 'up' ? c.up : c[field]}` : (field !== 'up' ? c.up : '');
  const links = cardLink(c, houseSign);
  return `<article class="reading">
<img class="r-img${d.rev ? ' rev' : ''}" src="${c.img}" alt="" loading="lazy">
<div class="r-body">
<span class="eyebrow" style="color:var(--violet);letter-spacing:.14em">${pos.en}${spread.house ? ' · ราศี' + SIGNS[houseSign].th : ''}${d.rev ? ' · กลับหัว' : ''}</span>
<h3 class="h2" style="font-size:18px">${spread.house ? '' : head + ': '}${c.th}</h3>
<span class="mono" style="font-size:10px;color:var(--muted)">${c.en}${spread.house ? ' · ' + head : ''}</span>
<span class="r-kw">${c.kw}</span>
<p class="body" style="font-size:14px">${main}</p>
${extra ? `<p class="small" style="color:var(--text-2)">${extra}</p>` : ''}
<p class="r-pic">ในภาพ: ${c.pic}</p>
<p class="r-astro">${cardAstro(c)}</p>
${links.map((l) => `<p class="r-link">✦ ${l}</p>`).join('')}
</div></article>`;
}

function tarotSummary(spread, cards) {
  const t = state.tarot;
  if (t.flipped.length < cards.length) return '';
  const C = cards.map((d) => ({ c: CARDS[d.i], rev: d.rev }));
  if (spread.id === 'one') {
    const l = lean(C[0].c, C[0].rev);
    return `<div class="card t-sum"><span class="eyebrow" style="color:var(--violet);letter-spacing:.16em">คำตอบจากไพ่</span><p class="h2" style="font-size:22px;color:${l > 0 ? 'var(--gold-2)' : l < 0 ? 'var(--tension)' : 'var(--text)'}">${LEAN_TH[l]}</p>${t.q ? `<p class="small">คำถาม: ${esc(t.q)}</p>` : ''}</div>`;
  }
  if (spread.id === 'two') {
    const sc = C.map((x) => lean(x.c, x.rev) * (x.c.major ? 1.5 : 1) + (x.rev ? -0.3 : 0));
    const pick = sc[0] === sc[1] ? 'ทั้งสองทางพลังพอ ๆ กัน เลือกทางที่ใจสบายกว่า' : `ไพ่เอียงไปทาง${sc[0] > sc[1] ? ' A' : ' B'} มากกว่า`;
    return `<div class="card t-sum"><span class="eyebrow" style="color:var(--violet);letter-spacing:.16em">สรุปสองทางเลือก</span><p class="h2" style="font-size:19px">${pick}</p>${t.q ? `<p class="small">คำถาม: ${esc(t.q)}</p>` : ''}</div>`;
  }
  if (spread.id === 'three') {
    const k = C.map((x) => x.c.kw.split(' · ')[0]);
    const end = lean(C[2].c, C[2].rev);
    return `<div class="card t-sum"><span class="eyebrow" style="color:var(--violet);letter-spacing:.16em">เส้นเรื่องของคุณ</span><p class="h2" style="font-size:17px">${k[0]} → ${k[1]} → ${k[2]}</p><p class="small">${end > 0 ? 'ปลายทางออกมาดี เดินต่อได้เลย' : end < 0 ? 'ปลายทางยังมีบทเรียน ใช้คำแนะนำในไพ่ใบสุดท้ายเพื่อเปลี่ยนผล' : 'อนาคตยังเปิดกว้าง ขึ้นอยู่กับการตัดสินใจตอนนี้'}</p></div>`;
  }
  const majors = C.map((x, i) => ({ ...x, h: i + 1 })).filter((x) => x.c.major);
  const suits = { w: 0, c: 0, s: 0, p: 0 }; C.forEach((x) => { if (x.c.suit) suits[x.c.suit] += 1; });
  const domSuit = Object.entries(suits).sort((a, b) => b[1] - a[1])[0];
  const revN = C.filter((x) => x.rev).length;
  const best = C.map((x, i) => ({ l: lean(x.c, x.rev) + (x.c.major ? 0.5 : 0), h: i + 1 })).sort((a, b) => b.l - a.l)[0];
  return `<div class="card t-sum"><span class="eyebrow" style="color:var(--violet);letter-spacing:.16em">ภาพรวม 12 ภพ</span>
<p class="h2" style="font-size:17px">ช่วงนี้ชีวิตคุณหมุนรอบเรื่อง${CARDS[0] && domSuit[1] >= 4 ? domSuit[0] === 'w' ? 'แรงบันดาลใจและการลงมือ' : domSuit[0] === 'c' ? 'ความรู้สึกและความรัก' : domSuit[0] === 's' ? 'ความคิดและการตัดสินใจ' : 'เงินและงาน' : 'หลายด้านพร้อมกัน'}</p>
<p class="small" style="color:var(--text)">ไพ่ชุดใหญ่ ${majors.length} ใบ${majors.length ? ` อยู่ภพ ${majors.map((x) => x.h).join(', ')} ซึ่งเป็นเรื่องที่ชะตากำลังขยับแรง` : ' ชีวิตช่วงนี้อยู่ในมือคุณเองมากกว่าโชคชะตา'} · ไพ่กลับหัว ${revN} ใบ${revN >= 5 ? ' มีหลายเรื่องที่ต้องแก้' : ''} · ภพที่ดีที่สุดคือภพ ${best.h} (${HOUSE_READ[best.h - 1].q})</p>
<p class="small">กดไพ่แต่ละภพเพื่ออ่านละเอียด</p></div>`;
}

function pickSlotsHTML() {
  const t = state.tarot, spread = SPREADS[t.spread], need = spread.pos.length;
  const slot = (k) => {
    const filled = k < t.picks.length;
    return `<span class="p-slot${filled ? ' on' : ''}${k === t.picks.length ? ' next' : ''}">${filled ? CARD_BACK : `<b>${k + 1}</b>`}</span>`;
  };
  return `<div class="p-slots ${spread.house ? 'h' : 'n' + need}">${Array.from({ length: need }, (_, k) => `<span class="p-wrap">${slot(k)}<span class="t-lbl">${spread.house ? 'ภพ ' + (k + 1) : spread.pos[k].th}</span></span>`).join('')}</div>
<p class="p-hint">${t.picks.length < need ? `ตั้งจิต แล้วเลือกไพ่ใบที่ <b>${t.picks.length + 1}</b> จาก ${need} ใบ${spread.house ? '' : ` · ${spread.pos[t.picks.length].th}`}` : 'ครบแล้ว กำลังวางไพ่...'}</p>`;
}

    }).join('')}</div></div>
<p class="small" style="text-align:center">เลื่อนซ้ายขวาเพื่อดูไพ่ทั้ง 78 ใบ แล้วแตะใบที่ใจเรียก</p>
<div style="display:flex;gap:8px"><button class="btn btn-line" data-act="tarotDraw" style="flex:1">สับใหม่</button><button class="btn btn-line" data-act="tarotReset" style="flex:1">เปลี่ยนแบบเปิดไพ่</button></div>`;
  } else if (!t.cards) {
    body = `<div class="t-pick">${SPREADS.map((x, i) => `<button class="t-sp" data-act="tarotSpread" data-i="${i}" aria-pressed="${i === t.spread}"><b>${x.th}</b><span>${x.sub}</span></button>`).join('')}</div>
${spread.house ? `<p class="small">เปิดไพ่ 12 ใบลงบนภพทั้ง 12 ของผังดาวคุณ ภพ 1 เริ่มที่ราศี${SIGNS[state.chart.firstSign].th} (ลัคนาของคุณ)</p>` : `<div class="seg" role="group" aria-label="หัวข้อ">${TAROT_TOPICS.map((x, i) => `<button aria-pressed="${i === t.topic}" data-act="tarotTopic" data-i="${i}">${x.th}</button>`).join('')}</div>

<div class="deck-stack" aria-hidden="true">${[0, 1, 2, 3, 4].map((k) => `<span style="--k:${k}">${CARD_BACK}</span>`).join('')}</div>

<p class="small" style="text-align:center">ตั้งจิตถึงคำถามให้ชัด แล้วค่อยกด</p>`;
  } else {
    const all = t.flipped.length === t.cards.length;
    const grid = spread.house
      ? `<div class="t-houses">${t.cards.map((d, i) => `<div class="t-slot"><span class="t-lbl">ภพ ${i + 1} ${SIGNS[(state.chart.firstSign + i) % 12].glyph}&#xFE0E;</span>${tarotCardHTML(d, i, { sel: all && t.sel === i })}</div>`).join('')}</div>`
      : `<div class="t-row n${t.cards.length}">${t.cards.map((d, i) => `<div class="t-slot">${tarotCardHTML(d, i)}<span class="t-lbl">${spread.pos[i].th}</span></div>`).join('')}</div>`;
    body = `${t.q && !spread.house ? `<p class="small" style="text-align:center">“${esc(t.q)}”</p>` : ''}

<div id="tarot-reading">${tarotReadingArea()}</div>
<div style="display:flex;gap:8px">${!all ? '<button class="btn" data-act="tarotAll" style="flex:1">เปิดทั้งหมด</button>' : ''}<button class="btn btn-line" data-act="tarotReset" style="flex:1">สับไพ่ใหม่</button></div>`;
  }
  return `<main class="screen" style="--accent:var(--violet)">
${pageHead('03', 'TAROT', 'ไพ่ทาโรต์', 'var(--violet)', 'tarot')}
${body}
<p class="small" style="text-align:center;font-size:11px">สำรับ Rider–Waite–Smith 78 ใบ ภาพวาดต้นฉบับของ Pamela Colman Smith (1909) · ความหมายตามตำรา A. E. Waite</p>
</main>`;
}

function tarotReadingArea() {
  const t = state.tarot, spread = SPREADS[t.spread];
  if (!t.cards) return '';
  const sum = tarotSummary(spread, t.cards);
  if (spread.house) {
    const all = t.flipped.length === t.cards.length;
    if (!all) return `<p class="small" style="text-align:center">แตะไพ่เพื่อเปิดทีละภพ หรือกด "เปิดทั้งหมด"</p>`;
    return sum + tarotReading(t.cards[t.sel], t.sel, spread);
  }
  const open = t.flipped.slice().sort((a, b) => a - b);
  if (!open.length) return `<p class="small" style="text-align:center">แตะที่ไพ่เพื่อเปิด</p>`;
  return sum + open.map((i) => tarotReading(t.cards[i], i, spread)).join('');
}

function reduceNum(n, keepMaster) {
  while (n > 9 && !(keepMaster && (n === 11 || n === 22 || n === 33))) n = String(n).split('').reduce((a, b) => a + +b, 0);
  return n;
}
function numResults() {
  const v = state.num.value.replace(/[^0-9]/g, '');
  if (!v) return '<p class="small">พิมพ์ตัวเลขเพื่อดูผลวิเคราะห์</p>';
  const sum = v.split('').reduce((a, b) => a + +b, 0);
  const red = reduceNum(sum, false);
  const src = state.num.mode === 'phone' ? v.slice(-7) : v;
  const pairs = [];
  for (let i = 0; i < src.length - 1; i++) {
    const a = +src[i], b = +src[i + 1];
    const bad = [7, 8].includes(a) || [7, 8].includes(b);
    const neutral = a === 0 || b === 0;
    pairs.push({ n: src[i] + src[i + 1], bad, neutral, meaning: DIGITS[a] + ' + ' + DIGITS[b] });
  }
  return `<p class="mono" style="font-size:13px;margin:0;color:var(--text-2)">SUM <span style="color:var(--teal)">${sum}</span> → ${red} · ${SUM_MEANING[red] || ''}</p>
${pairs.length ? `<h2 class="label" style="margin-top:6px">PAIRS · คู่เลข${state.num.mode === 'phone' ? ' (7 หลักท้าย)' : ''}</h2>
<div class="pairs">${pairs.map((p) => `<div class="${p.bad ? 'bad' : ''}"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:22px">${p.n}</span><span class="mono" style="font-size:12px;font-weight:600;color:${p.bad ? 'var(--tension)' : p.neutral ? 'var(--muted)' : 'var(--teal)'}">${p.bad ? '!' : p.neutral ? '·' : '+'}</span></div><span class="small" style="font-size:11px">${p.meaning}</span></div>`).join('')}</div>` : ''}
<p class="small">+ ส่งเสริม · ! ควรระวัง · · กลาง ๆ — ตามหลักเลขศาสตร์ไทยแบบทั่วไป เพื่อเป็นแนวทาง</p>`;
}

<label class="field">${m === 'phone' ? 'เบอร์โทรศัพท์' : 'ทะเบียนรถ (ใช้เฉพาะตัวเลข)'}<input class="input mono" style="font-size:20px;letter-spacing:.1em" inputmode="${m === 'phone' ? 'tel' : 'text'}" data-in="numValue" value="${esc(state.num.value)}" placeholder="${m === 'phone' ? '08X-XXX-XXXX' : 'กข 1234'}"></label>
<div id="num-results" style="display:flex;flex-direction:column;gap:10px">${numResults()}</div>
</main>`;

// ---------------- router ----------------
// Routes live in memory (and are mirrored to the URL hash when the host allows it),
// so the app also works inside sandboxed frames that ignore hash changes.
const NEEDS_PROFILE = ['home', 'chart', 'match', 'ask'];
let current = location.hash.replace(/^#\/?/, '');
function route() {
  let r = current || (state.profile ? 'home' : 'welcome');
  if (NEEDS_PROFILE.includes(r) && !state.chart) r = 'welcome';
  return r;
}
function go(r) {
  if (r !== 'setup') state.draft = null;
  current = r;
  try { history.replaceState(null, '', '#/' + r); } catch (e) { /* not allowed in some frames */ }
  render();
}
const VIEWS = { auspice: viewAuspice, welcome: viewWelcome, setup: viewSetup, home: viewHome, chart: viewChart, match: viewMatch, tarot: viewTarot, numbers: viewNumbers, luck: viewLuck, ask: viewAsk };
const root = document.getElementById('app');
let lastRoute = null;

function render() {
  const r = route();
  const view = VIEWS[r] || viewWelcome;
  const showNav = !['welcome', 'setup'].includes(r);
  root.innerHTML = view() + (showNav ? nav(r) : '');
  if (r === 'home') startLive(); else clearInterval(liveTimer);
  mountLuck();
  if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
  document.title = 'ตักศิลา · ' + ({ home: 'หน้าหลัก', chart: 'ผังดาว', match: 'คู่ดวง', tarot: 'ไพ่ทาโรต์', numbers: 'ศาสตร์ตัวเลข', luck: 'โชคลาภ', ask: 'ปรึกษา', setup: 'ข้อมูลกำเนิด' }[r] || 'อ่านดวงจากดาวจริง');
}
function toast(msg) {
  const el = document.createElement('div');

    }
    case 'ssReset': state.luck.ss = null; break;
    case 'ssMotion': askMotion().then((ok) => toast(ok ? 'พร้อมแล้ว เขย่ามือถือได้เลย' : 'เครื่องนี้ไม่รองรับการเขย่า ใช้วิธีกดค้างแทน')); return;
    case 'askTopic': state.ask.topic = i; state.ask.messages = []; break;
    case 'askChip': ask(el.dataset.q); return;
    default: return;
  }
  render();
});

function ask(q) {
  if (!q || !q.trim()) return;
  state.ask.messages.push({ me: true, text: q.trim() });
  state.ask.messages.push({ me: false, ...answer(state.ask.topic, q) });
  render();
  const chat = document.getElementById('chat');
  if (chat) chat.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
document.addEventListener('submit', (e) => {
  if (e.target.dataset.act !== 'askSend') return;
  e.preventDefault();
  const input = e.target.querySelector('input');
  ask(input.value);
});

document.addEventListener('input', (e) => {
  const key = e.target.dataset.in;
  if (!key) return;
  const v = e.target.value;
  if (key === 'tarotQ') { state.tarot.q = v; return; }
  if (key === 'placeQuery') {
    state.placeQuery = v;
    const list = document.getElementById('place-list');
    if (list) list.innerHTML = placeOptions();
    return;
  }
  if (key === 'numValue') {
    state.num.value = v;
    const box = document.getElementById('num-results');
    if (box) box.innerHTML = numResults();
    return;
  }
  if (key === 'name') { state.draft.name = v; return; }
  if (key.startsWith('c.')) { state.draft.custom[key.slice(2)] = v; return; }
});
document.addEventListener('change', (e) => {
  const key = e.target.dataset.in;
  if (!key) return;
  const v = +e.target.value;
  if (key.startsWith('m.')) { state.match[key.slice(2)] = v; render(); return; }
  if (key.startsWith('a.')) { state.ausp[key.slice(2)] = v; state.ausp.open = 0; render(); return; }
  if (['day', 'month', 'yearBE', 'hour', 'minute'].includes(key)) { state.draft[key] = v; if (key !== 'hour' && key !== 'minute') render(); }
});

window.addEventListener('hashchange', () => {
  const r = location.hash.replace(/^#\/?/, '');
  if (r && r !== current) go(r);
});
render();

// Installable app (PWA): only on the real website, which links a manifest.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && document.querySelector('link[rel="manifest"]')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); installEvt = e;
  const slot = document.getElementById('install-slot');
  if (slot) slot.innerHTML = installHTML();
});
window.addEventListener('appinstalled', () => { installEvt = null; const slot = document.getElementById('install-slot'); if (slot) slot.innerHTML = ''; toast('ติดตั้งตักศิลาบนหน้าจอเรียบร้อย'); });

})();
</script>
